name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
          npm ci

      - name: Static checks
        run: .githooks/pre-commit

      - name: Full tests
        run: cargo test --workspace

      - name: Cross-language smoke check
        run: |
          .venv/bin/maturin develop --quiet
          .venv/bin/python -m compileall -q python web
          node --check web/static/app.js
          .venv/bin/python -c "from gicg_env import GameSession; from web.app import create_app; assert GameSession and create_app().title"
