[workspace]
members = ["gicg_engine", "gicg_env"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
pyo3 = "0.29.2"
rand = "0.10.3"
rand_chacha = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
thiserror = "2.0.17"
