[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gicg-mono"
version = "0.4.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
train = [
    "gymnasium>=1.0,<2",
    "numpy>=2,<3",
    "pettingzoo>=1.24.3,<2",
    "torch>=2.8,<3",
]
dev = [
    "lizard==1.24.0",
    "maturin>=1.9,<2",
    "pre-commit-hooks==6.0.0",
    "pytest>=8,<10",
    "ruff==0.16.8",
]

[tool.maturin]
manifest-path = "gicg_env/Cargo.toml"
python-source = "python"
module-name = "gicg_env._native"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python", "tests", "web"]

[tool.ruff.lint]
select = ["B", "C90", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10
