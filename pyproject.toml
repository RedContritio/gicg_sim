[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gicg-mono"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
]

[tool.maturin]
manifest-path = "gicg_env/Cargo.toml"
python-source = "python"
module-name = "gicg_env._native"
