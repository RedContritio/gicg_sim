[tool.ruff]
line-length = 120
exclude = ['.venv', '__pycache__', 'artifacts']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
# Markers used across the test suite. Register them so `pytest --strict-markers`
# (used by some CI flows) does not warn on unknown marks.
#
# `smoke` — paradigm-symmetric e2e smoke contract per
# openspec/changes/core-network-generic-promotion Phase 4 / spec
# training-architecture A1: every paradigm SHALL provide
# `test_<paradigm>_smoke.py` (or a parametrized entry) with this marker,
# covering from-zero start + real forward/backward/optimizer.step + eval
# probe + paradigm-specific invariant.
#
# `smoke_full` — second-tier full smoke contract per
# openspec/changes/paradigm-smoke-full-tier spec training-architecture
# A1.6: every paradigm SHALL provide `test_<paradigm>_smoke_full.py`
# with this marker, covering full `tools.run` driver path + ≥ 100 step
# train + ≥ 2 ckpt save + standalone resume-from-ckpt verify. Default
# pytest collection EXCLUDES this tier via `addopts = -m "not smoke_full"`
# (~5-8 min per paradigm wall; opt-in via `pytest -m smoke_full` 大版本前跑)。
markers = [
    'smoke: paradigm e2e smoke (≤ 60s wall, real train + eval probe)',
    'smoke_full: paradigm full smoke (≤ 15min wall, 100+ step driver train + ckpt save/load verify)',
]
addopts = "-m 'not smoke_full'"
