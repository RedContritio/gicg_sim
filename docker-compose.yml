# gicg_mono — eval daemon + train one-shot.
#
# Resource limits are at the Docker Desktop VM level (Settings →
# Resources → 9 CPU / 18 GB), not per-service. Eval and train share
# the VM pool: train preempts when busy, eval keeps DSL parse cache
# warm across runs.
#
# Source code is bind-mounted (./:/app:rw) so host edits flow into
# containers without rebuilding the image. Use compose `build` only
# when Go engine code or requirements.txt changes.
#
# Usage:
#   docker compose build                         # build image (slow first time)
#   docker compose up -d eval                    # start eval daemon
#   docker compose run --rm train python -m tools.dataset.gen_bc configs/...
#   docker compose run --rm train python -m training.az.bc_train configs/...
#   docker compose down                          # stop eval, clean network
#
# Socket lives in named volume `eval_socket` (NOT host bind mount —
# Unix sockets don't survive macOS-Linux VM boundary via bind mount).
# Both services mount it at /var/run/gicg/, which holds eval.sock.

services:
  eval:
    build:
      context: .
      dockerfile: Dockerfile
    image: gicg:latest
    container_name: gicg-eval
    working_dir: /app
    volumes:
      - .:/app:rw
      - eval_socket:/var/run/gicg
    environment:
      - GICG_EVAL_SOCKET=/var/run/gicg/eval.sock
      - PYTHONPATH=/app
    command:
      - python
      - -m
      - tools.eval.eval_service
      - --socket
      - /var/run/gicg/eval.sock
      - --workers
      - "2"
      - --data-dir
      - data
    healthcheck:
      test: ["CMD", "test", "-S", "/var/run/gicg/eval.sock"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  train:
    image: gicg:latest
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app:rw
      - eval_socket:/var/run/gicg
    environment:
      - GICG_EVAL_SOCKET=/var/run/gicg/eval.sock
      - PYTHONPATH=/app
    depends_on:
      eval:
        condition: service_healthy
    profiles: ["run"]  # don't start with `compose up`; only via `compose run train ...`
    command: ["python", "-c", "print('specify training command')"]

volumes:
  eval_socket:
