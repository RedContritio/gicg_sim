<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>七圣召唤</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="topbar">
      <div>
        <p class="eyebrow">对局演练</p>
        <h1>七圣召唤</h1>
      </div>
      <div class="round hidden" id="round">第 1 回合</div>
      <button class="ghost hidden" id="restart" type="button">重新开局</button>
    </header>
    <section class="lobby" id="lobby">
      <div class="lobby-head">
        <p class="eyebrow">阵容配置</p>
        <h2>选择出战角色</h2>
      </div>
      <div class="team-selectors" id="team-selectors"></div>
      <button class="confirm lobby-start" id="start" type="button">开始对局</button>
    </section>
    <section class="game hidden" id="game">
      <section class="status" id="status">正在准备对局</section>
      <section class="board" id="board"></section>
      <section class="decision hidden" id="decision"></section>
    </section>
    <section class="notice hidden" id="notice"></section>
    <section class="dialog-layer hidden" id="dialog"></section>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
