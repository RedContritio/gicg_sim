terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  聚风屏障: 状态本角色将在下次行动时，直接使用技能：逆风奉还拳。准备逆风奉还拳期间：提供2点护盾，保护所附属角色；如果所附属角色受到了水/火/冰/雷元素伤害，就使所准备的逆风奉还拳造成的伤害+1，并且转换为对应的元素类型。
  逆风奉还拳: 元素战技（需准备1个行动轮）造成2点物理伤害。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰伤害扩散（水）：对目标以外的所有敌方角色造成1点水伤害扩散（火）：对目标以外的所有敌方角色造成1点火伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷伤害
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
