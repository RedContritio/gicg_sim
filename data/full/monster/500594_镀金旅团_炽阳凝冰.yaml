terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  蓄势猛击·倾力一击: 元素爆发（需准备2个行动轮）造成6点物理伤害。
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
  厄灵苏醒·冰: 状态角色造成的伤害+1，且造成的物理伤害变为冰元素伤害。此角色受到的冰元素伤害+2。持续回合：2
