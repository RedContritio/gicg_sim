  追影弹: 事件牌费用：3加入手牌时：若我方出战角色为火/水/雷/冰，则将此牌转化为对应元素。打出或从手牌中舍弃此牌时：优先对敌方出战角色造成1点风元素伤害，然后将一张追影弹随机放进牌库。
  舍弃: 通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。
