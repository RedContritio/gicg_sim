  effect_text: '战斗行动：我方出战角色为愚人众·火之债务处理人时，装备此牌。

    愚人众·火之债务处理人装备此牌后，立刻使用一次伺机而动火元素伤害，本角色附属潜行。

    潜行

    所附属角色受到的伤害-1，造成的伤害+1。

    可用次数：2

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的愚人众·火之债务处理人生成的潜行获得以下效果：

    初始可用次数+1，并且使所附属角色造成的物理伤害变为火元素伤害火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">。

    （牌组中包含愚人众·火之债务处理人，才能加入牌组）'
