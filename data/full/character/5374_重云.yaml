  effect_text: '战斗行动：我方出战角色为重云时，装备此牌。

    重云装备此牌后，立刻使用一次重华叠霜冰元素伤害，生成重华叠霜领域。

    重华叠霜领域

    我方单手剑、双手剑或长柄武器角色造成的物理伤害变为冰元素伤害。

    持续回合：2

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的重云生成的重华叠霜领域冰元素伤害。

    持续回合：2

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">获得以下效果：

    使我方单手剑、双手剑或长柄武器角色的普通攻击伤害+1。

    （牌组中包含重云，才能加入牌组）'
