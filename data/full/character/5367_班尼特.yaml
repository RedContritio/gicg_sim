  effect_text: '战斗行动战斗行动：

    我方执行了一次战斗行动后，会轮到对方行动。

    打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为班尼特时，装备此牌。

    班尼特装备此牌后，立刻使用一次美妙旅程火元素伤害，生成鼓舞领域。

    鼓舞领域

    我方角色使用技能时：如果该角色生命值至少为7，则使此伤害额外+2；技能结算后，如果该角色生命值不多于6，则治疗该角色2点。

    持续回合：2

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的班尼特生成的鼓舞领域，其伤害提升效果改为总是生效，不再具有生命值限制。

    （牌组中包含班尼特，才能加入牌组）'
