terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  激愈水球·大: 事件牌费用：0抓到此牌时：治疗我方出战角色3点。生成1张激愈水球·中，将其置于对方牌库顶部第2张牌的位置。
  生命之契: 状态所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏或分配生命值引发的治疗）可用次数：1（可叠加，没有上限）。
  激愈水球·中: 事件牌费用：0抓到此牌时：对所在阵营的出战角色造成2点水元素伤害。生成1张激愈水球·小，将其置于对方牌库顶部。
  激愈水球·小: 事件牌费用：0抓到此牌时：治疗所有我方角色1点，生成源水之滴。
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动;如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」「角色引发元素反应后」等效果。）只有「出战角色」才能准备技能;如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  满满心意药剂冲击: 元素爆发造成2点水元素伤害。
  源水之滴: 出战状态那维莱特进行普通攻击后：治疗那维莱特2点。如果那维莱特是我方「出战角色」，则准备技能：衡平推裁。可用次数：1（可叠加，最多叠加到3次）
  可用次数: 此牌效果触发后，会消耗1次可用次数;可用次数耗尽后，立刻弃置此牌。
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  弹跳水疗法: 元素战技生成1张激愈水球·大，将其置于我方牌库顶部第3张牌的位置，本角色附属3层生命之契。（触发激愈水球·大的效果后，会生成激愈水球·中并置入对方牌库；触发激愈水球·中的效果后，会生成激愈水球·小并置入我方牌库）
