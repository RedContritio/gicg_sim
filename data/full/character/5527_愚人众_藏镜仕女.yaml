  effect_text: '战斗行动：我方出战角色为愚人众·藏镜仕女时，装备此牌。

    愚人众·藏镜仕女装备此牌后，立刻使用一次潋波绽破水元素伤害，目标角色附属水光破镜。

    水光破镜

    所附属角色切换到其他角色时：需要多花费1个元素骰。

    持续回合：2

    （同一方场上最多存在一个此状态）

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。

    水元素伤害：

