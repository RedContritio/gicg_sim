  effect_text: '战斗行动：我方出战角色为凝光时，装备此牌。

    凝光装备此牌后，立刻使用一次璇玑屏岩元素伤害，生成璇玑屏。

    璇玑屏：

    我方出战角色受到至少为2的伤害时：抵消1点伤害。

    可用次数：2

    岩元素伤害：

    和已附着的元素发生元素反应：

    结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的凝光在场时，璇玑屏会使我方造成的岩元素伤害岩元素伤害：

    和已附着的元素发生元素反应：

    结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。" class="wiki-note-text">+1。

    （牌组中包含凝光，才能加入牌组）'
