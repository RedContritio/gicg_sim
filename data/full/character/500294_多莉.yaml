    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;萨扎莱宫的无微不至&lt;/strong&gt;：&lt;/p&gt;&lt;p&gt;元素爆发&lt;/p&gt;&lt;p&gt;造成1点雷元素伤害，召唤&lt;strong&gt;&lt;em&gt;灯中幽精&lt;/em&gt;&lt;/strong&gt;。&lt;/p&gt;"
