flavor_html: <p><strong>绮思晚星·莱依拉</strong></p><p>夜沉星移，月笼梦行。</p>
flavor_text: '绮思晚星·莱依拉

  夜沉星移，月笼梦行。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  安眠帷幕护盾: 出战状态提供2点护盾，保护我方出战角色。
  飞星: 出战状态我方角色使用技能后：累积1枚「晚星」。如果「晚星」已有至少4枚，则消耗4枚「晚星」，造成1点冰元素伤害。（生成此出战状态的技能，也会触发此效果）重复生成此出战状态时：累积2枚「晚星」。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  垂裳端凝之夜: 元素战技生成安眠帷幕护盾和飞星。
