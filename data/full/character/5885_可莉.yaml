  每一次抽牌，都可能带来一次「爆炸性惊喜」。'
terms:
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  爆裂火花: 状态所附属角色进行重击时：少花费1个火元素，并且伤害+1。可用次数：1重击：我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。火元素：花费投出了火元素的元素骰，来支付此费用。（万能元素也可以支付此费用。）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  轰轰火花: 出战状态所在阵营的角色使用技能后：对所在阵营的出战角色造成2点火元素伤害。可用次数：2火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  蹦蹦炸弹: 元素战技造成3点火元素伤害，本角色附属爆裂火花。爆裂火花所附属角色进行重击时：少花费1个火元素，并且伤害+1。可用次数：1重击：我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。火元素：花费投出了火元素的元素骰，来支付此费用。（万能元素也可以支付此费用。）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
