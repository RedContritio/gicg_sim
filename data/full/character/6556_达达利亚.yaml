    style=&quot;color: rgb(24, 144, 255)&quot;&gt;水元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;附着水元素，可发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;蒸发：&lt;/strong&gt;本伤害+2&lt;/p&gt;&lt;p&gt;&lt;strong&gt;感电：&lt;/strong&gt;本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;冻结：&lt;/strong&gt;本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）&lt;/p&gt;&lt;p&gt;&lt;strong&gt;绽放：&lt;/strong&gt;本伤害+1，生成使下次火元素或雷元素伤害+2的[&lt;strong&gt;草原核&lt;/strong&gt;]&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;重击&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;断流&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;所附属角色被击倒后：&lt;/strong&gt;对所在阵营的出战角色附属「断流」。&lt;/p&gt;&lt;p&gt;（处于&lt;strong&gt;「近战状态」&lt;/strong&gt;的&lt;strong&gt;达达利亚&lt;/strong&gt;攻击所附属角色时，会造成额外伤害。）&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;穿透伤害：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;持续回合：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;每回合结束阶段，&lt;strong&gt;持续回合&lt;/strong&gt;-1；&lt;/p&gt;&lt;p&gt;&lt;strong&gt;持续回合&lt;/strong&gt;耗尽后，立刻弃置此牌。&lt;/p&gt;"
