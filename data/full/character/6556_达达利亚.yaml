terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  近战状态: 状态角色造成的物理伤害转换为水元素伤害。角色进行重击后：目标角色附属断流。角色对附属有断流的角色造成的伤害+1；角色对已附属有断流的角色使用技能后：对下一个敌方后台角色造成1点穿透伤害。（每回合至多2次）持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。断流所附属角色被击倒后：对所在阵营的出战角色附属「断流」。（处于「近战状态」的达达利亚攻击所附属角色时，会造成额外伤害。）穿透伤害：穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
  断流: 状态所附属角色被击倒后：对所在阵营的出战角色附属「断流」。（处于「近战状态」的达达利亚攻击所附属角色时，会造成额外伤害。）持续回合：2
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
  远程状态: 状态所附属角色进行重击后：目标角色附属断流。重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。断流所附属角色被击倒后：对所在阵营的出战角色附属「断流」。（处于「近战状态」的达达利亚攻击所附属角色时，会造成额外伤害。）
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  魔王武装·狂澜: 元素战技切换为近战状态，然后造成2点水元素伤害。近战状态：状态角色造成的物理伤害转换为水元素伤害。角色进行重击后：目标角色附属断流。角色对附属有断流的角色造成的伤害+1；角色对已附属有断流的角色使用技能后：对下一个敌方后台角色造成1点穿透伤害。（每回合至多2次）持续回合：2断流：状态所附属角色被击倒后：对所在阵营的出战角色附属「断流」。（处于「近战状态」的达达利亚攻击所附属角色时，会造成额外伤害。）物理伤害：物理伤害不会附着元素，也不会发生元素反应。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。断流所附属角色被击倒后：对所在阵营的出战角色附属「断流」。（处于「近战状态」的达达利亚攻击所附属角色时，会造成额外伤害。）穿透伤害：穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
