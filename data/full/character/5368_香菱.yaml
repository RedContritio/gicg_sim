  effect_text: '战斗行动：我方出战角色为香菱时，装备此牌。

    香菱装备此牌后，立刻使用一次锅巴出击火元素伤害。

    可用次数：2

    火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的香菱施放锅巴出击时，自身也会造成1点火元素伤害火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">。

    （牌组中包含香菱，才能加入牌组）'
