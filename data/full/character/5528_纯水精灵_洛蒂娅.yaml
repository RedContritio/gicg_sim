  潮涌与激流: 元素爆发造成4点水元素伤害；我方每有1个召唤物，再使此伤害+1。元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
