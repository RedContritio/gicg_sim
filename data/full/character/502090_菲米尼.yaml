terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  佩伊刻计: 状态我方每抓1张牌后：此牌累积1层「压力阶级」。所附属角色使用浮冰增压时：如果「压力阶级」至少有2层，则移除此效果，使技能少花费1元素骰，且如果此技能结算后「压力阶级」至少有4层，则再额外造成2点物理伤害。
  潜猎模式: 状态我方抓3张牌后：提供1点护盾，保护所附属角色。（可叠加，最多叠加至2点）。所附属角色使用普通攻击或元素战技后：将原本元素骰费用最高的至多2张手牌置于牌库底，然后抓等量的牌。持续回合：2
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  浮冰增压: 元素战技造成2点冰元素伤害，若角色未附属佩伊刻计，则使其附属佩伊刻计。
