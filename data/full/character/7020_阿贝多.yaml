  effect_text: '战斗行动：我方出战角色为阿贝多时,装备此牌。

    阿贝多装备此牌后,立刻使用一次创生法·拟造阳华岩元素伤害。

    可用次数：3

    此召唤物在场：此召唤物在场，我方执行「切换角色」行动时：将此次切换视为「快速行动」而非「战斗行动」。（每回合1次）

    岩元素伤害：

    和已附着的元素发生元素反应：

    结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。

    快速行动：

    执行了一次快速行动后，我方可以继续进行其他行动。

    只有执行了一次战斗行动后，才会轮到对方行动。

    战斗行动：

    我方执行了一次战斗行动后，会轮到对方行动。

    打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">。

    装备有此牌的阿贝多在场时，如果我方场上存在阳华，则我方角色进行下落攻击时少花费1个无色元素无色元素：

    可以用任意类型的元素骰子组合，来支付此类费用。" class="wiki-note-text">，并且造成的伤害+1。

    (牌组中包含阿贝多，才能加入牌组)'
