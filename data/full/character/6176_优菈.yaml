    style=&quot;color: rgb(145, 213, 255)&quot;&gt;冰元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;附着冰元素，可发生元素反应:&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;融化：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;本伤害+2&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;超导：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;冻结：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）&lt;/span&gt;&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>时，会额外为<strong><em>光降之剑</em></strong>累积1点<strong>「能量层数」</strong>。</p><p>（牌组中包含优菈，才能加入牌组）</p>'
  effect_text: '战斗行动：我方出战角色为优菈时，装备此牌。

    优菈装备此牌后，立刻使用一次凝浪之光剑冰元素伤害，召唤光降之剑。

    光降之剑

    优菈使用「普通攻击」或「元素战技」时：此牌累积2点「能量层数」，但是优菈不会获得充能。

    结束阶段：弃置此牌，造成3点物理伤害；每有1点「能量层数」，都使此伤害+1。

    （影响此牌「可用次数」的效果会作用于「能量层数」。）

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）" class="wiki-note-text">。

    装备有此牌的优菈使用冰潮的涡旋冰元素伤害，如果本角色未附属冷酷之心，则使其附属冷酷之心。

    冷酷之心

    所附属角色使用冰潮的涡旋时：移除此状态，使本次伤害+3。

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）" class="wiki-note-text">时，会额外为光降之剑累积1点「能量层数」。

    （牌组中包含优菈，才能加入牌组）'
