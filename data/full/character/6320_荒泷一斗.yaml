  怒目鬼王: 状态所附属角色普通攻击造成的伤害+1，造成的物理伤害变为岩元素伤害。持续回合：2所附属角色普通攻击后：为其附属乱神之怪力。（每回合1次）物理伤害：物理伤害不会附着元素，也不会发生元素反应。岩元素伤害：和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。乱神之怪力：所附属角色进行重击时：造成的伤害+1。如果可用次数至少为2，则少花费1个无色元素。可用次数：1（可叠加，最多叠加到3次）
