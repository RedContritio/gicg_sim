terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  破局: 状态此状态初始具有1层「破局」；重复附属时，叠加1层「破局」。「破局」最多可以叠加到3层。结束阶段：叠加1层「破局」。所附属角色普通攻击时：如果「破局」已有2层，则消耗2层「破局」使造成的物理伤害转换为水元素伤害，并抓1张牌。
  玄掷玲珑: 出战状态我方角色普通攻击后：造成1点水元素伤害。持续回合：2
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  萦络纵命索: 元素战技造成3点水元素伤害，此角色的破局层数+2。
