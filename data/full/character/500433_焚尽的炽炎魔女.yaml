flavor_html: <p><strong>第八执行官·「女士」</strong></p><p>瞳仁中倒映着破晓的赤红，她最后展开烈焰之翼向黎明飞去。</p><p>「但那并不是曙光，亲爱的罗莎琳。那是焚尽一切的火海。」</p><p>但这也没什么所谓。因为她心中明白，自己早已被烈火吞没。</p>
flavor_text: '第八执行官·「女士」

  瞳仁中倒映着破晓的赤红，她最后展开烈焰之翼向黎明飞去。

  「但那并不是曙光，亲爱的罗莎琳。那是焚尽一切的火海。」

  但这也没什么所谓。因为她心中明白，自己早已被烈火吞没。'
terms:
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  炽热: 状态结束阶段：对所附属角色造成1点火元素伤害。可用次数：1所附属角色被附属严寒时，移除此效果。
  严寒: 状态结束阶段：对附属角色造成1点冰元素伤害。可用次数：1所附属角色被附属炽热时，移除此效果。
