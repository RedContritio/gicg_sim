  effect_text: '战斗行动：我方出战角色为瑶瑶时，装备此牌。

    瑶瑶装备此牌后，立刻使用一次云台团团降芦菔草元素伤害，治疗我方受伤最多的角色1点。

    可用次数：2

    草元素伤害：

    附着草元素，可发生元素反应：

    绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的瑶瑶生成的月桂·抛掷型，在可用次数仅剩余最后1次时造成的伤害和治疗各+1。

    （牌组中包含瑶瑶，才能加入牌组）'
