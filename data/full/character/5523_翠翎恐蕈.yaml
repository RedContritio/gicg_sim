terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
  活化激能: 状态本角色造成或受到元素伤害后：累积1层「活化激能」。（最多累积3层）结束阶段：如果「活化激能」层数已达到上限，就将其清空。同时，角色失去所有充能。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  不稳定孢子云: 元素战技造成3点草元素伤害。草元素伤害：附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
