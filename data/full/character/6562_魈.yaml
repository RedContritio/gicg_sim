  effect_text: '战斗行动：我方出战角色为魈时，装备此牌。

    魈装备此牌后，立刻使用一次靖妖傩舞风元素伤害，本角色附属夜叉傩面。

    夜叉傩面

    所附属角色造成的物理伤害变为风元素伤害，且角色造成的风元素伤害+1。

    所附属角色进行下落攻击时：伤害额外+2。

    所附属角色为出战角色，我方执行「切换角色」行动时：少花费1个元素骰。（每回合1次）

    持续回合：2

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害

    下落攻击

    角色被切换为「出战角色」后，本回合内的下一个战斗行动若为「普通攻击」，则被视为「下落攻击」。

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">。

