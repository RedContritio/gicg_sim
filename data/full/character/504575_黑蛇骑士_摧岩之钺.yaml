terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  岩元素伤害: 和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  附着岩元素: 不通过伤害附着岩元素时，发生的元素反应会忽略伤害效果：结晶（冰）：敌方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：敌方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：敌方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：敌方出战角色获得1点护盾（可叠加，最多2点）。
  巨钺强袭: 元素爆发造成3点岩元素伤害，准备技能大师之击。
  大师之击: 元素爆发造成3点岩元素伤害。
  摧岩伟力: 状态所附属角色造成的伤害+1，对处于护盾或减伤状态下的敌方角色则改为造成的伤害+3。可用次数：1（可叠加，没有上限）
