  effect_text: '战斗行动：我方出战角色为胡桃时，装备此牌。

    胡桃装备此牌后，立刻使用一次蝶引来生火元素伤害，且角色造成的火元素伤害+1。

    所附属角色进行重击时：目标角色附属血梅香。

    持续回合：2

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    重击

    我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。

    血梅香

    结束阶段：对所附属角色造成1点火元素伤害。

    可用次数：1

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的胡桃在生命值不多于6时，造成的火元素伤害火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">+1。

    （牌组中包含胡桃，才能加入牌组）'
