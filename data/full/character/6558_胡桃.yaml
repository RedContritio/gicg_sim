  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  蝶引来生: 元素战技本角色附属彼岸蝶舞。彼岸蝶舞所附属角色造成的物理伤害变为火元素伤害，且角色造成的火元素伤害+1。所附属角色进行重击时：目标角色附属血梅香。持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。血梅香结束阶段：对所附属角色造成1点火元素伤害。可用次数：1持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
