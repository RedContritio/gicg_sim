  雾凇秋分: 事件牌费用：0治疗目标角色1点，目标角色获得1点额外最大生命值。（每回合每个角色最多食用1次「料理」）
  白浪拂沙: 事件牌费用：2所有我方角色获得饱腹，并且下次使用技能时少花费1个元素骰。（每回合每个角色最多食用1次「料理」）
  一捧绿野: 事件牌费用：1所有我方角色获得饱腹，并且下次造成的伤害+1。（每回合每个角色最多食用1次「料理」）
