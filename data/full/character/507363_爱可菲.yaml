  可用次数: 此牌效果触发后，会消耗1次可用次数;可用次数耗尽后，立刻弃置此牌。
  冰元素相关反应: 冻结：本伤害+1，目标本回合无法行动。（受到物理或火元素伤害后提前解除，但是伤害+2）融化：本伤害+2。超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害。结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
