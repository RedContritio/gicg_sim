  icon: https://act-upload.mihoyo.com/wiki-user-upload/2025/10/21/258999284/bdb47c41b068190b9f0fd7fe1ca46bf3_792303922206996107.png
  effect_html: '<html><head></head><body><p><strong><u>战斗行动</u></strong><span data-type="详情"
    data-name="&lt;p&gt;&lt;strong&gt;战斗行动：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;我方执行了一次战斗行动后，会轮到对方行动。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;打出具有此规则的手牌是一个战斗行动，而非快速行动。&lt;/strong&gt;&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>：我方出战角色为<strong>八重神子</strong>时，装备此牌。</p><p>八重神子装备此牌后，立刻使用一次<strong><span
    style="color: rgb(212, 177, 6)"><u>大密法·天狐显真</u></span></strong><span data-type="详情"
    data-name="&lt;p&gt;&lt;strong&gt;大密法·天狐显真：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;元素爆发&lt;/u&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;造成4点&lt;strong&gt;&lt;span
    style=&#34;color: rgb(146, 84, 222)&#34;&gt;&lt;u&gt;雷元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;；如果我方场上存在&lt;strong&gt;杀生樱&lt;/strong&gt;，则将其消灭，然后生成&lt;strong&gt;天狐霆雷&lt;/strong&gt;。&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;&lt;strong&gt;杀生樱&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结束阶段：&lt;/strong&gt;造成1点&lt;strong&gt;&lt;span
    style=&#34;color: rgb(146, 84, 222)&#34;&gt;&lt;u&gt;雷元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;；&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;可用次数&lt;/u&gt;：3&lt;/strong&gt;（可叠加，最多叠加到6次）&lt;/p&gt;&lt;p&gt;&lt;strong&gt;我方宣布结束时：&lt;/strong&gt;如果此牌的&lt;strong&gt;可用次数&lt;/strong&gt;至少为4，则造成1点&lt;strong&gt;&lt;span
    style=&#34;color: rgb(146, 84, 222)&#34;&gt;雷元素伤害&lt;/span&gt;&lt;/strong&gt;。（需消耗&lt;strong&gt;可用次数&lt;/strong&gt;）&lt;/p&gt;&lt;/blockquote&gt;&lt;blockquote&gt;&lt;p&gt;&lt;strong&gt;天狐霆雷&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;我方选择行动前：&lt;/strong&gt;造成3点&lt;strong&gt;&lt;span
    style=&#34;color: rgb(146, 84, 222)&#34;&gt;&lt;u&gt;雷元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;可用次数&lt;/u&gt;：1&lt;/strong&gt;&lt;/p&gt;&lt;/blockquote&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;元素爆发：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&#34;color: rgb(146, 84, 222)&#34;&gt;雷元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;附着雷元素，可发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超载&lt;/strong&gt;：本伤害+2，目标强制切换到下一个角色&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超导&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;感电&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;原激化&lt;/strong&gt;：本伤害+1，生成使下2次草元素或雷元素伤害+1的[&lt;strong&gt;激化领域&lt;/strong&gt;]&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;可用次数：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;此牌效果触发后，会消耗1次&lt;strong&gt;可用次数&lt;/strong&gt;；&lt;/p&gt;&lt;p&gt;&lt;strong&gt;可用次数&lt;/strong&gt;耗尽后，立刻弃置此牌。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>。</p><p>装备有此牌的八重神子通过<strong>大密法·天狐显真</strong>消灭了<strong><em>杀生樱</em></strong>后，本回合下次使用<strong><u>野干役咒·杀生樱</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;野干役咒·杀生樱：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;召唤&lt;strong&gt;&lt;em&gt;杀生樱&lt;/em&gt;&lt;/strong&gt;。如果场上原本已存在&lt;strong&gt;&lt;em&gt;杀生樱&lt;/em&gt;&lt;/strong&gt;，则额外使其造成的伤害+1。（最多+1）&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>时少花费2个元素骰。</p><p>（牌组中包含八重神子，才能加入牌组）</p></body></html>'
  effect_text: '战斗行动：我方出战角色为八重神子时，装备此牌。

    八重神子装备此牌后，立刻使用一次大密法·天狐显真雷元素伤害；如果我方场上存在杀生樱，则将其消灭，然后生成天狐霆雷。

    杀生樱

    结束阶段：造成1点雷元素伤害；

    可用次数：3（可叠加，最多叠加到6次）

    我方宣布结束时：如果此牌的可用次数至少为4，则造成1点雷元素伤害。（需消耗可用次数）

    天狐霆雷

    我方选择行动前：造成3点雷元素伤害。

    可用次数：1

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    雷元素伤害：

    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

