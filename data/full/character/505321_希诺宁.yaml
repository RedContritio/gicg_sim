terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  夜魂加持: 状态所附属角色可累积「夜魂值」。（最多累积到2点）
  刃轮装束: 状态所附属角色造成的物理伤害变为岩元素伤害。特技：高速腾跃所附属角色「夜魂值」为0时，弃置此牌；此牌被弃置时，所附属角色结束夜魂加持。
  高速腾跃: 特技花费：2附属角色消耗1点「夜魂值」，抓3张牌。
  岩元素伤害: 和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  「源音采样」·岩: 状态回合开始时：如果所附属角色拥有2点「夜魂值」，则在敌方场上生成受到的岩元素伤害增加。激活全部「源音采样」后，消耗2点「夜魂值」。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  音火锻淬: 元素战技本角色附属刃轮装束，进入夜魂加持并获得1点「夜魂值」。（角色进入夜魂加持后不可使用此技能）（附属刃轮装束的角色可以使用特技：高速腾跃）
