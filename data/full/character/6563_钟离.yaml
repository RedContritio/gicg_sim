  effect_text: '战斗行动：我方出战角色为钟离时，装备此牌。

    钟离装备此牌后，立刻使用一次地心·磐礴岩元素伤害，召唤岩脊，生成玉璋护盾。

    岩脊

    结束阶段：造成1点岩元素伤害。

    可用次数：2

    玉璋护盾

    为我方出战角色提供2点护盾。

    护盾：

    此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。

    岩元素伤害：

    和已附着的元素发生元素反应：

    结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

