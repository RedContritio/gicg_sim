terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  隐具余数: 状态隐具余数最多可以叠加到3层。角色使用眩惑光戏法时：每层隐具余数使伤害+1。技能结算后，耗尽隐具余数，每层治疗角色1点。
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  隐具魔术箭: 普通攻击造成2点火元素伤害，召唤怪笑猫猫帽，累积1层隐具余数。如果本角色生命值至少为6，则对自身造成1点穿透伤害。
  怪笑猫猫帽: 状态结束阶段：造成1点火元素伤害。可用次数：1（可叠加，最多叠加到2次）
