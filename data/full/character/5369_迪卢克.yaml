  effect_text: '战斗行动：我方出战角色为迪卢克时，装备此牌。

    迪卢克装备此牌后，立刻使用一次逆焰之刃火元素伤害。每回合第三次使用本技能时，伤害+2。

    火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">。

    装备有此牌的迪卢克每回合第2次与第3次使用逆焰之刃时，少花费1个火元素。

    （牌组中包含迪卢克，才能加入牌组）'
