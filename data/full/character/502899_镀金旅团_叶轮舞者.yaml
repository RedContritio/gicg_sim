flavor_text: '旋舞之忆·叶轮舞者

  「沙之民有音乐与舞蹈的传统，起初是对神的礼赞，后来则是讨取王者欢心的演艺与战斗的技术。」'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  灵蛇祝福: 出战状态我方使用厄灵·草之灵蛇的特技时：此特技造成的伤害+1，并且不消耗厄灵·草之灵蛇的可用次数。可用次数：1（可叠加，没有上限）
  厄灵·草之灵蛇: 厄灵·草之灵蛇装备牌费用：0特技：藤蔓锋鳞可用次数：2（角色最多装备1个「特技」）
  藤蔓锋鳞: 特技费用：1+1点充能造成1点草元素伤害。
  特技: 出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。
  可用次数: 此牌效果触发后，会消耗1次可用次数;可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  蔓延旋舞: 元素战技造成3点草元素伤害，生成1层灵蛇祝福。
