  effect_text: '战斗行动：我方出战角色为温迪时，装备此牌。

    温迪装备此牌后，立刻使用一次高天之歌风元素伤害，生成风域。

    风域

    我方执行「切换角色」行动时：少花费1个元素骰。

    可用次数：2

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害" class="wiki-note-text">。

    装备有此牌的温迪生成的风域触发后，会使本回合中我方角色下次「普通攻击」少花费1个无色元素。

    （牌组中包含温迪，才能加入牌组）'
