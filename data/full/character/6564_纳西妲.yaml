  effect_text: '战斗行动：我方出战角色为纳西妲时，装备此牌。

    纳西妲装备此牌后，立刻使用一次心景幻成草元素伤害，生成摩耶之殿。

    摩耶之殿

    我方引发元素反应时：伤害额外+1。

    持续回合：2

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。

    草元素伤害：

    附着草元素，可发生元素反应：

    绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">。

    装备有此牌的纳西妲在场时，根据我方队伍中存在的元素类型提供效果：

    火元素：摩耶之殿在场时，自身受到元素反应触发蕴种印的敌方角色，所受蕴种印的穿透伤害改为草元素伤害草元素伤害：

    附着草元素，可发生元素反应：

    绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">；

    雷元素：摩耶之殿入场时，使当前对方场上蕴种印的可用次数+1；

    水元素：装备有此牌的纳西妲所生成的摩耶之殿初始持续回合+1。

    （牌组中包含纳西妲，才能加入牌组）'
