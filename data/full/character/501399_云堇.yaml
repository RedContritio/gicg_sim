terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  飞云旗阵: 出战状态我方角色进行普通攻击时：如果我方手牌数量不多于1，则此技能少花费1个元素骰。可用次数：1（可叠加，最多叠加到4次）可用次数：1（可叠加，最多叠加到4次）
  旋云护盾: 状态准备技能期间：提供2点护盾，保护所附属的角色。
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」「角色引发元素反应后」等效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  长枪开相: 元素战技造成2点岩元素伤害；如果本回合中我方舍弃或调和过至少1张牌，则此伤害+1。
  岩元素伤害: 和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  破嶂见旌仪: 元素爆发造成2点岩元素伤害，生成3层飞云旗阵。
