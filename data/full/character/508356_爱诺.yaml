flavor_text: 叮铃哐啷，奇思成真。
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  敏捷切换: 出战状态我方下次执行「切换角色」行动时：将此次切换视为「快速行动」而非「战斗行动」。（可叠加，没有上限）快速行动：执行了一次快速行动后，我方可以继续进行其他行动。只有执行了一次战斗行动后，才会轮到对方行动。战斗行动：我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  赋能: 此牌费用改为花费对应数量的任意元素骰。调和此牌时：转换的元素类型改为万能元素。
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  精密水冷仪: 元素爆发造成2点水元素伤害，召唤冷静一下鸭。冷静一下鸭结束阶段：造成2点水元素伤害。可用次数：2元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]月感电：生成回合结束时造成2点雷元素伤害的[雷暴云]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[电击]）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  当前元素骰费用: 行动牌被赋予费用增加和费用降低时，当前元素骰费用会对应变化。（打出时少花费元素骰的效果不会影响此费用）
