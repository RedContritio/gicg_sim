    84, 222)&quot;&gt;雷元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;附着雷元素，可发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超载&lt;/strong&gt;：本伤害+2，目标强制切换到下一个角色&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超导&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;感电&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;原激化&lt;/strong&gt;：本伤害+1，生成使下2次草元素或雷元素伤害+1的[&lt;strong&gt;激化领域&lt;/strong&gt;]&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>，然后分别<strong><u>准备技能</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;&lt;span&gt;准备技能：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;有些技能无法被直接使用，而是需要一定次数的行动轮来进行&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;轮到一位牌手行动时，如果该牌手的「出战角色」正在&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;技能，则跳过该牌手的行动；如果技能已经完成&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;，角色将会在此时直接使用此技能。（此类需要&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;的技能，无法触发「使用技能后」效果。）&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;只有「出战角色」才能&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;技能；如果正在&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;技能的「出战角色」被切换到后台，技能的&lt;/span&gt;&lt;strong&gt;&lt;span&gt;准备&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;就会被打断。&lt;/span&gt;&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>：<strong><u>猜拳三连击·剪刀</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;猜拳三连击·剪刀：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;（需准备1个行动轮）&lt;/p&gt;&lt;p&gt;造成2点&lt;strong&gt;&lt;span
    style=&quot;color: rgb(146, 84, 222)&quot;&gt;&lt;u&gt;雷元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;，然后&lt;strong&gt;&lt;u&gt;准备技能&lt;/u&gt;&lt;/strong&gt;：&lt;strong&gt;&lt;u&gt;猜拳三连击·布&lt;/u&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(146, 84, 222)&quot;&gt;雷元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;附着雷元素，可发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超载&lt;/strong&gt;：本伤害+2，目标强制切换到下一个角色&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超导&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;感电&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;原激化&lt;/strong&gt;：本伤害+1，生成使下2次草元素或雷元素伤害+1的[&lt;strong&gt;激化领域&lt;/strong&gt;]&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;准备技能：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;有些技能无法被直接使用，而是需要一定次数的行动轮来进行&lt;strong&gt;准备&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;轮到一位牌手行动时，如果该牌手的「出战角色」正在&lt;strong&gt;准备&lt;/strong&gt;技能，则跳过该牌手的行动；如果技能已经完成&lt;strong&gt;准备&lt;/strong&gt;，角色将会在此时直接使用此技能。（此类需要&lt;strong&gt;准备&lt;/strong&gt;的技能，无法触发「使用技能后」效果。）&lt;/p&gt;&lt;p&gt;只有「出战角色」才能&lt;strong&gt;准备&lt;/strong&gt;技能；如果正在&lt;strong&gt;准备&lt;/strong&gt;技能的「出战角色」被切换到后台，技能的&lt;strong&gt;准备&lt;/strong&gt;就会被打断。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;猜拳三连击·布：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;（需准备1个行动轮）&lt;/p&gt;&lt;p&gt;造成3点&lt;strong&gt;&lt;span
    style=&quot;color: rgb(146, 84, 222)&quot;&gt;雷元素伤害&lt;/span&gt;&lt;/strong&gt;。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>和<strong><u>猜拳三连击·布</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;猜拳三连击·布：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;（需准备1个行动轮）&lt;/p&gt;&lt;p&gt;造成3点&lt;strong&gt;&lt;span
    style=&quot;color: rgb(146, 84, 222)&quot;&gt;雷元素伤害&lt;/span&gt;&lt;/strong&gt;。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>。</p>'
  effect_text: 造成2点雷元素伤害雷元素伤害：附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]"
    class="wiki-note-text">，然后分别准备技能：猜拳三连击·剪刀雷元素伤害，然后准备技能：猜拳三连击·布。雷元素伤害：附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]准备技能：有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。猜拳三连击·布：元素战技（需准备1个行动轮）造成3点雷元素伤害。"
    class="wiki-note-text">和猜拳三连击·布雷元素伤害。" class="wiki-note-text">。
