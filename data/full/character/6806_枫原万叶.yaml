    207, 201)&quot;&gt;风元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;和已附着的元素发生元素反应：&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（冰）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点冰元素伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（水）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点水元素伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（火）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点火元素伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（雷）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点雷元素伤害&lt;/span&gt;&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>，本角色附属<strong><u>乱岚拨止</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;乱岚拨止：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;状态&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;我方下次通过「切换角色」行动切换到所附属角色时：&lt;/span&gt;&lt;/strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;将此次切换视为「&lt;/span&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;&lt;u&gt;快速行动&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;」而非「&lt;/span&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;&lt;u&gt;战斗行动&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;」。&lt;br&gt;&lt;/span&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;我方选择行动前：&lt;/span&gt;&lt;/strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;如果所附属角色为「出战角色」，则直接使用「普通攻击」；本次「普通攻击」造成&lt;/span&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;&lt;u&gt;物理伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;变为&lt;/span&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(19, 194, 194)&quot;&gt;&lt;u&gt;风元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;&lt;span
    style=&quot;color: rgb(0, 0, 0)&quot;&gt;，结算后移除此效果。&lt;/span&gt;&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;快速行动：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;执行了一次快速行动后，我方可以继续进行其他行动。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;只有执行了一次战斗行动后，才会轮到对方行动。&lt;/span&gt;&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;战斗行动：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;我方执行了一次战斗行动后，会轮到对方行动。&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;打出具有此规则的手牌是一个战斗行动，而非快速行动。&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;物理伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;物理伤害不会附着元素，也不会发生元素反应。&lt;/span&gt;&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(54, 207, 201)&quot;&gt;风元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span&gt;和已附着的元素发生元素反应：&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（冰）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点冰元素伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（水）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点水元素伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（火）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点火元素伤害&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span&gt;扩散（雷）：&lt;/span&gt;&lt;/strong&gt;&lt;span&gt;对目标以外的所有敌方角色造成1点雷元素伤害&lt;/span&gt;&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>。</p><p>如果此技能引发了扩散，则將<strong>乱岚拨止</strong>转换为被扩散的元素。</p><p><strong>此技能结算后：</strong>我方切换到后一个角色。</p>'
  effect_text: 造成1点风元素伤害风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害"
    class="wiki-note-text">，本角色附属乱岚拨止我方下次通过「切换角色」行动切换到所附属角色时：将此次切换视为「快速行动」而非「战斗行动」。我方选择行动前：如果所附属角色为「出战角色」，则直接使用「普通攻击」；本次「普通攻击」造成物理伤害变为风元素伤害，结算后移除此效果。快速行动：执行了一次快速行动后，我方可以继续进行其他行动。只有执行了一次战斗行动后，才会轮到对方行动。战斗行动：我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。物理伤害：物理伤害不会附着元素，也不会发生元素反应。风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害"
    class="wiki-note-text">。如果此技能引发了扩散，则將乱岚拨止转换为被扩散的元素。此技能结算后：我方切换到后一个角色。
