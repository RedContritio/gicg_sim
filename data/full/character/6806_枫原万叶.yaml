    style=&#34;color: rgb(0, 0, 0)&#34;&gt;，结算后移除此效果。&lt;/span&gt;&lt;/p&gt;&lt;/blockquote&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;快速行动：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;执行了一次快速行动后，我方可以继续进行其他行动。&lt;/p&gt;&lt;p&gt;只有执行了一次战斗行动后，才会轮到对方行动。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;战斗行动：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;我方执行了一次战斗行动后，会轮到对方行动。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;打出具有此规则的手牌是一个战斗行动，而非快速行动。&lt;/strong&gt;&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;物理伤害：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;物理伤害不会附着元素，也不会发生元素反应。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&#34;color: rgb(54, 207, 201)&#34;&gt;风元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;和已附着的元素发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（冰）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点冰元素伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（水）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点水元素伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（火）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点火元素伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（雷）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点雷元素伤害&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>。</p><p>装备有此牌的枫原万叶引发扩散反应后：使我方角色和召唤物接下来2次所造成的被扩散元素类型的伤害+1。（每种元素类型分别计算次数）</p><p>（牌组中包含枫原万叶，才能加入牌组）</p></body></html>'
  effect_text: '战斗行动：我方出战角色为枫原万叶时，装备此牌。

    枫原万叶装备此牌后，立刻使用一次千早振造成1点风元素伤害，本角色附属乱岚拨止。

    如果此技能引发了扩散，则将乱岚拨止转换为被扩散的元素。

    此技能结算后：我方切换到下一个角色。

    乱岚拨止

    我方下次通过「切换角色」行动切换到所附属角色时：将此次切换视为「快速行动」而非「战斗行动」。

    我方选择行动前：如果所附属角色为「出战角色」，则直接使用「普通攻击」；本次「普通攻击」造成物理伤害变为风元素伤害，结算后移除此效果。

    快速行动：

    执行了一次快速行动后，我方可以继续进行其他行动。

    只有执行了一次战斗行动后，才会轮到对方行动。

    战斗行动：

    我方执行了一次战斗行动后，会轮到对方行动。

    打出具有此规则的手牌是一个战斗行动，而非快速行动。

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害" class="wiki-note-text">。

    装备有此牌的枫原万叶引发扩散反应后：使我方角色和召唤物接下来2次所造成的被扩散元素类型的伤害+1。（每种元素类型分别计算次数）

    （牌组中包含枫原万叶，才能加入牌组）'
