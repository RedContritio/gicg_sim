  雷元素附魔: 状态所附属角色造成的物理伤害变为雷元素伤害。持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。雷元素伤害：附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
