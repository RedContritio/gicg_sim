terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  岩元素伤害: 和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  护体岩铠: 出战状态为我方出战角色提供2点护盾。此护盾耗尽前，我方受到的物理伤害减半。（向上取整）护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。物理伤害：物理伤害不会附着元素，也不会发生元素反应。
  大扫除: 状态角色使用普通攻击时：少花费1个岩元素。（每回合1次）角色普通攻击造成的伤害+2，造成的物理伤害变为岩元素伤害。持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。岩元素伤害：和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  护心铠: 元素战技造成1点岩元素伤害，生成护体岩铠。护体岩铠：为我方出战角色提供2点护盾。此护盾耗尽前，我方受到的物理伤害减半。（向上取整）岩元素伤害：和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。物理伤害：物理伤害不会附着元素，也不会发生元素反应。
