flavor_html: '<p style="white-space: pre-wrap;"><strong>琉焰华舞·宵宫</strong></p><p style="white-space:
  pre-wrap;">花见坂第十一届全街邀请赛「长野原队」队长兼首发牌手。</p>'
flavor_text: '琉焰华舞·宵宫

  花见坂第十一届全街邀请赛「长野原队」队长兼首发牌手。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  庭火焰硝: 状态所附属角色普通攻击伤害+1，造成的物理伤害变为火元素伤害。可用次数：3物理伤害：物理伤害不会附着元素，也不会发生元素反应。火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  琉金火光: 出战状态宵宫以外的我方角色使用技能后：造成1点火元素伤害。持续回合：2火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  焰硝庭火舞: 元素战技本角色附属庭火焰硝。（此技能不产生充能）庭火焰硝所附属角色普通攻击伤害+1，造成的物理伤害变为火元素伤害。可用次数：3物理伤害：物理伤害不会附着元素，也不会发生元素反应。火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
