flavor_text: 因为啃噬伟大的生命体，而扭曲异变的掠食者。驱使着狂乱的蔓草之力。
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  噬骸能量块: 事件牌费用：0随机舍弃1张当前元素骰费用最高的手牌，生成1个我方出战角色类型的元素骰。（每回合最多打出1张）舍弃：通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。当前元素骰费用行动牌被赋予费用增加和费用降低时，当前元素骰费用会对应变化。（打出时少花费元素骰的效果不会影响此费用）
  舍弃: 通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。
  催萌腐草: 元素爆发造成2点草元素伤害。元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。草元素伤害：附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
  快速行动: 执行了一次快速行动后，我方可以继续进行其他行动。只有执行了一次战斗行动后，才会轮到对方行动。
