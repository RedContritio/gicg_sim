  effect_html: '<p>本角色附属<strong><u>苍鹭护盾</u></strong><span data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;苍鹭护盾：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;状态&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;准备技能期间：提供2点&lt;strong&gt;&lt;u&gt;护盾&lt;/u&gt;&lt;/strong&gt;，保护所附属的角色。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;护盾：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>并<strong><u>准备技能</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;准备技能：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;有些技能无法被直接使用，而是需要一定次数的行动轮来进行&lt;strong&gt;准备&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;轮到一位牌手行动时，如果该牌手的「出战角色」正在&lt;strong&gt;准备&lt;/strong&gt;技能，则跳过该牌手的行动；如果技能已经完成&lt;strong&gt;准备&lt;/strong&gt;，角色将会在此时直接使用此技能。（此类需要&lt;strong&gt;准备&lt;/strong&gt;的技能，无法触发「使用技能后」效果。）&lt;/p&gt;&lt;p&gt;只有「出战角色」才能&lt;strong&gt;准备&lt;/strong&gt;技能；如果正在&lt;strong&gt;准备&lt;/strong&gt;技能的「出战角色」被切换到后台，技能的&lt;strong&gt;准备&lt;/strong&gt;就会被打断。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>：<strong><u>苍鹭震击</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;苍鹭震击：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;（需准备1个行动轮）&lt;/p&gt;&lt;p&gt;造成3点&lt;strong&gt;&lt;span
    style=&quot;color: rgb(24, 144, 255)&quot;&gt;&lt;u&gt;水元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(24, 144, 255)&quot;&gt;水元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;附着水元素，可发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;蒸发：&lt;/strong&gt;本伤害+2&lt;/p&gt;&lt;p&gt;&lt;strong&gt;感电：&lt;/strong&gt;本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;冻结：&lt;/strong&gt;本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）&lt;/p&gt;&lt;p&gt;&lt;strong&gt;绽放：&lt;/strong&gt;本伤害+1，生成使下次火元素或雷元素伤害+2的[&lt;strong&gt;草原核&lt;/strong&gt;]&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>。</p>'
  effect_text: 本角色附属苍鹭护盾并准备技能：苍鹭震击水元素伤害。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]"
    class="wiki-note-text">。
