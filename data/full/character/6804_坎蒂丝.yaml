terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  苍鹭护盾: 状态准备技能期间：提供2点护盾，保护所附属的角色。护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  苍鹭震击: 元素战技（需准备1个行动轮）造成3点水元素伤害。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
  赤冕祝祷: 出战状态我方角色普通攻击造成的伤害+1。我方单手剑、双手剑或长柄武器角色造成的物理伤害变为水元素伤害。我方切换角色后：造成1点水元素伤害。（每回合1次）持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
