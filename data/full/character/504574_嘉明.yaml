  舞兽之法: 状态我方选择行动前，如果所附属角色为出战角色，则使用技能踏云献瑞。踏云献瑞：普通攻击造成2点火元素伤害，此技能视为下落攻击。
  猊兽·文仔: 状态所附属角色的「元素战技」少花费1个元素骰，造成的伤害+1。所附属角色使用「元素战技」时：如果当前生命值不低于5，则不消耗可用次数，改为对所附属角色造成1点穿透伤害。可用次数：2
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  璨焰金猊舞: 元素爆发造成2点火元素伤害，自身附属猊兽·文仔。
