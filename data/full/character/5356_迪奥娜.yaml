  effect_text: '战斗行动：我方出战角色为迪奥娜时，装备此牌。

    迪奥娜装备此牌后，立刻使用一次猫爪冻冻冰元素伤害，生成猫爪护盾。

    猫爪护盾：

    为我方出战角色提供1点护盾。

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    护盾：

    此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。" class="wiki-note-text">。

    装备有此牌的迪奥娜生成的猫爪护盾，所提供的护盾值+1。

    （牌组中包含迪奥娜，才能加入牌组）'
