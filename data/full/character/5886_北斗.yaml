    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;准备技能：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;有些技能无法被直接使用，而是需要一定次数的行动轮来进行&lt;strong&gt;准备&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;轮到一位牌手行动时，如果该牌手的「出战角色」正在&lt;strong&gt;准备&lt;/strong&gt;技能，则跳过该牌手的行动；如果技能已经完成&lt;strong&gt;准备&lt;/strong&gt;，角色将会在此时直接使用此技能。（此类需要&lt;strong&gt;准备&lt;/strong&gt;的技能，无法触发「使用技能后」效果。）&lt;/p&gt;&lt;p&gt;只有「出战角色」才能&lt;strong&gt;准备&lt;/strong&gt;技能；如果正在&lt;strong&gt;准备&lt;/strong&gt;技能的「出战角色」被切换到后台，技能的&lt;strong&gt;准备&lt;/strong&gt;就会被打断。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>：<strong><u>踏潮</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;元素战技：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;（需准备1个行动轮）&lt;/p&gt;&lt;p&gt;造成3点&lt;strong&gt;&lt;span
