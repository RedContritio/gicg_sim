    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]" class="wiki-note-text">。

    装备有此牌的北斗使用踏潮雷元素伤害。

    雷元素伤害：

    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">时：使北斗本回合内「普通攻击」少花费1个无色元素。(最多触发2次)

    （牌组中包含北斗，才能加入牌组）'
