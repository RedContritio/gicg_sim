terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  钩索链接: 状态敌方受到燃烧反应伤害或我方其他角色使用特技后：附属角色获得1点「夜魂值」。当夜魂值等于2点时：附属角色附属钩索准备，随后消耗2点「夜魂值」。（附属钩索准备后，我方角色选择行动前，若附属角色为出战角色：对最近的敌方角色造成3点草元素伤害）持续回合：2
  夜魂加持: 状态所附属角色可累积「夜魂值」。（最多累积到2点）
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  悬猎·游骋高狩: 元素战技选一个我方角色，自身附属钩索链接并进入夜魂加持。造成2点草元素伤害，然后与所选角色交换位置。
