  鲨鲨冲浪板: 特技：费用：0切换到上一个我方角色，使敌方出战角色附属1层啃咬目标。（若我方后台角色均被击倒，则额外消耗1点「夜魂值」）
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  啃咬目标: 状态受到玛拉妮或鲨鲨飞弹伤害时：移除此效果，每层使此伤害+2。（层数可叠加，没有上限）
