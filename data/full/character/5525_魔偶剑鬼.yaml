  effect_html: '<p><strong><u>战斗行动</u></strong><span data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;战斗行动：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;我方执行了一次战斗行动后，会轮到对方行动。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;打出具有此规则的手牌是一个战斗行动，而非快速行动。&lt;/strong&gt;&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>：我方出战角色为<strong>魔偶剑鬼</strong>时，装备此牌。</p><p>魔偶剑鬼装备此牌后，立刻使用一次<strong><span
    style="color: rgb(212, 177, 6)"><u>孤风刀势</u></span></strong><span data-type="详情"
    data-name="&lt;p&gt;&lt;strong&gt;孤风刀势：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;召唤&lt;strong&gt;&lt;em&gt;剑影·孤风&lt;/em&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;&lt;strong&gt;剑影·孤风&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结束阶段：&lt;/strong&gt;造成1点&lt;strong&gt;&lt;span
    style=&quot;color: rgb(54, 207, 201)&quot;&gt;&lt;u&gt;风元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;可用次数&lt;/u&gt;：2&lt;/strong&gt;&lt;/p&gt;&lt;/blockquote&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(54, 207, 201)&quot;&gt;风元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;和已附着的元素发生元素反应：&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（冰）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点冰元素伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（水）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点水元素伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（火）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点火元素伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;扩散（雷）：&lt;/strong&gt;对目标以外的所有敌方角色造成1点雷元素伤害&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;可用次数：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;此牌效果触发后，会消耗1次&lt;strong&gt;可用次数&lt;/strong&gt;；&lt;/p&gt;&lt;p&gt;&lt;strong&gt;可用次数&lt;/strong&gt;耗尽后，立刻弃置此牌。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>。</p><p>装备有此牌的魔偶剑鬼施放<strong>孤风刀势</strong>后，我方切换到后一个角色；施放<strong><u>霜驰影突</u></strong><span
    data-type="详情" data-name="&lt;p&gt;&lt;strong&gt;霜驰影突：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;元素战技&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;召唤&lt;strong&gt;&lt;em&gt;剑影·霜驰&lt;/em&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;blockquote&gt;&lt;p&gt;&lt;strong&gt;剑影·霜驰&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结束阶段：&lt;/strong&gt;造成1点&lt;strong&gt;&lt;span
    style=&quot;color: rgb(145, 213, 255)&quot;&gt;&lt;u&gt;冰元素伤害&lt;/u&gt;&lt;/span&gt;&lt;/strong&gt;。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;u&gt;可用次数&lt;/u&gt;：2&lt;/strong&gt;&lt;/p&gt;&lt;/blockquote&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;&lt;span
    style=&quot;color: rgb(145, 213, 255)&quot;&gt;冰元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;附着冰元素，可发生元素反应:&lt;/p&gt;&lt;p&gt;&lt;strong&gt;融化：&lt;/strong&gt;本伤害+2&lt;/p&gt;&lt;p&gt;&lt;strong&gt;超导：&lt;/strong&gt;本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p&gt;&lt;strong&gt;冻结：&lt;/strong&gt;本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）&lt;/p&gt;&lt;hr&gt;&lt;p&gt;&lt;strong&gt;可用次数：&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;此牌效果触发后，会消耗1次&lt;strong&gt;可用次数&lt;/strong&gt;；&lt;/p&gt;&lt;p&gt;&lt;strong&gt;可用次数&lt;/strong&gt;耗尽后，立刻弃置此牌。&lt;/p&gt;"
    class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>后，我方切换到前一个角色。</p><p>（牌组中包含魔偶剑鬼，才能加入牌组）</p>'
  effect_text: '战斗行动：我方出战角色为魔偶剑鬼时，装备此牌。

    魔偶剑鬼装备此牌后，立刻使用一次孤风刀势风元素伤害。

    可用次数：2

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的魔偶剑鬼施放孤风刀势后，我方切换到后一个角色；施放霜驰影突冰元素伤害。

    可用次数：2

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">后，我方切换到前一个角色。

    （牌组中包含魔偶剑鬼，才能加入牌组）'
