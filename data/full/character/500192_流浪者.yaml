  effect_text: '战斗行动：我方出战角色为流浪者时，装备此牌。

    流浪者装备此牌后，立刻使用一次羽画·风姿华歌风元素伤害，本角色附属优风倾姿。

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的流浪者在优风倾姿状态下进行重击后：下次从该角色执行「切换角色」行动时少花费1个元素骰，并且造成1点风元素伤害风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害" class="wiki-note-text">。

    （牌组中包含流浪者，才能加入牌组）'
