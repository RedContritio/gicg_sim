    class="wiki-note-text">，然后分别准备技能准备技能：有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。"
    class="wiki-note-text">：长延涤流长延涤流：元素战技（需准备1个行动轮）对下一个敌方后台角色造成1点风元素伤害，然后准备技能：终幕涤流。（敌方没有后台角色时，改为对出战角色造成伤害）"
    class="wiki-note-text">和终幕涤流终幕涤流：元素战技（需准备1个行动轮）对上一个敌方后台角色造成2点风元素伤害。（敌方没有后台角色时，改为对出战角色造成伤害）"
    class="wiki-note-text">。
