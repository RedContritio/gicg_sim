terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰伤害扩散（水）：对目标以外的所有敌方角色造成1点水伤害扩散（火）：对目标以外的所有敌方角色造成1点火伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷伤害
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」「角色引发元素反应后」等效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  风风轮舞踢: 元素战技（需准备1个行动轮）造成2点风元素伤害（或被扩散元素的伤害）。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  呜呼流·风隐急进: 元素战技造成1点风元素伤害，本角色准备技能：风风轮舞踢。如果当前技能引发了扩散，则风风轮舞踢将改为造成被扩散元素的伤害。
