  effect_text: '战斗行动：我方出战角色为雷泽时，装备此牌。

    雷泽装备此牌后，立刻使用一次利爪与苍雷雷元素伤害。

    雷元素伤害：

    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">。

    装备有此牌的雷泽使用利爪与苍雷后：使我方一个雷元素角色获得1点充能。（每回合1次，出战角色优先）

    （牌组中包含雷泽，才能加入牌组）'
