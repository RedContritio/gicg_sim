terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  冻结: 状态角色无法使用技能。（持续到回合结束）角色受到火元素伤害或物理伤害时，移除此效果，使该伤害+2。
  水泡围困: 状态角色无法使用技能。（持续到回合结束）
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
  水泡史莱姆: 装备牌费用：0特技：水泡战法可用次数：2（角色最多装备1个「特技」）
  水泡战法: 特技费用：1（需准备1个行动轮）造成1点水元素伤害，敌方出战角色附属水泡围困。水泡围困：状态角色无法使用技能。（持续到回合结束）
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  狂澜镰击: 元素战技造成3点水元素伤害。如果有敌方角色附属有冻结或水泡围困，则本角色获得1点充能。（每回合1次）
