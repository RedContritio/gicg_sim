effect_text: '战斗行动：我方出战角色为若陀龙王时，对该角色打出。使若陀龙王附属磐岩百相·元素凝晶磐岩百相·元素凝晶：

  状态

  角色受到冰/水/火/雷元素伤害后：如果角色当前未汲取该元素的力量，则移除此状态，然后角色汲取对应元素的力量。" class="wiki-note-text">，然后生成每种我方角色所具有的元素类型的元素骰各1个。

  （牌组中包含若陀龙王，才能加入牌组）'
