effect_text: '战斗行动我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为愚人众·霜役人时，装备此牌。

  愚人众·霜役人装备此牌后，立刻使用一次霜刃截击冰元素伤害。" class="wiki-note-text">。

  装备有此牌的愚人众·霜役人触发血契掠影血契掠影：

  被动技能

  【被动】本角色使用技能后：对敌方出战角色附属可用次数为（本技能最终伤害值-2）的生命之契。（最多5层）" class="wiki-note-text">后：使敌方出战角色的生命之契生命之契：

  状态

  所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏和分配生命值引发的治疗）

  可用次数：1（可叠加，没有上限）。" class="wiki-note-text">层数翻倍。

  （牌组中包含愚人众·霜役人，才能加入牌组）'
