effect_text: '在双方场上生成斗争之火斗争之火：

  此牌会记录本回合你对敌方角色造成的伤害，记为「斗志」。

  行动阶段开始时：若此牌是场上「斗志」最高的斗争之火，则清空此牌的「斗志」，使我方出战角色本回合造成的伤害+1。" class="wiki-note-text">，然后我方场上的斗争之火斗争之火：

  此牌会记录本回合你对敌方角色造成的伤害，记为「斗志」。

  行动阶段开始时：若此牌是场上「斗志」最高的斗争之火，则清空此牌的「斗志」，使我方出战角色本回合造成的伤害+1。" class="wiki-note-text">的「斗志」+1。（斗争之火斗争之火：

  此牌会记录本回合你对敌方角色造成的伤害，记为「斗志」。

  行动阶段开始时：若此牌是场上「斗志」最高的斗争之火，则清空此牌的「斗志」，使我方出战角色本回合造成的伤害+1。" class="wiki-note-text">会将各自阵营对对方造成的伤害记录为「斗志」，每回合行动阶段开始时「斗志」较高的一方会清空「斗志」，使当前出战角色在本回合中造成的伤害+1。）

  （整局游戏只能打出一张「秘传」卡牌；这张牌一定在你的起始手牌中）'
