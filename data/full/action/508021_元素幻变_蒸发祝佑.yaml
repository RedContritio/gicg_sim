effect_html: <html><head></head><body><p><strong>元素幻变</strong><span data-type="详情"
  data-name="&lt;p&gt;元素幻变&lt;/p&gt;&lt;p&gt;规则解释&lt;/p&gt;&lt;p&gt;行动阶段开始时，若队伍中包含元素幻变的两种元素类型的角色且不包含其他元素的角色，则将此牌抓起，然后弃置并生成至场上，然后将4个骰子转化为幻变的元素类型。&lt;/p&gt;"
  class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span><strong>：</strong>水元素/火元素</p><p><strong>投掷阶段：</strong>总是投出2个水元素骰和2个火元素骰。</p><p><strong>我方触发蒸发反应后：</strong>弃置此牌并从蒸发祝佑·狂浪和蒸发祝佑·炽燃中挑选一项加入手牌。</p></body></html>
effect_text: '元素幻变：水元素/火元素

  投掷阶段：总是投出2个水元素骰和2个火元素骰。

  我方触发蒸发反应后：弃置此牌并从蒸发祝佑·狂浪和蒸发祝佑·炽燃中挑选一项加入手牌。'
