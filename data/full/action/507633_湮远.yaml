effect_text: '快速行动：装备给我方的丝柯克。

  装备有此牌的丝柯克在场，我方打出或舍弃虚境裂隙虚境裂隙：

  事件牌

  费用：0

  舍弃1张原本元素骰费用为3的手牌，我方丝柯克获得2点蛇之狡谋。" class="wiki-note-text">时：对敌方出战角色造成1点冰元素伤害冰元素伤害：

  附着冰元素，可发生元素反应:

  融化：本伤害+2

  超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  " class="wiki-note-text">。（每回合1次）

  （牌组中包含丝柯克，才能加入牌组）'
