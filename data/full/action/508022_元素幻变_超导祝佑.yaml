effect_html: <html><head></head><body><p><strong>元素幻变</strong><span data-type="详情"
  data-name="&lt;p&gt;元素幻变&lt;/p&gt;&lt;p&gt;规则解释&lt;/p&gt;&lt;p&gt;行动阶段开始时，若队伍中包含元素幻变的两种元素类型的角色且不包含其他元素的角色，则将此牌抓起，然后弃置并生成至场上，然后将4个骰子转化为幻变的元素类型。&lt;/p&gt;"
  class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span><strong>：</strong>冰元素/雷元素</p><p><strong>投掷阶段：</strong>总是投出2个冰元素骰和2个雷元素骰。</p><p><strong>我方触发超导反应后：</strong>弃置此牌并从超导祝佑·极寒和超导祝佑·电冲中挑选一项加入手牌。</p></body></html>
effect_text: '元素幻变：冰元素/雷元素

  投掷阶段：总是投出2个冰元素骰和2个雷元素骰。

  我方触发超导反应后：弃置此牌并从超导祝佑·极寒和超导祝佑·电冲中挑选一项加入手牌。'
