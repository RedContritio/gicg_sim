flavor_html: <p><strong>船工号子·船坞长剑</strong></p><p>「虽说工具的所有权不归操使它的人所有，但仰赖它的人将其视为自身肢体的衍伸，因此常在手柄及申领的刀片上刻上名字，避免遗失。这把剑上的名字属于白淞镇的一任镇长。」</p>
