terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  炎晶迸击: 元素战技造成3点火元素伤害，生成1层魔蝎祝福。
  炙烧攻势: 特技费用：2造成2点火元素伤害。
  厄灵·炎之魔蝎: 装备牌花费：0所附属角色受到伤害时：如可能，失去1点充能，以抵消1点伤害，然后生成魔蝎祝福。（每回合至多2次）特技：炙烧攻势可用次数：1（角色最多装备1个「特技」）
  魔蝎祝福: 出战状态我方使用厄灵·炎之魔蝎的特技时：移除此效果，每有1层「魔蝎祝福」，就使此特技造成的伤害+1。（「魔蝎祝福」的层数可叠加，没有上限）
