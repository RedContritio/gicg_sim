effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为镀金旅团·炽沙叙事人时，装备此牌。

  镀金旅团·炽沙叙事人装备此牌后，立刻使用一次炎晶迸击炎晶迸击：

  元素战技

  造成3点火元素伤害，生成1层魔蝎祝福。" class="wiki-note-text">。

  装备有此牌的镀金旅团·炽沙叙事人在场，我方使用炙烧攻势火元素伤害。" class="wiki-note-text">击倒敌方角色后：将1张厄灵·炎之魔蝎厄灵·炎之魔蝎：

  装备牌

  花费：0

  所附属角色受到伤害时：如可能，失去1点充能，以抵消1点伤害，然后生成魔蝎祝福。（每回合至多2次）

  特技：炙烧攻势

  可用次数：1

  （角色最多装备1个「特技」）" class="wiki-note-text">加入手牌。

  回合结束时：生成1层魔蝎祝福魔蝎祝福：

  出战状态

  我方使用厄灵·炎之魔蝎的特技时：移除此效果，每有1层「魔蝎祝福」，就使此特技造成的伤害+1。

  （「魔蝎祝福」的层数可叠加，没有上限）" class="wiki-note-text">。

  （牌组中包含镀金旅团·炽沙叙事人，才能加入牌组）'
