effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为希格雯时，装备此牌。

  希格雯装备此牌后，立刻使用一次弹跳水疗法弹跳水疗法：

  元素战技

  生成1张激愈水球·大，将其置于我方牌库顶部第3张牌的位置，本角色附属3层生命之契。（触发激愈水球·大的效果后，会生成激愈水球·中并置入对方牌库；触发激愈水球·中的效果后，会生成激愈水球·小并置入我方牌库）"
  class="wiki-note-text">。

  装备有此牌的希格雯使用弹跳水疗法弹跳水疗法：

  元素战技

  生成1张激愈水球·大，将其置于我方牌库顶部第3张牌的位置，本角色附属3层生命之契。（触发激愈水球·大的效果后，会生成激愈水球·中并置入对方牌库；触发激愈水球·中的效果后，会生成激愈水球·小并置入我方牌库）"
  class="wiki-note-text">后，使我方接下来2次「元素战技」或召唤物造成的伤害+1。

  （牌组中包含希格雯，才能加入牌组）'
