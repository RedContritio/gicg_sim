effect_text: '快速行动快速行动：

  执行了一次快速行动后，我方可以继续进行其他行动。

  只有执行了一次战斗行动后，才会轮到对方行动。" class="wiki-note-text">：装备给我方的伊法，治疗我方受伤最多的角色1点。

  装备有此牌的伊法在场时，我方触发风元素相关反应风元素相关反应：

  扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害。

  扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害。

  扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害。

  扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害。" class="wiki-note-text">或感电反应后，治疗我方受伤最多的角色1点。（每回合2次）

  （牌组中包含伊法，才能加入牌组）'
