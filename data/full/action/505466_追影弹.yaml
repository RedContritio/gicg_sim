effect_text: '加入手牌时：若我方出战角色为火/水/雷/冰，则将此牌转化为对应元素。

  打出或从手牌中舍弃此牌时：优先对敌方出战角色造成1点风元素伤害风元素伤害：

  和已附着的元素发生元素反应：

  扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

  扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

  扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

  扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害" class="wiki-note-text">，然后将一张追影弹随机放进牌库。'
