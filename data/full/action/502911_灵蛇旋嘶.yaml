effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为镀金旅团·叶轮舞者时，装备此牌。

  镀金旅团·叶轮舞者装备此牌后，立刻使用一次蔓延旋舞草元素伤害，生成1层灵蛇祝福。" class="wiki-note-text">。

  装备有此牌的镀金旅团·叶轮舞者在场，我方装备了厄灵·草之灵蛇厄灵·草之灵蛇

  装备牌

  费用：0

  特技：藤蔓锋鳞

  可用次数：2

  （角色最多装备1个「特技」）" class="wiki-note-text">的角色切换至出战时：造成1点草元素伤害草元素伤害：

  附着草元素，可发生元素反应：

  绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

  原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]" class="wiki-note-text">。（每回合1次）

  （牌组中包含镀金旅团·叶轮舞者，才能加入牌组）'
