flavor_html: <p>「世间少有真正无法逃脱的陷阱，再致密的罗网经纬间亦可穿针。</p><p>即便是意欲致人于死地的机关，钩尖樊笼之间也藏有一线生机。</p><p>正如没有人愿意将心完全锁闭，谨慎的防备也终有动摇的一瞬。」</p>
flavor_text: '「世间少有真正无法逃脱的陷阱，再致密的罗网经纬间亦可穿针。

