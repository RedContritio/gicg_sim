effect_text: '特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：水泡战法水元素伤害，敌方出战角色附属水泡围困。"
