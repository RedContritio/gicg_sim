effect_text: '战斗行动：我方出战角色为莱依拉时，装备此牌。

  莱依拉装备此牌后，立刻使用一次垂裳端凝之夜垂裳端凝之夜：

  元素战技

  生成安眠帷幕护盾和飞星。" class="wiki-note-text">。

  装备有此牌的莱依拉在场时，每当飞星我方角色使用技能后：累积1枚「晚星」。如果「晚星」已有至少4枚，则消耗4枚「晚星」，造成1点冰元素伤害。（生成此出战状态的技能，也会触发此效果）

  重复生成此出战状态时：累积2枚「晚星」。" class="wiki-note-text">造成伤害，就抓1张牌。

  （牌组中包含莱依拉，才能加入牌组）'
