terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  魔王武装·狂澜: 元素战技切换为近战状态，然后造成2点水元素伤害。近战状态状态角色造成的物理伤害转换为水元素伤害。角色进行重击后：目标角色附属断流。角色对附属有断流的角色造成的伤害+1；角色对已附属有断流的角色使用技能后：对下一个敌方后台角色造成1点穿透伤害。（每回合至多2次）持续回合：2
  断流: 状态所附属角色被击倒后：对所在阵营的出战角色附属「断流」。（处于「近战状态」的达达利亚攻击所附属角色时，会造成额外伤害。）持续回合：2
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
