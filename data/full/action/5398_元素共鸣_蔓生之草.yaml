  data-name="&lt;p&gt;草原核&lt;/p&gt;&lt;p&gt;出战状态&lt;/p&gt;&lt;p&gt;我方对敌方出战角色造成火元素伤害或雷元素伤害时，伤害值+2。&lt;/p&gt;&lt;p&gt;可用次数：1&lt;/p&gt;"
  class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span></strong>或<strong><em>丰壤之核</em>/<u>激化领域</u><span
  data-type="详情" data-name="&lt;p&gt;激化领域&lt;/p&gt;&lt;p&gt;出战状态&lt;/p&gt;&lt;p&gt;我方对敌方出战角色造成雷元素伤害或草元素伤害时，伤害值+1。&lt;/p&gt;&lt;p&gt;可用次数：2&lt;/p&gt;"
  class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span></strong>，则对对方出战角色造成1点<strong><span
  style="color: rgb(245, 34, 45)"><u>火元素伤害</u></span></strong><span data-type="详情"
  data-name="&lt;p&gt;&lt;strong&gt;&lt;span style=&quot;color: rgb(0, 0, 0)&quot;&gt;火元素伤害：&lt;/span&gt;&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;附着火元素，可发生元素反应：&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;融化&lt;/span&gt;&lt;/strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;：本伤害+2&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;蒸发&lt;/span&gt;&lt;/strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;：本伤害+2&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;超载&lt;/span&gt;&lt;/strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;：本伤害+2，目标强制切换到下一个角色&lt;/span&gt;&lt;/p&gt;&lt;p&gt;&lt;strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;燃烧&lt;/span&gt;&lt;/strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;：本伤害+1，生成回合结束时造成1点火元素伤害的[&lt;/span&gt;&lt;strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;燃烧烈焰&lt;/span&gt;&lt;/strong&gt;&lt;span
  style=&quot;color: rgb(0, 0, 0)&quot;&gt;]（可用次数1，最多叠加到2）&lt;/span&gt;&lt;/p&gt;"
  class="wiki-note-text"><sup class="wiki-sup">[详情]</sup></span>/<strong><span style="color:
  rgb(24, 144, 255)"><u>水元素伤害</u></span></strong><span data-type="详情" data-name="&lt;p
  style=&quot;white-space: pre-wrap;&quot;&gt;水元素伤害：&lt;/p&gt;&lt;p style=&quot;white-space:
  pre-wrap;&quot;&gt;附着水元素，可发生元素反应：&lt;/p&gt;&lt;p style=&quot;white-space: pre-wrap;&quot;&gt;&lt;strong&gt;蒸发&lt;/strong&gt;：本伤害+2&lt;/p&gt;&lt;p
  style=&quot;white-space: pre-wrap;&quot;&gt;&lt;strong&gt;感电&lt;/strong&gt;：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害&lt;/p&gt;&lt;p
  style=&quot;white-space: pre-wrap;&quot;&gt;&lt;strong&gt;冻结&lt;/strong&gt;：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）&lt;/p&gt;&lt;p
  style=&quot;white-space: pre-wrap;&quot;&gt;&lt;strong&gt;绽放&lt;/strong&gt;：本伤害+1，生成使下次火/雷伤害+2的[&lt;strong&gt;草原核&lt;/strong&gt;]&lt;/p&gt;"
