  style=&quot;color: rgb(0, 0, 0)&quot;&gt;]&lt;/span&gt;&lt;/p&gt;" class="wiki-note-text"><sup
  class="wiki-sup">[详情]</sup></span>。</p><p>（牌组包含至少2个草元素角色，才能加入牌组）</p>'
effect_text: '若我方场上存在燃烧烈焰/草原核或丰壤之核/激化领域，则对对方出战角色造成1点火元素伤害火元素伤害：

  附着火元素，可发生元素反应：

  融化：本伤害+2

  蒸发：本伤害+2

  超载：本伤害+2，目标强制切换到下一个角色

  燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）" class="wiki-note-text">/水元素伤害水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]" class="wiki-note-text">/雷元素伤害雷元素伤害：

  附着雷元素，可发生元素反应：

  超载：本伤害+2，目标强制切换到下一个角色

  超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">。

  （牌组包含至少2个草元素角色，才能加入牌组）'
term_refs:
- 燃烧烈焰召唤物结束阶段
- 草原核出战状态我方对敌方出战角色造成火元素伤害或雷元素伤害时，伤害值+2。可用次数
- 激化领域出战状态我方对敌方出战角色造成雷元素伤害或草元素伤害时，伤害值+1。可用次数
- 火元素伤害
- 水元素伤害
- 雷元素伤害
terms:
  燃烧烈焰: 燃烧烈焰召唤物结束阶段：造成1点火元素伤害。可用次数：1（可叠加，最多叠加到2次）
  草原核: 出战状态我方对敌方出战角色造成火元素伤害或雷元素伤害时，伤害值+2。可用次数：1
  激化领域: 激化领域出战状态我方对敌方出战角色造成雷元素伤害或草元素伤害时，伤害值+1。可用次数：2
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
