effect_text: '双方切换角色后，且玛拉妮为出战角色时：消耗1点「夜魂值」，使敌方出战角色附属啃咬目标啃咬目标：

  状态

  受到玛拉妮或鲨鲨飞弹伤害时：移除此效果，每层使此伤害+2。

  （层数可叠加，没有上限）" class="wiki-note-text">。

  特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：鲨鲨冲浪板鲨鲨冲浪板：

  特技

  费用：1

  切换到上一个我方角色，使敌方出战角色附属1层啃咬目标。（若我方后台角色均被击倒，则额外消耗1点「夜魂值」）" class="wiki-note-text">

  所附属角色「夜魂值」为0时，弃置此牌；此牌被弃置时，所附属角色结束夜魂加持夜魂加持

  所附属角色可累积「夜魂值」。（最多累积到2点）" class="wiki-note-text">。'
term_refs:
