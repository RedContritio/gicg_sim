effect_text: '所附属角色受到伤害时：如可能，失去1点充能，以抵消1点伤害，然后生成魔蝎祝福魔蝎祝福：

  出战状态

  我方使用厄灵·炎之魔蝎的特技时：移除此效果，每有1层「魔蝎祝福」，就使此特技造成的伤害+1。

  （「魔蝎祝福」的层数可叠加，没有上限）" class="wiki-note-text">。（每回合至多2次）

  特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：炙烧攻势火元素伤害。"
  class="wiki-note-text">

  可用次数：1

  （角色最多装备1个「特技」）'
