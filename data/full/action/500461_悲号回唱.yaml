terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  雷墙倾轧: 元素战技对附属有雷鸣探知的敌方色造成3点雷元素伤害。（如果敌方不存在符合条件的角色，则改为对出战角色造成伤害）
  雷鸣探知: 状态所附属角色受到雷音权现及其召唤物造成的伤害时：移除此状态，使此伤害+1。（同一方场上最多存在一个此状态。雷音权现的部分技能，会以所附属角色为目标。）
