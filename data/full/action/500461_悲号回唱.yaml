  元素战技

  对附属有雷鸣探知的敌方色造成3点雷元素伤害。

  （如果敌方不存在符合条件的角色，则改为对出战角色造成伤害）" class="wiki-note-text">。

  装备有此牌的雷音权现在场，附属有雷鸣探知的敌方角色受到伤害时:我方抓1张牌。（每回合1次）

  （牌组中包含雷音权现，才能加入牌组）'
