effect_text: '战斗行动：我方出战角色为艾尔海森时，装备此牌。

  艾尔海森装备此牌后，立刻使用一次殊境·显象缚结殊境·显象缚结：

  元素爆发

  造成4点草元素伤害；消耗琢光镜，此伤害提升所消耗琢光镜的持续回合值。如果消耗琢光镜的持续回合为0/1/2，则为角色附属持续回合为3/2/1的琢光镜。" class="wiki-note-text">。

  装备有此牌的艾尔海森使用殊境·显象缚结殊境·显象缚结：

  元素爆发

  造成4点草元素伤害；消耗琢光镜，此伤害提升所消耗琢光镜的持续回合值。如果消耗琢光镜的持续回合为0/1/2，则为角色附属持续回合为3/2/1的琢光镜。" class="wiki-note-text">时：如果消耗了持续回合持续回合：

  每回合结束阶段，持续回合-1；

  持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">至少为1的琢光镜琢光镜：

  状态

  角色造成的物理伤害变为草元素伤害。

  角色普通攻击后：造成1点草元素伤害。如果此技能为重击，则使此状态的持续回合+1。

  持续回合：2（可叠加，最多叠加到3回合）" class="wiki-note-text">，则总是附属持续回合持续回合：

  每回合结束阶段，持续回合-1；

  持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">为3的琢光镜琢光镜：

  状态

  角色造成的物理伤害变为草元素伤害。

  角色普通攻击后：造成1点草元素伤害。如果此技能为重击，则使此状态的持续回合+1。

  持续回合：2（可叠加，最多叠加到3回合）" class="wiki-note-text">，并且抓1张牌。

  （牌组中包含艾尔海森，才能加入牌组）'
