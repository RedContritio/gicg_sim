effect_text: '快速行动：装备给我方的圣骸牙兽。

  我方打出或舍弃噬骸能量块噬骸能量块：

  事件牌

  费用：0

  随机舍弃1张当前元素骰费用最高的手牌，生成1个我方出战角色类型的元素骰。（每回合最多打出1张）

  舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。

  当前元素骰费用

  行动牌被赋予费用增加和费用降低时，当前元素骰费用会对应变化。

  （打出时少花费元素骰的效果不会影响此费用）" class="wiki-note-text">时：抓1张牌。（每回合1次）

  （牌组中包含圣骸牙兽，才能加入牌组）'
