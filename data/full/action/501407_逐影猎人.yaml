flavor_html: <p><strong>荣光猎者·逐影猎人</strong></p><p>「『追寻森森鬼影，将其尽数驱逐、猎杀』，</p><p>这是后来被充满尊敬地称为『黄金猎人』，</p><p>而本人却将这一名号视为耻辱的卡西奥多，</p><p>协助建立「逐影猎人」这一职的名称由来。」</p>
