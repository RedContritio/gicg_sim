terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  噬罪的告解: 元素战技造成1点冰元素伤害，生成1层洞察破绽。（触发洞察破绽的效果时，会生成强攻破绽。）
  强攻破绽: 出战状态我方造成技能伤害时：移除此状态，使本次伤害加倍。
  换班时间: 事件牌费用：0我方下次执行「切换角色」行动时：少花费1个元素骰。
