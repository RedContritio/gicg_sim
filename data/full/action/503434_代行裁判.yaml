effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为罗莎莉亚时，装备此牌。

  罗莎莉亚装备此牌后，立刻使用一次噬罪的告解造成1点冰元素伤害，生成1层洞察破绽。（触发洞察破绽的效果时，会生成强攻破绽。）" class="wiki-note-text">。

  装备有此牌的罗莎莉亚在场时：使用噬罪的告解造成1点冰元素伤害，生成1层洞察破绽。（触发洞察破绽的效果时，会生成强攻破绽。）" class="wiki-note-text">，或我方生成强攻破绽强攻破绽：

  出战状态

  我方造成技能伤害时：移除此状态，使本次伤害加倍。" class="wiki-note-text">后，在手牌中生成1张换班时间我方下次执行「切换角色」行动时：少花费1个元素骰。"
  class="wiki-note-text">。（每回合1次）

  （牌组中包含罗莎莉亚，才能加入牌组）'
