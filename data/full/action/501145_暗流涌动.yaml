  出战状态

  所在阵营的角色使用元素战技或元素爆发时：需要多花费1个元素骰。

  可用次数：2" class="wiki-note-text">。

  装备有此牌的深渊使徒·激流被击倒或触发水之新生水之新生：

  状态

  所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到4点生命值。此效果触发后，角色造成的物理伤害变为水元素伤害，且水元素伤害+1。" class="wiki-note-text">时：在对方场上生成暗流的诅咒暗流的诅咒：

  出战状态

  所在阵营的角色使用元素战技或元素爆发时：需要多花费1个元素骰。

  可用次数：2" class="wiki-note-text">。

  （牌组中包含深渊使徒·激流，才能加入牌组）'
