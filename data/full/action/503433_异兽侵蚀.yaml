  装备有此牌的黄金王兽在场时，对方的黄金侵蚀黄金侵蚀：

  状态

  结束阶段：如果所附属角色位于后台，则此效果每有1次可用次数，就对所附属角色造成1点穿透伤害。

  可用次数：1（可叠加，最多叠加到3次）" class="wiki-note-text">最多可叠加到5次，并且所附属角色不在后台时也会生效。

  （牌组中包含黄金王兽，才能加入牌组）'
