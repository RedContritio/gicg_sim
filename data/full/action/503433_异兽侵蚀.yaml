effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为黄金王兽时，装备此牌。

