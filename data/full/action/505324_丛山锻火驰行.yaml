effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为希诺宁时，装备此牌。

  希诺宁装备此牌后，立刻使用一次音火锻淬音火锻淬：

  元素战技

  本角色附属刃轮装束，进入夜魂加持并获得1点「夜魂值」。（角色进入夜魂加持后不可使用此技能）

  （附属刃轮装束的角色可以使用特技：高速腾跃）" class="wiki-note-text">。

  装备有此牌的希诺宁在场时：切换至希诺宁或由希诺宁切换至其他角色时，若目标处于夜魂加持夜魂加持：

  状态

  所附属角色可累积「夜魂值」。（最多累积到2点）" class="wiki-note-text">状态，则回复1点夜魂值。（每回合2次）

  （牌组中包含希诺宁，才能加入牌组）'
