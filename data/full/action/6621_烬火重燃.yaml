  class="wiki-note-text">，就立刻弃置此牌，为角色附属渊火加护。

  装备有此牌的深渊咏者·渊火触发火之新生所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到4点生命值。此效果触发后，角色造成的火元素伤害+1。" class="wiki-note-text">时：弃置此牌，为角色附属渊火加护。

