effect_text: '战斗行动：我方出战角色为流浪者时，装备此牌。

  流浪者装备此牌后，立刻使用一次羽画·风姿华歌风元素伤害，本角色附属优风倾姿。" class="wiki-note-text" class="wiki-note-text">。

  装备有此牌的流浪者在优风倾姿状态下进行重击后：下次从该角色执行「切换角色」行动时少花费1个元素骰，并且造成1点风元素伤害。

  （牌组中包含流浪者，才能加入牌组）'
