  此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。" class="wiki-note-text">。

  附属角色切换至后台时：此牌可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">+1。

  特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：浪船·迅击炮浪船·迅击炮：

  特技

  费用：1

  造成2点物理伤害。" class="wiki-note-text">

