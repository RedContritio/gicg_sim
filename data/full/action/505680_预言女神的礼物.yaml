  事件牌

  费用：1

  召唤积木小人。" class="wiki-note-text">，并生成2张积木小人积木小人：

  事件牌

  费用：1

  召唤积木小人。" class="wiki-note-text">，随机置入我方牌组中。

  我方打出「希穆兰卡」召唤物「希穆兰卡」召唤物：

  可能出现的「希穆兰卡」召唤物共有4种：

  积木小人：结束阶段造成1点物理伤害，可用次数2。

  折纸飞鼠：结束阶段获得1层高效切换，可用次数2。

  跳跳纸蛙：结束阶段抓1张牌，可用次数2。

  折纸胖胖鼠：结束阶段治疗受伤最多的我方角色2点，可用次数1。" class="wiki-note-text">后，使其效果量+1。

  可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">：2'
