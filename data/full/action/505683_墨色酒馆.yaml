  折纸飞鼠: 事件牌费用：1召唤折纸飞鼠。（折纸飞鼠：结束阶段：获得1层高效切换。可用次数：2）
  跳跳纸蛙: 事件牌费用：1召唤跳跳纸蛙。（跳跳纸蛙：结束阶段：抓1张牌。可用次数：2）
  折纸胖胖鼠: 事件牌费用：1召唤折纸胖胖鼠。（折纸胖胖鼠：结束阶段：治疗受伤最多的我方角色2点。可用次数：1）
  「希穆兰卡」召唤物: 可能出现的「希穆兰卡」召唤物共有4种：积木小人：结束阶段造成1点物理伤害，可用次数2。折纸飞鼠：结束阶段获得1层高效切换，可用次数2。跳跳纸蛙：结束阶段抓1张牌，可用次数2。折纸胖胖鼠：结束阶段治疗受伤最多的我方角色2点，可用次数1。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
