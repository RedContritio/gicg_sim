effect_text: '元素幻变：火元素岩元素

  投掷阶段：总是投出2个火元素骰和2个岩元素骰。

  我方触发火结晶反应后：弃置此牌并从火岩祝佑·回火火元素骰和2个岩元素骰。

  我方场上存在护盾角色状态或护盾出战状态时，造成的火元素伤害和岩元素伤害+1。（每回合3次）

  护盾：

  此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。

  火元素伤害：

  附着火元素，可发生元素反应：

  融化：本伤害+2

  蒸发：本伤害+2

  超载：本伤害+2，目标强制切换到下一个角色

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

  岩元素伤害

  和已附着的元素发生元素反应：

  结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。" class="wiki-note-text">和火岩祝佑·重熔火元素骰和2个岩元素骰。

  我方造成火元素伤害或岩元素伤害后：生成2层护盾。（每回合1次）

  火元素伤害：

  附着火元素，可发生元素反应：

  融化：本伤害+2

  蒸发：本伤害+2

  超载：本伤害+2，目标强制切换到下一个角色

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

  岩元素伤害

  和已附着的元素发生元素反应：

  结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。" class="wiki-note-text">中挑选一项加入手牌。'
