effect_text: '冒险经历达到2时：生成2张手牌沉玉茶露。

  冒险经历达到4时：我方获得3层高效切换和敏捷切换。

  冒险经历达到8时：我方全体角色附着水元素附着水元素：

  不通过伤害附着水元素时，发生的元素反应会忽略伤害效果：

  蒸发：没有效果

  感电：没有效果

  冻结：目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：生成使下次火元素或雷元素伤害+2的[草原核]" class="wiki-note-text">，治疗我方受伤最多的角色至最大生命值，并使其获得2点最大生命值，然后弃置此牌。'
