effect_text: '战斗行动：我方出战角色为特瓦林时，装备此牌。

  特瓦林装备此牌后，立刻使用一次暴风轰击暴风轰击：

  元素战技

  造成2点风元素伤害，目标角色附属坍毁。" class="wiki-note-text">。

  装备有此牌的特瓦林在场时，敌方出战角色所附属的坍毁坍毁：

  状态

  所附属角色受到的物理伤害或风元素伤害+2。

  可用次数：1" class="wiki-note-text">状态被移除后：对下一个敌方后台角色附属坍毁坍毁：

  状态

  所附属角色受到的物理伤害或风元素伤害+2。

  可用次数：1" class="wiki-note-text">。（每回合1次）

  （牌组中包含特瓦林，才能加入牌组）'
