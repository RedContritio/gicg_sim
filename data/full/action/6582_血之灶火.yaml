effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为胡桃时，装备此牌。

  胡桃装备此牌后，立刻使用一次蝶引来生蝶引来生：

  元素战技

  本角色附属彼岸蝶舞。

  彼岸蝶舞

  所附属角色造成的物理伤害变为火元素伤害，且角色造成的火元素伤害+1。

  所附属角色进行重击时：目标角色附属血梅香。

  持续回合：2" class="wiki-note-text">。

  装备有此牌的胡桃在生命值不多于6时，造成的火元素伤害火元素伤害：

  附着火元素，可发生元素反应：

  融化：本伤害+2

  蒸发：本伤害+2

  超载：本伤害+2，目标强制切换到下一个角色

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">+1。

  （牌组中包含胡桃，才能加入牌组）'
