effect_text: '选一个我方角色，使其附属「重燃」为1的还魂诗还魂诗：

  状态

  本回合内，所附属角色被击倒时：如可能，消耗等同于此牌「重燃」的元素骰，使角色免于被击倒，并治疗该角色到1点生命值。然后此牌「重燃」+1。" class="wiki-note-text">。（本回合内该角色被击倒时，消耗等同于「重燃」的元素骰，使角色免于被击倒免于被击倒：

  一些效果会使角色在生命值被降为0的时候免于被击倒，并治疗该角色到一定生命值。

  此时，角色不视为被击倒过。（因此，角色所附属的装备和状态不会被弃置，充能也不会被清空。）" class="wiki-note-text">，并治疗该角色到1点生命值，然后「重燃」+1）

  （牌组包含至少2个「纳塔」角色，才能加入牌组）'
