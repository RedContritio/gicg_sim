effect_text: '所附属角色受到伤害时：如可能，舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">当前元素骰费用最高的1张手牌，以抵消1点伤害，然后累积1点「团结」。（每回合1次）

  角色使用技能时：如果此牌已有「团结」，则消耗所有「团结」，使此技能伤害+1，并且每消耗1点「团结」就抓1张牌。

  （「长柄武器」角色才能装备。角色最多装备1件「武器」）'
