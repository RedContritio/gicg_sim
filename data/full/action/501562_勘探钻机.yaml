flavor_html: <p><strong>石匠号子·勘探钻机</strong></p><p>「这种长柄钻的穿刺、削切能力无可比拟。<br>既然它能够如同热刀刺入黄油般深深没入岩石，<br>那对付不若岩石坚硬的东西的话更是不在话下。」</p>
flavor_text: '石匠号子·勘探钻机

  「这种长柄钻的穿刺、削切能力无可比拟。

  既然它能够如同热刀刺入黄油般深深没入岩石，

  那对付不若岩石坚硬的东西的话更是不在话下。」'
