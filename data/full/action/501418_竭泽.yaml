flavor_html: '<p><strong>网破·竭泽</strong></p><p><span style="color: rgb(0, 0, 0)">「···原本在高原上巨大的湖泊中如箭头一般笔直射穿空间的鱼，<br>它曾如长枪一般笔直，循着圣迹沿洄，<br>溪流渐渐渗入沙中，湖泽退缩成水洼，<br>最终只得在水洼中蜷曲身体，结果成为了朝圣之人的猎获。」</span></p>'
