effect_text: '我方出战角色为「女士」时，才能打出：入场时，生成3个「女士」当前元素类型的元素骰。

  角色受到至少为3点的伤害时：抵消1点伤害，然后根据「女士」的形态对敌方出战角色附属严寒结束阶段：对附属角色造成1点冰元素伤害。

  可用次数：1

  所附属角色被附属炽热时，移除此效果。" class="wiki-note-text">或炽热炽热：

  状态

  结束阶段：对所附属角色造成1点火元素伤害。

  可用次数：1

  所附属角色被附属严寒时，移除此效果" class="wiki-note-text">。（每回合1次）

  （牌组中包含「女士」，才能加入牌组）'
