  执行了一次快速行动后，我方可以继续进行其他行动。

  只有执行了一次战斗行动后，才会轮到对方行动" class="wiki-note-text">：装备给我方的水形幻人，使其附属元素生命·水元素生命·水：

  状态

  角色总是附着水元素，并且免疫水元素伤害。

  持续回合：2" class="wiki-note-text">。（角色总是附着水元素，并且免疫水元素伤害水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]" class="wiki-note-text">。持续回合持续回合：

  每回合结束阶段，持续回合-1；

  持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">：2）

  装备有此牌的水形幻人在场时，我方宣布结束后，如果所附属角色生命值不低于3，则所附属角色受到2点穿透伤害穿透伤害：

  穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。" class="wiki-note-text">，召唤1个独立的半幻人。

  （牌组中包含水形幻人，才能加入牌组）'
