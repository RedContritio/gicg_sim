effect_text: '元素幻变：水元素草元素

  投掷阶段：总是投出2个水元素骰和2个草元素骰。

  我方触发绽放反应后：弃置此牌并从绽放祝佑·甘露水元素骰和2个草元素骰。

  每回合第2次打出卡牌后：我方受伤最多的角色获得2点额外最大生命值。" class="wiki-note-text">和绽放祝佑·蔓生水元素骰和2个草元素骰。

  我方触发元素反应后：造成1点水元素伤害。（每回合1次）

  水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]

  月感电：生成回合结束时造成2点雷元素伤害的[雷暴云]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[电击]）" class="wiki-note-text">中挑选一项加入手牌。'
