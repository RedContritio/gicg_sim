effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为莫娜时，装备此牌。

  莫娜装备此牌后，立刻使用一次星命定轨星命定轨：

  造成4点水元素伤害，生成泡影。" class="wiki-note-text">。

  装备有此牌的莫娜出战期间，我方引发的水元素相关反应水元素相关反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]

  结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  扩散（水）：对目标以外的所有敌方角色造成1点水伤害" class="wiki-note-text">伤害额外+2。

  （牌组中包含莫娜，才能加入牌组）'
