effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为愚人众·藏镜仕女时，装备此牌。

  愚人众·藏镜仕女装备此牌后，立刻使用一次潋波绽破潋波绽破：

  元素战技

  造成2点水元素伤害，目标角色附属水光破镜。" class="wiki-note-text">。

  装备有此牌的愚人众·藏镜仕女生成的水光破镜初始持续回合+1，并且会使所附属角色受到的水元素伤害水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]" class="wiki-note-text">+1。

  （牌组中包含愚人众·藏镜仕女，才能加入牌组）'
