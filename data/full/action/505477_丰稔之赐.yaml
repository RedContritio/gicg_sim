effect_text: '治疗目标角色1点，目标角色之后2次准备技能准备技能：

  有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。

  轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」「角色引发元素反应后」等效果。）

  只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。" class="wiki-note-text">时：治疗自身1点。

  （每回合每个角色最多食用1次「料理」）'
