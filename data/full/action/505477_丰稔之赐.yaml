flavor_html: <p><strong>丰稔之赐</strong></p><p>颗粒果为主的菜肴。将碎肉馅炒熟，放在烤盘上，添上肉块与蛋，最后铺上搅碎的颗粒果糊糊，送入烤箱，直至颜色变得诱人。这道用料丰厚的菜肴，通常会在庆祝大丰收之时被端上「沃陆之邦」的餐桌。</p>
flavor_text: '丰稔之赐

  颗粒果为主的菜肴。将碎肉馅炒熟，放在烤盘上，添上肉块与蛋，最后铺上搅碎的颗粒果糊糊，送入烤箱，直至颜色变得诱人。这道用料丰厚的菜肴，通常会在庆祝大丰收之时被端上「沃陆之邦」的餐桌。'
