effect_text: '敌方受到冻结或融化反应伤害后：我方下2次造成的水元素伤害水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]" class="wiki-note-text">和火元素伤害火元素伤害：

  附着火元素，可发生元素反应：

  融化：本伤害+2

  蒸发：本伤害+2

  超载：本伤害+2，目标强制切换到下一个角色

  燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）" class="wiki-note-text">+1，并使茜特菈莉获得1点「夜魂值」。（每回合1次）

  （牌组中包含茜特菈莉，才能加入牌组）'
