effect_text: '战斗行动：我方出战角色为塔利雅时，装备此牌。

  塔利雅装备此牌后，立刻使用一次纯耀的祷咏水元素伤害，生成2层护盾和2层西风之眷。

  护盾

  为我方出战角色提供1点护盾。（可叠加，没有上限）

  西风之眷：

  出战状态

  我方角色受到伤害后：生成1层护盾。

  可用次数：2

  元素爆发：

  角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

  护盾：

  此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。

  可用次数

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。

  水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]

  月感电：生成回合结束时造成2点雷元素伤害的[雷暴云]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[电击]）" class="wiki-note-text">。

  装备有此卡牌的塔利雅在场时，我方角色被击倒时：如果我方场上存在西风之眷，则消耗所有西风之眷，使该角色免于被击倒，并治疗该角色到2点生命值。

  （牌组中包含塔利雅，才能加入牌组）'
