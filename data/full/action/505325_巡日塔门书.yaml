effect_text: '我方赛索斯获得1点充能充能：

  角色使用「元素爆发」时，需要消耗充能。

  角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">。

  我方赛索斯因黑鸢的密喻自身「普通攻击」不会获得充能。

  自身「普通攻击」后：如可能，消耗全部充能，对生命值最低的敌方造成等额+1的穿透伤害。" class="wiki-note-text">扣除充能充能：

  角色使用「元素爆发」时，需要消耗充能。

  角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">后，获得1点充能充能：

  角色使用「元素爆发」时，需要消耗充能。

  角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">。（每回合1次）

  （牌组中包含赛索斯，才能加入牌组）'
