  装备有此牌的愚人众·雷萤术士在场时，我方选择行动前：如果雷萤的可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">至少为3，则雷萤立刻造成1点雷元素伤害雷元素伤害：

  附着雷元素，可发生元素反应：

  超载：本伤害+2，目标强制切换到下一个角色。

  超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。

