  狩夜之巡: 元素战技自身附属夜巡，移除自身所有生命之契。然后根据所移除的层数，造成雷元素伤害，并治疗自身。（伤害和治疗最多4点）
  雷元素相关反应: 超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
