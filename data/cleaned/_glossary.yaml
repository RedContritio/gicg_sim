  _seen_in:
  - '502899'
灼灼:
  text: 状态角色进行重击时：少花费1个火元素。（每回合1次）结束阶段：角色附属丹火印。持续回合：2丹火印：状态角色进行重击时：造成的伤害+2。可用次数：1（可叠加，最多叠加到2次）重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
