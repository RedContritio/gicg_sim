terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  雷晶核心: 状态所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到1点生命值。免于被击倒一些效果会使角色在生命值被降为0的时候免于被击倒，并治疗该角色到一定生命值。此时，角色不视为被击倒过。(因此，角色所附属的装备和状态不会被弃置，充能也不会被清空。）
