effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为卡维时，装备此牌。

  卡维装备此牌后，立刻使用一次画则巧施造成2点草元素伤害，生成迸发扫描。" class="wiki-note-text">。

  装备有此牌的卡维在场，我方触发迸发扫描迸发扫描：

  出战状态

  双方选择行动前：如果我方场上存在草原核或丰穰之核，则使其可用次数-1，并舍弃我方牌库顶的1张卡牌。然后，造成所舍弃卡牌原本元素骰费用的草元素伤害。

  可用次数：1（可叠加，最多叠加到3次）" class="wiki-note-text">的效果后：将1张所舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">卡牌的复制加入你的手牌。如果该牌为「场地」牌，则使本回合中我方下次打出「场地」时少花费2个元素骰。（每回合1次）

  （牌组中包含卡维，才能加入牌组）'
