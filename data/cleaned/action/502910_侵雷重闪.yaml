effect_text: '入场时：如果装备有此牌的深渊咏者·紫电已触发过雷之新生雷之新生：

  状态

  所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到4点生命值。此效果触发后，角色造成的雷元素伤害+1。" class="wiki-note-text">，则使敌方出战角色失去1点充能充能：

  角色使用「元素爆发」时，需要消耗充能。

  角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">。

  装备有此牌的深渊咏者·紫电被击倒或触发雷之新生雷之新生：

  状态

  所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到4点生命值。此效果触发后，角色造成的雷元素伤害+1。" class="wiki-note-text">时：弃置此牌，使敌方出战角色失去1点充能充能：

  角色使用「元素爆发」时，需要消耗充能。

  角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">。

  （牌组中包含深渊咏者·紫电，才能加入牌组）'
