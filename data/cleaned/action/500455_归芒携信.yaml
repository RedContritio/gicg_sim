terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  垂裳端凝之夜: 元素战技生成安眠帷幕护盾和飞星。
  飞星: 出战状态我方角色使用技能后：累积1枚「晚星」。如果「晚星」已有至少4枚，则消耗4枚「晚星」，造成1点冰元素伤害。（生成此出战状态的技能，也会触发此效果）重复生成此出战状态时：累积2枚「晚星」。
