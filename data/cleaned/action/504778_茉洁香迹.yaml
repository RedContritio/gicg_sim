effect_text: '所附属角色造成的物理伤害物理伤害：

  物理伤害不会附着元素，也不会发生元素反应。" class="wiki-note-text">变为草元素伤害草元素伤害：

  附着草元素，可发生元素反应：

  绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

  原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]" class="wiki-note-text">。

  装备有此牌的艾梅莉埃普通攻击后：我方最高等级的「柔灯之匣」立刻行动1次。（每回合1次）

  （牌组中包含艾梅莉埃，才能加入牌组）'
