effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为吞星之鲸时，装备此牌。

  吞星之鲸装备此牌后，立刻使用一次迸落星雨元素战技

  造成1点水元素伤害，此角色每有3点无尽食欲提供的额外最大生命，此伤害+1（最多+4）。然后舍弃1张原本元素骰费用最高的手牌。" class="wiki-note-text">。

  装备有此牌的吞星之鲸使用迸落星雨元素战技

  造成1点水元素伤害，此角色每有3点无尽食欲提供的额外最大生命，此伤害+1（最多+4）。然后舍弃1张原本元素骰费用最高的手牌。" class="wiki-note-text">舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">1张手牌后：治疗此角色，其数值等同于所舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">手牌的当前元素骰费用。（每回合1次）

