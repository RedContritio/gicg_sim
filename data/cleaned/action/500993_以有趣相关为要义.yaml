effect_text: '战斗行动：我方出战角色为夏洛蒂时，装备此牌。

  夏洛蒂装备此牌后，立刻使用一次取景·冰点构图法冰元素伤害，目标附属瞬时剪影。" class="wiki-note-text">。

  装备有此牌的夏洛蒂在场时，我方角色进行普通攻击后：如果对方场上有角色附属有瞬时剪影瞬时剪影：

  状态

  结束阶段：对所附属角色造成1点冰元素伤害；如果可用次数仅剩余1且所附属角色具有冰元素附着，则此伤害+1。

  可用次数：2" class="wiki-note-text">，则治疗我方出战角色2点。（每回合1次）

  （牌组中包含夏洛蒂，才能加入牌组）'
