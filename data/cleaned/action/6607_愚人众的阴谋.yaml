effect_text: '在对方场上，生成1个随机类型的「愚人众伏兵愚人众伏兵：

  「愚人众伏兵」会在自身所在阵营的角色使用技能后触发效果，对自身所在阵营的出战角色造成伤害。（每回合1次）

  可能出现的「愚人众伏兵」共有4种：

  冰萤术士：触发时造成1点冰元素伤害，可用2次。

  藏镜仕女：触发时造成1点水元素伤害，可用2次。

  火铳游击兵：触发时造成1点火元素伤害，可用2次。

  雷锤前锋军：触发时造成1点雷元素伤害，可用2次。" class="wiki-note-text">」。

  （牌组包含至少2个「愚人众」角色，才能加入牌组）'
