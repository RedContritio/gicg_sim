flavor_text: '祀珑在昔，灵锦歆诚

  「孩子们在溪流中洗濯拍动的小脚丫，彩虹弧光中欢笑的渔夫，被月光染成银色的幽会恋人…如果你曾注意，如若你曾欣赏过…同样作为这片大地上的生灵，人类的天真，又与我们有多大不同呢？」'
