  元素爆发

  造成4点草元素伤害；消耗琢光镜，此伤害提升所消耗琢光镜的持续回合值。如果消耗琢光镜的持续回合为0/1/2，则为角色附属持续回合为3/2/1的琢光镜。" class="wiki-note-text">。

  装备有此牌的艾尔海森使用殊境·显象缚结殊境·显象缚结：

  元素爆发

