effect_text: '战斗行动：我方出战角色为黑蛇骑士·摧岩之钺时，装备此牌。

  打出或行动阶段开始时：使黑蛇骑士·摧岩之钺附着岩元素附着岩元素：

  不通过伤害附着岩元素时，发生的元素反应会忽略伤害效果：

  结晶（冰）：敌方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（水）：敌方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（火）：敌方出战角色获得1点护盾（可叠加，最多2点）。

  结晶（雷）：敌方出战角色获得1点护盾（可叠加，最多2点）。" class="wiki-note-text">。

  （牌组中包含黑蛇骑士·摧岩之钺，才能加入牌组）'
