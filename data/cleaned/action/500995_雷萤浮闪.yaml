effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为愚人众·雷萤术士时，装备此牌。

  愚人众·雷萤术士装备此牌后，立刻使用一次雾虚之召。

  装备有此牌的愚人众·雷萤术士在场时，我方选择行动前：如果雷萤的可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">至少为3，则雷萤立刻造成1点雷元素伤害雷元素伤害：

  附着雷元素，可发生元素反应：

  超载：本伤害+2，目标强制切换到下一个角色。

  超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。

  原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]。" class="wiki-note-text">。（需消耗可用次数，每回合1次）

