effect_text: '敌方受到伤害后：如果此伤害是草元素伤害草元素伤害：

  附着草元素，可发生元素反应：

  绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]

  燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）

  原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">或发生了草元素相关反应草元素相关反应：

  绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]

  燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）

  原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">，则累积1枚「花冠水晶」。（最多叠加到5）

  行动阶段开始时：如果「花冠水晶」数量为5：则生成1个万能元素，并抓1张牌。（每回合2次）

  （角色最多装备1件「圣遗物」）'
