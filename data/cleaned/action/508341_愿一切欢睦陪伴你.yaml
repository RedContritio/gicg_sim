terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  纯耀的祷咏: 元素爆发造成2点水元素伤害，生成2层护盾和2层西风之眷。护盾为我方出战角色提供1点护盾。（可叠加，没有上限）西风之眷：出战状态我方角色受到伤害后：生成1层护盾。可用次数：2元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。可用次数此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]月感电：生成回合结束时造成2点雷元素伤害的[雷暴云]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[电击]）
  西风之眷: 出战状态我方角色受到伤害后：生成1层护盾。可用次数：2可用次数此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  免于被击倒: 一些效果会使角色在生命值被降为0的时候免于被击倒，并治疗该角色到一定生命值。此时，角色不视为被击倒过。（因此，角色所附属的装备和状态不会被弃置，充能也不会被清空。）
