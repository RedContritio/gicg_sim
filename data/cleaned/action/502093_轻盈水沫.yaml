  如果有敌方角色附属有冻结或水泡围困，则本角色获得1点充能。（每回合1次）" class="wiki-note-text">。

  装备有此牌的丘丘水行游侠在场，我方使用「特技」时：少花费1个元素骰。（每回合1次）

  （牌组中包含丘丘水行游侠，才能加入牌组）'
