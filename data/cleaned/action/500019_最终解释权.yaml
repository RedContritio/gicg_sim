terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  火漆制印: 普通攻击造成1点火元素伤害。
  重击: 我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。
  丹火印: 状态角色进行重击时：造成的伤害+2。可用次数：1（可叠加，最多叠加到2次）重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。
