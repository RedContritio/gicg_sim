  普通攻击

  造成1点火元素伤害。" class="wiki-note-text">。

  装备有此牌的烟绯进行重击重击：

  我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。" class="wiki-note-text">时：对生命值不多于6的敌人造成的伤害+1；如果触发了丹火印，在技能结算后抓一张牌。

  （牌组中包含烟绯，才能加入牌组）'
