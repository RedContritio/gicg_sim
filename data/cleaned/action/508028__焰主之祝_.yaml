effect_text: '战斗行动：我方出战角色为金焰绒翼龙暴君时，装备此牌。

  金焰绒翼龙暴君装备此牌后，立刻使用一次金焰爆轰。

  我方金焰形态触发时，额外舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">1张随机手牌，金焰形态造成的伤害额外提高，其数值等同于所舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">手牌的当前元素骰费用。

  （牌组中包含金焰绒翼龙暴君，才能加入牌组）'
