effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为芙宁娜时，装备此牌。

  芙宁娜装备此牌后，立刻使用一次孤心沙龙孤心沙龙：

  元素战技

  芙宁娜当前处于「始基力：荒性」形态：召唤沙龙成员。

  （芙宁娜处于「始基力：芒性」形态时，会改为召唤众水的歌者）" class="wiki-note-text">。

  装备有此牌的芙宁娜使用孤心沙龙孤心沙龙：

  元素战技

  芙宁娜当前处于「始基力：荒性」形态：召唤沙龙成员。

  （芙宁娜处于「始基力：芒性」形态时，会改为召唤众水的歌者）" class="wiki-note-text">时，会对自身附属万众瞩目万众瞩目：

  状态

  角色进行普通攻击时：使角色造成的物理伤害变为水元素伤害。如果角色处于「荒」形态，则治疗我方所有后台角色1点；如果角色处于「芒」形态，则此伤害+2，但是对一位受伤最少的我方角色造成1点穿透伤害。

  可用次数：1" class="wiki-note-text">。（角色普通攻击时根据形态触发不同效果）

  （牌组中包含芙宁娜，才能加入牌组）'
