effect_text: '角色使用「元素爆发」造成的伤害+2。

  我方引发元素反应时：累计1层盛放的思绪，当盛放的思绪不低于2层时，消耗2层盛放的思绪使所附属角色获得1点充能充能：

  角色使用「元素爆发」时，需要消耗充能。

  角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">。

  （「双手剑」角色才能装备。 角色最多装备1件「武器」）'
