effect_text: '入场时和回合结束时：角色附属1层生命之契生命之契：

  所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏或分配生命值引发的治疗）

  可用次数：1（可叠加，没有上限）。" class="wiki-note-text">。

  我方行动前：所附属角色如果未附属生命之契生命之契：

  所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏或分配生命值引发的治疗）

  可用次数：1（可叠加，没有上限）。" class="wiki-note-text">，则生成1个随机基础元素骰，并且角色下次造成的伤害+1。（每回合1次）

  （「法器」角色才能装备。角色最多装备1件「武器」）'
