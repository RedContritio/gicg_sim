flavor_text: '加油·「究极霸王超级魔剑」

  「···才不是什么便宜纸板大剑呢！那个、这个···呃···这可是过去曾经战胜螃蟹大帝的···究极霸王超级魔剑！」

  经过短暂的商议，各位美露莘一致决定，将这柄曾经在过去的映影中大放异彩的，海沫村最强大的剑送给究极无敌的勇者，作为友谊的纪念。'
