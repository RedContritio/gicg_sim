  圣仪·灰鸰衒潮: 元素爆发造成2点水元素伤害，生成赤冕祝祷。
  赤冕祝祷: 出战状态我方角色普通攻击造成的伤害+1。我方单手剑、双手剑或长柄武器角色造成的物理伤害变为水元素伤害。我方切换角色后：造成1点水元素伤害。（每回合1次）持续回合：2
