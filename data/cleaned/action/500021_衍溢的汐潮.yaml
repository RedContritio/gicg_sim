effect_text: '战斗行动：我方出战角色为坎蒂丝时，装备此牌。

  坎蒂丝装备此牌后，立刻使用一次圣仪·灰鸰衒潮圣仪·灰鸰衒潮：

  元素爆发

  造成2点水元素伤害，生成赤冕祝祷。" class="wiki-note-text">。

  装备有此牌的坎蒂丝生成的赤冕祝祷赤冕祝祷：

  出战状态

  我方角色普通攻击造成的伤害+1。

  我方单手剑、双手剑或长柄武器角色造成的物理伤害变为水元素伤害。

  我方切换角色后：造成1点水元素伤害。（每回合1次）

  持续回合：2" class="wiki-note-text">额外具有以下效果：我方角色普通攻击后：造成1点水元素伤害水元素伤害：

  附着水元素，可发生元素反应：

  蒸发：本伤害+2

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

  绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]" class="wiki-note-text">。（每回合1次）

  （牌组中包含坎蒂丝，才能加入牌组）'
