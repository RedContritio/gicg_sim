  一些效果会使角色在生命值被降为0的时候免于被击倒，并治疗该角色到一定生命值。

  此时，角色不视为被击倒过。（因此，角色所附属的装备和状态不会被弃置，充能也不会被清空。）" class="wiki-note-text">，并治疗该角色到1点生命值，然后「重燃」+1）

