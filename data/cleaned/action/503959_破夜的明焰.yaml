effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为克洛琳德时，装备此牌。

  克洛琳德装备此牌后，立刻使用一次狩夜之巡狩夜之巡：

  元素战技

  自身附属夜巡，移除自身所有生命之契。然后根据所移除的层数，造成雷元素伤害，并治疗自身。（伤害和治疗最多4点）" class="wiki-note-text">。

  我方引发雷元素相关反应雷元素相关反应：

  超载：本伤害+2，目标强制切换到下一个角色

  超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

  原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]

  结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

  扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害" class="wiki-note-text">后:本回合克洛琳德下次造成的伤害+1。(可叠加，最多叠加到+3)

  （牌组中包含克洛琳德，才能加入牌组）'
