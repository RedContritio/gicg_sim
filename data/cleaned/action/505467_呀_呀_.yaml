effect_text: '此卡牌入场时：创建呀——！出战状态

  我方打出特技牌时：若本局游戏我方累计打出了6张特技牌，我方出战角色获得3点护盾，然后造成3点物理伤害。" class="wiki-note-text">。（我方打出特技牌时：若本局游戏我方累计打出了6张特技牌，我方出战角色获得3点护盾护盾：

  此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。" class="wiki-note-text">，然后造成3点物理伤害物理伤害：

  物理伤害不会附着元素，也不会发生元素反应。" class="wiki-note-text">）

  特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：呀！呀！

  可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">：2

  （角色最多装备1个「特技」）'
