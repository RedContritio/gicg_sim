effect_text: '入场时：敌方出战角色附属目标目标：

  状态

  敌方附属有绒翼龙的角色切换至前台时：自身减少1层效果。" class="wiki-note-text">。

  附属角色切换为出战角色，且敌方出战角色附属目标时：如可能，舍弃舍弃：

  通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。" class="wiki-note-text">当前元素骰费用最高的1张手牌，将此次切换视为「快速行动快速行动：

  执行了一次快速行动后，我方可以继续进行其他行动。

  只有执行了一次战斗行动后，才会轮到对方行动。" class="wiki-note-text">」而非「战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">」，少花费1个元素骰，并移除对方所有角色的目标目标：

  状态

  敌方附属有绒翼龙的角色切换至前台时：自身减少1层效果。" class="wiki-note-text">。

  特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：迅疾滑翔

  可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数；

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">：2

  （角色最多装备1个「特技」）'
