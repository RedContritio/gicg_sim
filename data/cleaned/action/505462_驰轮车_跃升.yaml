effect_text: '此牌被舍弃后：对敌方出战角色造成1点火元素伤害火元素伤害：

  附着火元素，可发生元素反应：

  融化：本伤害+2

  蒸发：本伤害+2

  超载：本伤害+2，目标强制切换到下一个角色

  燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）" class="wiki-note-text">。

  特技特技：

  出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。

  使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。

  角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。" class="wiki-note-text">：跃升火元素伤害。"
  class="wiki-note-text">

  （仅玛薇卡可用）

  可用次数可用次数：

  此牌效果触发后，会消耗1次可用次数;

  可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">：2

