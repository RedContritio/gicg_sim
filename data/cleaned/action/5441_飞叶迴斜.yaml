effect_text: '战斗行动战斗行动：

  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为柯莱时，装备此牌。

  柯莱装备此牌后，立刻使用一次拂花偈叶拂花偈叶：

  造成3点草元素伤害。" class="wiki-note-text">。

  装备有此牌的柯莱使用了拂花偈叶的回合中，我方角色的技能引发草元素相关反应草元素相关反应：

  绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

  原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]" class="wiki-note-text">后：造成1点草元素伤害草元素伤害：

  附着草元素，可发生元素反应：

  绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]

  燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

  原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]" class="wiki-note-text">。（每回合1次）

  （牌组中包含柯莱，才能加入牌组）'
