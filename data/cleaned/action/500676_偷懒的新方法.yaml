  我方执行了一次战斗行动后，会轮到对方行动。

  打出具有此规则的手牌是一个战斗行动，而非快速行动。" class="wiki-note-text">：我方出战角色为早柚时，装备此牌。

  早柚装备此牌后，立刻使用一次呜呼流·风隐急进呜呼流·风隐急进：

  元素战技

  造成1点风元素伤害，本角色准备技能：风风轮舞踢。

  如果当前技能引发了扩散，则风风轮舞踢将改为造成被扩散元素的伤害。" class="wiki-note-text">。

