effect_text: '战斗行动：我方出战角色为白术时，装备此牌。

  白术装备此牌后，立刻使用一次愈气全形论。

  装备有此牌的白术在场，无郤气护盾触发治疗效果时：生成1个出战角色类型的元素骰。

  （牌组中包含白术，才能加入牌组）'
term_refs:
- 战斗行动
- 愈气全形论
- 无郤气护盾
terms:
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  愈气全形论: 元素爆发生成脉摄宣明和无卻气护盾。
  无郤气护盾: 出战状态提供1点护盾，保护我方出战角色。此效果被移除，或被重复生成时：造成1点草元素伤害，治疗我方出战角色1点。
