terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  猫爪护盾: 出战状态为我方出战角色提供1点护盾。护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  猫爪冻冻: 元素战技造成2点冰元素伤害，生成猫爪护盾。猫爪护盾：为我方出战角色提供1点护盾。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。
  护盾: 此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。
