  effect_text: '战斗行动：我方出战角色为烟绯时，装备此牌。

    烟绯装备此牌后，立刻使用一次火漆制印火元素伤害。

    火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">。

    装备有此牌的烟绯进行重击时：对生命值不多于6的敌人造成的伤害+1；如果触发了丹火印，在技能结算后抓一张牌。

    （牌组中包含烟绯，才能加入牌组）'
  term_refs:
  - 战斗行动
  - 火漆制印
  - 重击
  - 丹火印
  sub_type: 战斗行动
  deck_constraint: 牌组中包含烟绯，才能加入牌组
