terms:
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  丹火印: 状态角色进行重击时：造成的伤害+2。可用次数：1（可叠加，最多叠加到2次）重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  灼灼: 状态角色进行重击时：少花费1个火元素。（每回合1次）结束阶段：角色附属丹火印。持续回合：2丹火印：状态角色进行重击时：造成的伤害+2。可用次数：1（可叠加，最多叠加到2次）重击我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  火漆制印: 普通攻击造成1点火元素伤害。火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  重击: 我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。
