talent:
  name: 重帘留香
  type: 装备牌
  raw_life: 3
  raw_life_bg: 6
  raw_energy: 0
  raw_energy_bg: 0
  cost:
    水: 3
  effect_text: '战斗行动：我方出战角色为行秋时，装备此牌。

    行秋装备此牌后，立刻使用一次画雨笼山水元素伤害，本角色附着水元素，召唤雨帘剑。

    雨帘剑：

    出战状态

    我方出战角色受到至少为3的伤害时：抵消1点伤害。

    可用次数：2

    附着水元素：

    不通过伤害附着水元素时，发生的元素反应会忽略伤害效果：

    蒸发：没有效果

    感电：没有效果

    冻结：目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    绽放：生成使下次火元素或雷元素伤害+2的[草原核]

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。

    水元素伤害：

    附着水元素，可发生元素反应：

    蒸发：本伤害+2

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]" class="wiki-note-text">。

    装备有此牌的行秋生成的雨帘剑改为可以抵挡至少为2的伤害，并且初始可用次数+1。

    （牌组中包含行秋，才能加入牌组）'
  term_refs:
  - 战斗行动
  - 画雨笼山
  - 雨帘剑
  - 可用次数
  sub_type: 战斗行动
  deck_constraint: 牌组中包含行秋，才能加入牌组
