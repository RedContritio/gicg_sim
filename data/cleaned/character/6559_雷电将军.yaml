  effect_text: '战斗行动：我方出战角色为雷电将军时，装备此牌。

    雷电将军装备此牌后，立刻使用一次奥义·梦想真说雷元素伤害，其他我方角色获得2点充能。

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    雷元素伤害：

    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]

    充能：

    角色使用「元素爆发」时，需要消耗充能。

    角色使用「元素战技」或「普通攻击」后，会获得1点充能。" class="wiki-note-text">。

    装备有此牌的雷电将军使用奥义·梦想真说时每消耗1点「愿力」，都使造成的伤害额外+1。

    （牌组中包含雷电将军，才能加入牌组）'
