terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  重华叠霜领域: 出战状态我方单手剑、双手剑或长柄武器角色造成的物理伤害变为冰元素伤害。持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  重华叠霜: 元素战技造成3点冰元素伤害，生成重华叠霜领域。重华叠霜领域我方单手剑、双手剑或长柄武器角色造成的物理伤害变为冰元素伤害。持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
