terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  生命之契: 状态：所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏或分配生命值引发的治疗）可用次数：1（可叠加，没有上限）。
  血偿勒令: 出战状态我方角色受到伤害后：我方受到伤害的角色和敌方阿蕾奇诺均附属2层生命之契。可用次数：3
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）
  厄月将升: 元素爆发造成4点火元素伤害，移除自身所有生命之契，每移除1层，治疗自身1点。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
