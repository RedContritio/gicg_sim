terms:
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  夜魂加持: 所附属角色可累积「夜魂值」。（最多累积到2点）夜魂值为0时，退出夜魂加持。
  突驰烈进: 状态我方下次行动前，将所附属角色切换为出战角色。
  极限驱动: 状态瓦雷莎切换为「出战角色」后：准备技能：闪烈降临·大火山崩落。可用次数：1闪烈降临·大火山崩落元素爆发造成3点雷元素伤害，此技能视为下落攻击。
  快速行动: 执行了一次快速行动后，我方可以继续进行其他行动。只有执行了一次战斗行动后，才会轮到对方行动。
  连势，三重腾跃！: 被动技能【被动】瓦雷莎使用技能后：如果自身「夜魂值」等于2，则消耗2点「夜魂值」，自身附属极限驱动。
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
