flavor_text: '汰换之果·霜役人

  自幼就被选中的人，经长久年月的教化与训练，在无数次的汰换后才能成为所谓的「役人」。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  掠袭锐势: 状态结束阶段：对所有附属有生命之契的敌方角色造成1点穿透伤害。持续回合：2
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  生命之契: 状态所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏和分配生命值引发的治疗）可用次数：1（可叠加，没有上限）。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  霜刃截击: 元素战技造成3点冰元素伤害。
  血契掠影: 被动技能【被动】本角色使用技能后：对敌方出战角色附属可用次数为（本技能最终伤害值-2）的生命之契。（最多5层）
