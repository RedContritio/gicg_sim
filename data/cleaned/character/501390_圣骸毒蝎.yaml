flavor_text: '亡骸遗毒·圣骸毒蝎

  因为啃噬伟大的生命体，而扭曲异变的毒蝎，操纵着险恶的轰雷。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  噬骸能量块: 事件牌费用：0随机舍弃1张原本元素骰费用最高的手牌，生成1个我方出战角色类型的元素骰。（每回合最多打出1张）
  舍弃: 通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。
  雷锥陷阱: 出战状态所在阵营的角色使用技能后：对所在阵营的出战角色造成2点雷元素伤害。可用次数：初始为创建时所弃置的噬骸能量块张数。（最多叠加到3）
