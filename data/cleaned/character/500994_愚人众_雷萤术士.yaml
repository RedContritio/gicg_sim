terms:
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色。超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]。
  附着雷元素: 不通过伤害附着雷元素时，发生的元素反应会忽略伤害效果：超载：目标强制切换到下一个角色超导：没有效果感电：没有效果原激化：生成使下2次草元素或雷元素伤害+1的[激化领域]
  雷萤护罩: 出战状态为我方出战角色提供1点护盾。创建时：如果我方场上存在雷萤，则额外提供其可用次数的护盾。（最多额外提供3点护盾）
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  霆电迸发: 元素爆发（需准备1个行动轮）造成2点雷元素伤害。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  雾虚之召: 雾虚之兆：元素战技召唤雷萤。
