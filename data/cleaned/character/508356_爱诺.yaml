  effect_text: '战斗行动：我方出战角色为爱诺时，装备此牌。

    爱诺装备此牌后，立刻使用一次精密水冷仪水元素伤害，召唤冷静一下鸭。

    冷静一下鸭

    结束阶段：造成2点水元素伤害。

    可用次数：2

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    水元素伤害：

    附着水元素，可发生元素反应：

    蒸发：本伤害+2

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]

    月感电：生成回合结束时造成2点雷元素伤害的[雷暴云]。（可用次数1，可叠加，没有上限，入场或可用次数增加时，赋予敌方随机1张手牌[电击]）

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此卡牌的爱诺在场时，我方触发感电、月感电、绽放及月绽放反应时：该次伤害+2，并且赋予我方当前元素骰费用最高的1张手牌赋能。（每回合1次）

    （牌组中包含爱诺，才能加入牌组）'
