  韬玉之石，可明八荒；灿若天星，纵横无双。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  岩元素伤害: 和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  玉璋护盾: 出战状态为我方出战角色提供2点护盾。护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。
  石化: 状态角色无法使用技能。（持续到回合结束）
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  地心·磐礴: 元素战技造成1点岩元素伤害，召唤岩脊，生成玉璋护盾。岩脊结束阶段：造成1点岩元素伤害。可用次数：2玉璋护盾为我方出战角色提供2点护盾。护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。岩元素伤害：和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
