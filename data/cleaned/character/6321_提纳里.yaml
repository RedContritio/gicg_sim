terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
  通塞识: 状态所附属角色进行重击时：造成的物理伤害变为草元素伤害，并且会在技能结算后召唤藏蕴花矢。可用次数：2重击：我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。物理伤害：物理伤害不会附着元素，也不会发生元素反应。草元素伤害：附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]藏蕴花矢结束阶段：造成1点草元素伤害。可用次数：1（可叠加，最多叠加到2次）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  识果种雷: 元素战技造成2点草元素伤害，本角色附属通塞识。通塞识所附属角色进行重击时：造成的物理伤害变为草元素伤害，并且会在技能结算后召唤藏蕴花矢。可用次数：2重击：我方行动开始前，如果元素骰总数为偶数，则进行的「普通攻击」将被视为「重击」。物理伤害：物理伤害不会附着元素，也不会发生元素反应。草元素伤害：附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]藏蕴花矢结束阶段：造成1点草元素伤害。可用次数：1（可叠加，最多叠加到2次）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  重击: 我方元素骰子总数为偶数时进行的「普通攻击」，视为「重击」。
  无色元素: 可以用任意类型的元素骰子组合，来支付此费用。
