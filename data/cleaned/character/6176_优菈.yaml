flavor_text: '浪沫的旋舞·优菈

  这只是一场游戏，无论是取胜或落败，你都不会因此被添上罪状。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  冷酷之心: 状态所附属角色使用冰潮的涡旋时：移除此状态，使本次伤害+3。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  凝浪之光剑: 元素爆发造成2点冰元素伤害，召唤光降之剑。光降之剑优菈使用「普通攻击」或「元素战技」时：此牌累积2点「能量层数」，但是优菈不会获得充能。结束阶段：弃置此牌，造成3点物理伤害；每有1点「能量层数」，都使此伤害+1。（影响此牌「可用次数」的效果会作用于「能量层数」。）元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。物理伤害：物理伤害不会附着元素，也不会发生元素反应。可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  冰潮的涡旋: 元素战技造成2点冰元素伤害，如果本角色未附属冷酷之心，则使其附属冷酷之心。冷酷之心所附属角色使用冰潮的涡旋时：移除此状态，使本次伤害+3。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
