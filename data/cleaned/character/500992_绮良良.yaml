terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  猫箱急件: 出战状态绮良良为出战角色时，我方切换角色后：造成1点草元素伤害，抓1张牌。可用次数：1（可叠加，最多叠加到2次）
  安全运输护盾: 出战状态为我方出战角色提供2点护盾。
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
  猫草豆蔻: 出战状态所在阵营打出2张行动牌后：对所在阵营的出战角色造成1点草元素伤害。可用次数：2
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  呜喵町飞足: 元素战技生成猫箱急件和安全运输护盾。
