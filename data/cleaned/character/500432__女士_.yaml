flavor_text: '第八执行官·「女士」

  瞳仁中倒映着破晓的赤红，她最后展开烈焰之翼向黎明飞去。

  「但那并不是曙光，亲爱的罗莎琳。那是焚尽一切的火海。」

  但这也没什么所谓。因为她心中明白，自己早已被烈火吞没。'
terms:
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  严寒: 状态结束阶段：对附属角色造成1点冰元素伤害。可用次数：1所附属角色被附属炽热时，移除此效果。
  冰封的炽炎魔女: 状态行动阶段开始时：如果所附属角色生命值不多于4，则移除此效果。所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到1点生命值。此效果被移除时：所附属角色转换为「焚尽的炽炎魔女」形态。
  炽热: 状态结束阶段：对所附属角色造成1点火元素伤害。可用次数：1所附属角色被附属严寒时，移除此效果
