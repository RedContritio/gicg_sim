flavor_text: '焚夜以炎·玛薇卡

  至明、至炽、至烈的再临之火。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  夜魂加持: 所附属角色可累积「夜魂值」。（最多累积到2点）夜魂值为0时，退出夜魂加持。
  挑选: 从特定的多张牌中选择1张执行效果。
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）
  死生之炉: 状态我方全体角色的技能不消耗「夜魂值」。我方全体角色「普通攻击」造成的伤害+1。可用次数：2
  诸火武装·焚曜之环: 出战状态我方其他角色使用「普通攻击」或特技后：消耗玛薇卡1点「夜魂值」，造成1点火元素伤害。（玛薇卡退出夜魂加持后销毁）
  特技: 出战角色装备有「特技」卡牌时，就可以使用对应的「特技」。使用「特技」是一种「战斗行动」。角色因冻结、石化、眩晕等原因无法使用技能时，也会同时无法使用「特技」。角色使用「特技」时不视为使用技能，无法触发「使用技能后」「角色引发元素反应后」等效果；角色使用「特技」造成的伤害不被视为角色造成的伤害。
  跃升: 特技费用：1消耗1点「夜魂值」造成4点火元素伤害。
  可用次数: 此牌效果触发后，会消耗1次可用次数;可用次数耗尽后，立刻弃置此牌。
  涉渡: 特技费用：0我方切换到下一个角色，将2个元素骰转换为万能元素。（此技能释放后，我方可继续行动）
  疾驰: 特技费用：2消耗1点「夜魂值」，然后准备技能：驰轮车：疾驰。行动阶段开始时：生成2个万能元素骰。
