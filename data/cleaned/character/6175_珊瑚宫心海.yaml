talent:
  name: 匣中玉栉
  type: 装备牌
  raw_life: 3
  raw_life_bg: 6
  raw_energy: 2
  raw_energy_bg: 8
  cost:
    水: 3
  effect_text: '战斗行动：我方出战角色为珊瑚宫心海时，装备此牌。

    珊瑚宫心海装备此牌后，立刻使用一次海人化羽水元素伤害，治疗所有我方角色1点，本角色附属仪来羽衣。

    仪来羽衣

    所附属角色普通攻击造成的伤害+1。

    所附属角色普通攻击后：治疗所有我方角色1点。

    持续回合：2

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。

    水元素伤害：

    附着水元素，可发生元素反应：

    蒸发：本伤害+2

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]" class="wiki-note-text">。

    装备有此牌的珊瑚宫心海使用海人化羽时：召唤一个可用次数为1的化海月；如果化海月已在场，则改为使其可用次数+1。

    仪来羽衣存在期间，化海月造成的伤害+1。

    （牌组中包含珊瑚宫心海，才能加入牌组）'
  term_refs:
  - 战斗行动
  - 海人化羽
  - 可用次数
  - 仪来羽衣
  energy_req: 2
  sub_type: 战斗行动
  deck_constraint: 牌组中包含珊瑚宫心海，才能加入牌组
flavor_text: '真珠之智·珊瑚宫心海

  未雨绸缪，临危莫乱。'
terms:
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
  附着水元素: 不通过伤害附着水元素时，发生的元素反应会忽略伤害效果：蒸发：没有效果感电：没有效果冻结：目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：生成使下次火元素或雷元素伤害+2的[草原核]
  仪来羽衣: 状态所附属角色普通攻击造成的伤害+1。所附属角色普通攻击后：治疗所有我方角色1点。持续回合：2持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  海人化羽: 元素爆发造成2点水元素伤害，治疗所有我方角色1点，本角色附属仪来羽衣。仪来羽衣所附属角色普通攻击造成的伤害+1。所附属角色普通攻击后：治疗所有我方角色1点。持续回合：2元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
