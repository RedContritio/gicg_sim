terms:
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰伤害扩散（水）：对目标以外的所有敌方角色造成1点水伤害扩散（火）：对目标以外的所有敌方角色造成1点火伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷伤害
  夜魂加持: 所附属角色可累积「夜魂值」。（最多累积到2点）持续回合：2
  咔库库: 装备牌特技：援护射击所附属角色「夜魂值」为0时，弃置此牌；此牌被弃置时，所附属角色结束夜魂加持。
  援护射击: 特技费用：2消耗1点「夜魂值」，对上一个敌方角色造成1点风元素伤害风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰伤害扩散（水）：对目标以外的所有敌方角色造成1点水伤害扩散（火）：对目标以外的所有敌方角色造成1点火伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷伤害"
    class="wiki-note-text">，并治疗我方受伤最多的角色2点。
  风元素相关反应: 扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害。扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害。扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害。扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害。
  镇静标记: 状态所在阵营选择行动前：对所附属的角色造成2点对应元素伤害，可用次数1。
  快速行动: 执行了一次快速行动后，我方可以继续进行其他行动。只有执行了一次战斗行动后，才会轮到对方行动。
