terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  越祓草轮: 出战状态我方切换角色后：造成1点雷元素伤害，治疗我方受伤最多的角色1点。（每回合1次）可用次数：3
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  御咏鸣神刈山祭: 元素爆发造成4点雷元素伤害，治疗本角色2点。
