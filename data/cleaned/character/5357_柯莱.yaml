    草元素伤害：

    附着草元素，可发生元素反应：

    绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">。

    装备有此牌的柯莱使用了拂花偈叶的回合中，我方角色的技能引发草元素相关反应草元素相关反应：

    绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">后：造成1点草元素伤害草元素伤害：

    附着草元素，可发生元素反应：

    绽放：本伤害+1，生成使下次火元素或雷元素伤害＋2的[草原核]

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">。（每回合1次）

    （牌组中包含柯莱，才能加入牌组）'
