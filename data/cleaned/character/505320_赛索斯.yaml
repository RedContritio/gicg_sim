flavor_text: '衡明知度·赛索斯

  沙海来客，慧心慧业。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  附着雷元素: 不通过伤害附着雷元素时，发生的元素反应会忽略伤害效果：超载：目标强制切换到下一个角色超导：没有效果感电：没有效果原激化：生成使下2次草元素或雷元素伤害+1的[激化领域]
  轰雷凝集: 我方角色引发雷元素相关反应后:所附属角色获得1点充能。可用次数：1
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  寂想瞑影: 状态所附属角色使用普通攻击时：造成的物理伤害变为雷元素伤害，伤害+1，少花费1个无色元素，并且对敌方生命值最低的角色造成1点穿透伤害。持续回合：2
  充能: 角色使用「元素爆发」时，需要消耗充能。角色使用「元素战技」或「普通攻击」后，会获得1点充能。
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  黑鸢的密喻: 被动技能自身「普通攻击」不会获得充能。自身「普通攻击」后：如可能，消耗全部充能，对生命值最低的敌方造成等额+1的穿透伤害。
