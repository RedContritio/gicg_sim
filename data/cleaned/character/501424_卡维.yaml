terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  迸发扫描: 出战状态双方选择行动前：如果我方场上存在草原核或丰穰之核，则使其可用次数-1，并舍弃我方牌库顶的1张卡牌。然后，造成所舍弃卡牌当前元素骰费用的草元素伤害。可用次数：1（可叠加，最多叠加到3次）
  梅赫拉克的助力: 状态角色「普通攻击」造成的伤害+1，且造成的物理伤害变为草元素伤害。角色普通攻击后：生成迸发扫描。持续回合：2
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  画则巧施: 元素战技造成2点草元素伤害，生成迸发扫描。
  舍弃: 通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。
