  effect_text: '战斗行动：我方出战角色为北斗时，装备此牌。

    北斗装备此牌后，立刻使用一次捉浪雷元素伤害。

    护盾：

    此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。

    准备技能：

    有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。

    轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）

    只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。

    雷元素伤害：

    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]" class="wiki-note-text">。

    装备有此牌的北斗使用踏潮雷元素伤害。

    雷元素伤害：

    附着雷元素，可发生元素反应：

    超载：本伤害+2，目标强制切换到下一个角色

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]" class="wiki-note-text">时：使北斗本回合内「普通攻击」少花费1个无色元素。(最多触发2次)

    （牌组中包含北斗，才能加入牌组）'
