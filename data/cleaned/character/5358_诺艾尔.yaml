  effect_text: '战斗行动：我方出战角色为诺艾尔时，装备此牌。

    诺艾尔装备此牌后，立刻使用一次护心铠岩元素伤害，生成护体岩铠。

    护体岩铠：

    为我方出战角色提供2点护盾。

    此护盾耗尽前，我方受到的物理伤害减半。（向上取整）

    岩元素伤害：

    和已附着的元素发生元素反应：

    结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。

    护盾：

    此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。" class="wiki-note-text">。

    诺艾尔普通攻击后：如果此牌和护体岩铠仍在场，治疗我方所有角色1点。（每回合1次）

    （牌组中包含诺艾尔，才能加入牌组）'
