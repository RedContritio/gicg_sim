    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害

    下落攻击

    角色被切换为「出战角色」后，本回合内的下一个战斗行动若为「普通攻击」，则被视为「下落攻击」。

    持续回合：

    每回合结束阶段，持续回合-1；

    持续回合耗尽后，立刻弃置此牌。" class="wiki-note-text">期间，使用风轮两立风元素伤害。

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害" class="wiki-note-text">时少花费1个风元素。（每附属1次夜叉傩面，可触发2次）

    （牌组中包含魈，才能加入牌组）'
