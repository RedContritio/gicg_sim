terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
  夜叉傩面: 状态所附属角色造成的物理伤害变为风元素伤害，且角色造成的风元素伤害+1。所附属角色进行下落攻击时：伤害额外+2。所附属角色为出战角色，我方执行「切换角色」行动时：少花费1个元素骰。（每回合1次）持续回合：2物理伤害：物理伤害不会附着元素，也不会发生元素反应。风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害下落攻击角色被切换为「出战角色」后，本回合内的下一个战斗行动若为「普通攻击」，则被视为「下落攻击」。持续回合：每回合结束阶段，持续回合-1；持续回合耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
