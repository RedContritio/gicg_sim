  effect_text: '战斗行动：我方出战角色为坎蒂丝时，装备此牌。

    坎蒂丝装备此牌后，立刻使用一次圣仪·灰鸰衒潮水元素伤害，生成赤冕祝祷。

    赤冕祝祷

    我方角色普通攻击造成的伤害+1。

    我方单手剑、双手剑或长柄武器角色造成的物理伤害变为水元素伤害。

    我方切换角色后：造成1点水元素伤害。（每回合1次）

    持续回合：2

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    物理伤害：

    物理伤害不会附着元素，也不会发生元素反应。

    水元素伤害：

    附着水元素，可发生元素反应：

    蒸发：本伤害+2

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

