terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时,如果该牌手的「 出战角色」正在准备技能，则跳过该牌手的行动;如果技能已经完成准备,角色将会在此时直接使用此技能。(此类要准备的技能，
    无法触发「 使用技能」后效果。)只有「出战角色」才能准备技能;如果正在准备技能的「出战角色」被切换到后台,技能的准备就会被打断。
  焚落踢: 元素爆发造成3点火元素伤害。火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  穿透伤害: 穿透伤害无法收到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  熔铁流狱: 元素战技召唤净焰剑狱领域；如果已存在净焰剑狱领域，就先造成1点火元素伤害。净焰剑狱领域结束阶段：造成1点火元素伤害火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）"
    class="wiki-note-text">。可用次数：3当此召唤物在场且迪希雅在我方后台，我方出战角色受到伤害时：抵消1点伤害；然后，如果迪希雅生命值至少为7，则对其造成1点穿透伤害。（每回合1次）火元素伤害：附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。穿透伤害：穿透伤害无法收到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
