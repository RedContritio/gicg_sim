  effect_text: '战斗行动：我方出战角色为迪希雅时，装备此牌。

    迪希雅装备此牌后，立刻使用一次熔铁流狱火元素伤害火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）" class="wiki-note-text">。

    可用次数：3

    当此召唤物在场且迪希雅在我方后台，我方出战角色受到伤害时：抵消1点伤害；然后，如果迪希雅生命值至少为7，则对其造成1点穿透伤害。（每回合1次）

    火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

    燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。

    穿透伤害：

    穿透伤害无法收到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。" class="wiki-note-text">。

    结束阶段：如果装备有此牌的迪希雅生命值不多于6，则治疗该角色2点。

    （牌组中包含迪希雅，才能加入牌组）'
