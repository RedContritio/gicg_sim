terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  夜巡: 状态角色受到狩夜之巡以外的治疗时，改为附属等量的生命之契。所附属角色使用普通攻击时：造成的物理伤害变为雷元素伤害，并使自身附属2层生命之契。持续回合：1
  无色元素: 可以用任意类型的元素骰子组合，来支付此类费用。
  生命之契: 状态所附属角色受到治疗时：此效果每有1次可用次数，就消耗1次，以抵消1点所受到的治疗。（无法抵消复苏或分配生命值引发的治疗）可用次数：1（可叠加，没有上限）。
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  狩夜之巡: 元素战技自身附属夜巡，移除自身所有生命之契。然后根据所移除的层数，造成雷元素伤害，并治疗自身。（伤害和治疗最多4点）
  雷元素相关反应: 超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
