terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  夜魂加持: 状态所附属角色可累积「夜魂值」。（最多累积到2点）夜魂值为0时，退出夜魂加持。
  敏捷切换: 我方下次执行「切换角色」行动时：将此次切换视为「快速行动」而非「战斗行动」。（可叠加，没有上限）
  动能标示: 我方角色造成伤害时：使该次伤害+2。如果「沃陆之邦」的训教处于夜魂加持，则不消耗可用次数，改为消耗「沃陆之邦」的训教1点「夜魂值」。可用次数：2
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」「角色引发元素反应后」等效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  力的三原理: 费用：3,2点充能元素爆发造成2点雷元素伤害，自身进入夜魂加持，获得1点「夜魂值」，生成动能标示。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
