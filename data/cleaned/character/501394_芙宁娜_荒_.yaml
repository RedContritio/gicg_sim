terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  圣俗杂座: 事件牌费用：0在「始基力：荒性」和「始基力：芒性」之中，切换芙宁娜的形态。如果我方场上存在沙龙成员或众水的歌者，也切换其形态。
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  普世欢腾: 出战状态我方出战角色受到伤害或治疗后：叠加1点狂欢值。持续回合：2
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  孤心沙龙: 元素战技芙宁娜当前处于「始基力：荒性」形态：召唤沙龙成员。（芙宁娜处于「始基力：芒性」形态时，会改为召唤众水的歌者）
  万众瞩目: 状态角色进行普通攻击时：使角色造成的物理伤害变为水元素伤害。如果角色处于「荒」形态，则治疗我方所有后台角色1点；如果角色处于「芒」形态，则此伤害+2，但是对一位受伤最少的我方角色造成1点穿透伤害。可用次数：1
