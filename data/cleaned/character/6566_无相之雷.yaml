flavor_text: '无相之雷

  代号为「阿莱夫」的高级雷元素生命。

  就算猜拳获胜，它一般也不会认输。'
terms:
  雷元素伤害: 附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]
  准备技能: 有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。
  猜拳三连击·剪刀: 元素战技（需准备1个行动轮）造成2点雷元素伤害，然后准备技能：猜拳三连击·布。雷元素伤害：附着雷元素，可发生元素反应：超载：本伤害+2，目标强制切换到下一个角色超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害原激化：本伤害+1，生成使下2次草元素或雷元素伤害+1的[激化领域]准备技能：有些技能无法被直接使用，而是需要一定次数的行动轮来进行准备。轮到一位牌手行动时，如果该牌手的「出战角色」正在准备技能，则跳过该牌手的行动；如果技能已经完成准备，角色将会在此时直接使用此技能。（此类需要准备的技能，无法触发「使用技能后」效果。）只有「出战角色」才能准备技能；如果正在准备技能的「出战角色」被切换到后台，技能的准备就会被打断。猜拳三连击·布：元素战技（需准备1个行动轮）造成3点雷元素伤害。
  猜拳三连击·布: 元素战技（需准备1个行动轮）造成3点雷元素伤害。
  雷晶核心: 状态所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到1点生命值。免于被击倒：一些效果会使角色在生命值被降为0的时候免于被击倒，并治疗该角色到一定生命值。此时，角色不视为被击倒过。(因此，角色所附属的装备和状态不会被弃置，充能也不会被清空。）
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
