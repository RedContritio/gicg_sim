terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  岩元素伤害: 和已附着的元素发生元素反应：结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（水）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（火）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。结晶（雷）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  汲取对应元素的力量: 若陀龙王可以汲取冰/水/火/雷元素的力量。（同时只能汲取其中一种）若陀龙王已汲取上述元素的力量时：根据所汲取的元素类型，获得技能霜刺破袭/洪流重斥/炽焰重斥/霆雷破袭。
  磐岩百相·元素凝晶: 状态角色受到冰/水/火/雷元素伤害后：如果角色当前未汲取该元素的力量，则移除此状态，然后角色汲取对应元素的力量。汲取对应元素的力量：若陀龙王可以汲取冰/水/火/雷元素的力量。（同时只能汲取其中一种）若陀龙王已汲取上述元素的力量时：根据所汲取的元素类型，获得技能霜刺破袭/洪流重斥/炽焰重斥/霆雷破袭。
  磐岩百相·元素汲取: 状态角色可以汲取冰/水/火/雷元素的力量，然后根据所汲取的元素类型，获得技能霜刺破袭/洪流重斥/炽焰重斥/霆雷破袭。（角色同时只能汲取一种元素，此状态会记录角色已汲取过的元素类型数量）角色汲取了一种和当前不同的元素后：生成1个所汲取元素类型的元素骰。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
