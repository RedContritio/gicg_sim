  代号为「塔勒特」的高级冰元素生命。

  似乎很不擅长球类运动···'
terms:
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  四迸冰锥: 状态角色进行普通攻击时：对所有敌方后台角色造成1点穿透伤害。可用次数：1
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  冰晶核心: 状态所附属角色被击倒时：移除此效果，使角色免于被击倒，并治疗该角色到1点生命值。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  严寒: 状态结束阶段：对附属角色造成1点冰元素伤害。可用次数：1（所附属角色被附属炽热时，移除此效果。）
