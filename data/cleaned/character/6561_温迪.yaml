flavor_text: '风色诗人·温迪

  「四季轮转，四风从不止息。」

  「当然啦，功劳也不是它们的，主要是我的。」

  「要是没有吟游诗人，谁去把这些传唱？」'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
  距离我方出战角色最近的角色: 对方场上距离我方出战角色「最近」的角色，指的是位置与我方出战角色最接近的敌方角色。如果存在多个位置最接近的角色，则其中靠前的角色被视为「最近」。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  高天之歌: 元素战技造成2点风元素伤害，生成风域。风域我方执行「切换角色」行动时：少花费1个元素骰。可用次数：2可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
  无色元素: 可以用任意类型的元素骰子组合，来支付此费用。
