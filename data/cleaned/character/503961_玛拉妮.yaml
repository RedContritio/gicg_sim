terms:
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  咬咬鲨鱼: 装备牌双方切换角色后，且玛拉妮为出战角色时：消耗1点「夜魂值」，使敌方出战角色附属啃咬目标。特技：鲨鲨冲浪板所附属角色「夜魂值」为0时，弃置此牌;此牌被弃置时，所附属角色结束夜魂加持。
  夜魂加持: 状态所附属角色可累积「夜魂值」。（最多累积到2点）
  鲨鲨冲浪板: 特技：费用：0切换到上一个我方角色，使敌方出战角色附属1层啃咬目标。（若我方后台角色均被击倒，则额外消耗1点「夜魂值」）
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  啃咬目标: 状态受到玛拉妮或鲨鲨飞弹伤害时：移除此效果，每层使此伤害+2。（层数可叠加，没有上限）
