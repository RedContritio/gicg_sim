terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰伤害扩散（水）：对目标以外的所有敌方角色造成1点水伤害扩散（火）：对目标以外的所有敌方角色造成1点火伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷伤害
  灵枪·仪式杖: 特技：多重瞄准。此牌被弃置时，所附属角色结束夜魂加持。（角色最多装备1个「特技」）
  夜魂加持: 状态所附属角色可累积「夜魂值」。（最多累积到2点）
  多重瞄准: 特技费用：2消耗1点「夜魂值」，造成1点风元素伤害，然后随机舍弃3张原本元素骰费用最高的手牌。
  追影弹: 事件牌费用：3加入手牌时：若我方出战角色为火/水/雷/冰，则将此牌转化为对应元素。打出或从手牌中舍弃此牌时：优先对敌方出战角色造成1点风元素伤害，然后将一张追影弹随机放进牌库。
  舍弃: 通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。
