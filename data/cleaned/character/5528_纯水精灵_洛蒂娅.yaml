talent:
  name: 百川奔流
  type: 装备牌
  raw_life: 4
  raw_life_bg: 6
  raw_energy: 3
  raw_energy_bg: 8
  cost:
    水: 4
  effect_text: '战斗行动：我方出战角色为纯水精灵·洛蒂娅时，装备此牌。

    纯水精灵·洛蒂娅装备此牌后，立刻使用一次潮涌与激流水元素伤害；我方每有1个召唤物，再使此伤害+1。

    元素爆发：

    角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。

    水元素伤害：

    附着水元素，可发生元素反应：

    蒸发：本伤害+2

    感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]" class="wiki-note-text">。

    装备有此牌的纯水精灵·洛蒂娅施放潮涌与激流时，使我方所有召唤物可用次数+1。

    （牌组中包含纯水精灵·洛蒂娅，才能加入牌组）'
  term_refs:
  - 战斗行动
  - 潮涌与激流
  - 可用次数
  energy_req: 3
  sub_type: 战斗行动
  deck_constraint: 牌组中包含纯水精灵·洛蒂娅，才能加入牌组
flavor_text: '净水之主·洛蒂娅

  「但，只要百川奔流，雨露不休，水就不会消失…」'
terms:
  水元素伤害: 附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火/雷伤害+2的[草原核]
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  潮涌与激流: 元素爆发造成4点水元素伤害；我方每有1个召唤物，再使此伤害+1。元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。水元素伤害：附着水元素，可发生元素反应：蒸发：本伤害+2感电：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）绽放：本伤害+1，生成使下次火元素或雷元素伤害+2的[草原核]
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
