  effect_text: "战斗行动：我方出战角色为刻晴时，装备此牌。\n刻晴装备此牌后，立刻使用一次星斗归位雷元素伤害，生成手牌雷楔。\n雷楔\n战斗行动：将刻晴切换到场上，立刻使用星斗归位。本次星斗归位会为刻晴附属雷元素附魔，但是不会再生成雷楔。\n\
    （刻晴使用星斗归位时，如果此牌在手中：不会再生成雷楔，而是改为舍弃此牌，并为刻晴附属雷元素附魔） \n战斗行动：\n我方执行了一次战斗行动后，会轮到对方行动。\n\
