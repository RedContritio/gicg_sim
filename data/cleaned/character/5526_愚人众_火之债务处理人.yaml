    潜行

    所附属角色受到的伤害-1，造成的伤害+1。

    可用次数：2

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的愚人众·火之债务处理人生成的潜行获得以下效果：

    初始可用次数+1，并且使所附属角色造成的物理伤害变为火元素伤害火元素伤害：

    附着火元素，可发生元素反应：

    融化：本伤害+2

    蒸发：本伤害+2

    超载：本伤害+2，目标强制切换到下一个角色

