terms:
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  附着冰元素: 不通过伤害附着冰元素时，发生的元素反应会忽略伤害效果：融化：没有效果超导：没有效果冻结：使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  流萤护罩: 出战状态为我方出战角色提供1点护盾。创建时：如果我方场上存在冰萤，则额外提供其可用次数的护盾。（最多额外提供3点护盾）护盾：此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  雾虚摇唤: 元素战技造成1点冰元素伤害，召唤冰萤。冰萤结束阶段：造成1点冰元素伤害。可用次数：2（可叠加，最多叠加到3次）愚人众·冰萤术士「普通攻击」后：此牌可用次数+1。愚人众·冰萤术士受到元素反应伤害后：此牌可用次数-1。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
