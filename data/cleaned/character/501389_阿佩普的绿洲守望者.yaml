flavor_text: '智慧终景·阿佩普的绿洲守望者

  阿佩普曾独自沉溺于末日的风景当中。所有的人、神、龙、走兽、飞鸟与游鱼，所有记忆、智慧、话语与仇恨将都磨为无色尘粉，最后一轮明月之光则化作白焰之雨落在荒土之上。

  ······

  阿佩普曾视沙海之底为自己的墓场，而非失乡之王的行宫。「智慧」的毒很快就会让它从无数个月亮的仇恨与愤怒中解脱。它已经对终末缺乏颜色的景象感到厌倦了。直到最终年轻的神明与金色的旅人让它再度回想起，即便自己曾经主宰的青绿土地已经化作饰金的荒原，即便自己与子嗣为了在其中生存而变得扭曲丑陋，但它的心中始终珍藏着那一角绿洲的景象。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  草元素伤害: 附着草元素，可发生元素反应：绽放：本伤害+1，生成使下次火/雷伤害＋2的[草原核]燃烧：本伤害+1，生成回合结束时造成1点火伤害的[燃烧烈焰]（可生效1次，最多叠加到2次）原激化：本伤害+1，生成使下2次草/雷伤害+1的[激化领域]
  唤醒眷属: 事件牌费用：2个草元素打出此牌或舍弃此牌时：召唤一个独立的增殖生命体。
  绿洲之滋养: 出战状态我方打出唤醒眷属时：少花费1个元素骰。可用次数：1（可叠加到3）
  重燃的绿洲之心: 状态所附属角色造成的伤害+3。所附属角色使用技能后：移除我方场上的绿洲之滋养，每移除1层就治疗所附属角色1点。
  护盾: 此护盾所保护的角色受到伤害时，将会消耗护盾来抵消伤害。
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
