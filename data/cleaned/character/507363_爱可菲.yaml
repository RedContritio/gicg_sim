terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  可用次数: 此牌效果触发后，会消耗1次可用次数;可用次数耗尽后，立刻弃置此牌。
  冰元素相关反应: 冻结：本伤害+1，目标本回合无法行动。（受到物理或火元素伤害后提前解除，但是伤害+2）融化：本伤害+2。超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害。扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害。结晶（冰）：本伤害+1，我方出战角色获得1点护盾（可叠加，最多2点）。
  鎏金殿堂: 事件牌费用：0本回合中，目标角色下次造成的伤害+2。（每回合每个角色最多食用1次「料理」）
  雾凇秋分: 事件牌费用：0治疗目标角色1点，目标角色获得1点额外最大生命值。（每回合每个角色最多食用1次「料理」）
  白浪拂沙: 事件牌费用：2所有我方角色获得饱腹，并且下次使用技能时少花费1个元素骰。（每回合每个角色最多食用1次「料理」）
  一捧绿野: 事件牌费用：1所有我方角色获得饱腹，并且下次造成的伤害+1。（每回合每个角色最多食用1次「料理」）
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  低温烹饪: 元素战技造成1点冰元素伤害，召唤厨艺机关·低温冷藏模式。
