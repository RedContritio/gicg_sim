    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）" class="wiki-note-text">。

    装备有此牌的凯亚使用霜袭后：治疗自身2点。（每回合1次）

    （牌组中包含凯亚，才能加入牌组）'
