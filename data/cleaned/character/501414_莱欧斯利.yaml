terms:
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  寒烈的惩裁: 状态角色进行普通攻击时：如果角色生命至少为6，则此技能少花费1个冰元素，伤害+1，且对自身造成1点穿透伤害。如果角色生命不多于5，则使此伤害+1，并且技能结算后治疗角色2点。可用次数：2
  余威冰锥: 出战状态我方选择行动前：造成2点冰元素伤害。可用次数：1
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  迅烈倾霜拳: 普通攻击造成1点冰元素伤害。
