  仙法·救苦度厄: 元素爆发造成3点冰元素伤害，生成度厄真符。度厄真符我方角色使用技能后：如果该角色生命值未满，则治疗该角色2点。可用次数：3元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
