terms:
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰伤害扩散（水）：对目标以外的所有敌方角色造成1点水伤害扩散（火）：对目标以外的所有敌方角色造成1点火伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷伤害
  步天梯: 出战状态我方执行「切换角色」行动时：少花费1个元素骰。可用次数：1（可叠加，最多叠加到2次）
  闲云冲击波: 状态我方切换到所附属角色后：造成1点风元素伤害。可用次数：1（可叠加，最多叠加到2次）
  竹星: 装备牌费用：0特技：仙力助推可用次数：2（角色最多装备1个「特技」）
  仙力助推: 特技费用：1治疗所附属角色2点，并使其下次普通攻击视为下落攻击，伤害+1并且技能结算后造成1点风元素伤害。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  朝起鹤云: 元素战技造成2点风元素伤害，生成步天梯，本角色附属闲云冲击波。
  清风散花词: 普通攻击造成1点风元素伤害。
