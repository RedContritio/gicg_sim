terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  蒲公英之风: 元素爆发治疗我方所有角色2点，召唤蒲公英领域。蒲公英领域结束阶段：造成1点风元素伤害，治疗我方出战角色1点。可用次数：3元素爆发：角色的充能达到上限时，可以消耗所有的充能，来使用威力强大的「元素爆发」。风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  蒲公英领域: 召唤物结束阶段：造成1点风元素伤害，治疗我方出战角色1点。可用次数：3风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
