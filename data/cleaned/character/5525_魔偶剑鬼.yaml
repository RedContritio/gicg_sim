talent:
  name: 机巧神通
  type: 装备牌
  raw_life: 3
  raw_life_bg: 3
  raw_energy: 0
  raw_energy_bg: 0
  cost:
    风: 3
  effect_text: '战斗行动：我方出战角色为魔偶剑鬼时，装备此牌。

    魔偶剑鬼装备此牌后，立刻使用一次孤风刀势风元素伤害。

    可用次数：2

    风元素伤害：

    和已附着的元素发生元素反应：

    扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害

    扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害

    扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害

    扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">。

    装备有此牌的魔偶剑鬼施放孤风刀势后，我方切换到后一个角色；施放霜驰影突冰元素伤害。

    可用次数：2

    冰元素伤害：

    附着冰元素，可发生元素反应:

    融化：本伤害+2

    超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害

    冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）

    可用次数：

    此牌效果触发后，会消耗1次可用次数；

    可用次数耗尽后，立刻弃置此牌。" class="wiki-note-text">后，我方切换到前一个角色。

    （牌组中包含魔偶剑鬼，才能加入牌组）'
  term_refs:
  - 战斗行动
  - 孤风刀势
  - 霜驰影突
  sub_type: 战斗行动
  deck_constraint: 牌组中包含魔偶剑鬼，才能加入牌组
flavor_text: '万般机巧·魔偶剑鬼

  今日，其仍徘徊在因缘断绝之地。'
terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  风元素伤害: 和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害
  可用次数: 此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  冰元素伤害: 附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  孤风刀势: 元素战技召唤剑影·孤风。剑影·孤风结束阶段：造成1点风元素伤害。可用次数：2风元素伤害：和已附着的元素发生元素反应：扩散（冰）：对目标以外的所有敌方角色造成1点冰元素伤害扩散（水）：对目标以外的所有敌方角色造成1点水元素伤害扩散（火）：对目标以外的所有敌方角色造成1点火元素伤害扩散（雷）：对目标以外的所有敌方角色造成1点雷元素伤害可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
  霜驰影突: 元素战技召唤剑影·霜驰。剑影·霜驰结束阶段：造成1点冰元素伤害。可用次数：2冰元素伤害：附着冰元素，可发生元素反应:融化：本伤害+2超导：本伤害+1，对目标以外的所有敌方角色造成1点穿透伤害冻结：本伤害+1，使目标本回合无法行动（受到物理或火元素伤害后提前解除，但是伤害+2）可用次数：此牌效果触发后，会消耗1次可用次数；可用次数耗尽后，立刻弃置此牌。
