terms:
  物理伤害: 物理伤害不会附着元素，也不会发生元素反应。
  火元素伤害: 附着火元素，可发生元素反应：融化：本伤害+2蒸发：本伤害+2超载：本伤害+2，目标强制切换到下一个角色燃烧：本伤害+1，生成回合结束时造成1点火元素伤害的[燃烧烈焰]（可用次数1，最多叠加到2）
  舍弃: 通过行动牌或角色技能的效果，将行动牌从手牌或牌库中弃置。
  热情护盾: 出战状态为我方出战角色提供2点护盾。
  穿透伤害: 穿透伤害无法受到伤害加成，但是也无法被护盾、伤害免疫等效果抵消。
  氛围烈焰: 出战状态我方宣布结束时：如果我方的手牌数量不多于1，则造成1点火元素伤害。可用次数：2
  战斗行动: 我方执行了一次战斗行动后，会轮到对方行动。打出具有此规则的手牌是一个战斗行动，而非快速行动。
  炎舞: 普通攻击造成2点物理伤害。
