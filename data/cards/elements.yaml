# 七圣召唤元素 enum:wiki attr['元素'] 字面值 → 单字元素名。
#
# 仅用于 character / monster 的 element 解析(skill cost mapping 的元素编号见 cost_bg_mapping.yaml bg 1-7)。
elements:
  # character / talent attr['元素'] 字面 → 单字元素
  风元素: 风
  火元素: 火
  雷元素: 雷
  冰元素: 冰
  水元素: 水
  草元素: 草
  岩元素: 岩
  # monster attr['元素'] 字面(无 '元素' 后缀)
  风: 风
  火: 火
  雷: 雷
  冰: 冰
  水: 水
  草: 草
  岩: 岩
  # 物理:无元素怪物(机关 / 丘丘人 / 遗迹守卫等)
  物理: ''
