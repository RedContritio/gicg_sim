# attr 字段值 expected pattern 声明(parse_attr 子串校验用)。
#
# value_type:
#   pure_han              纯汉字
#   int                   纯数字
#   int_with_unit         数字 + 可选单位(点 / 点战意)
#   cost_phrase           花费短语:数字 / N点充能 / N<元素>元素 / N，M点充能 等
#   element_token         元素 token:'风元素'/'火'/'物理' 等(查 elements.yaml)
#   pure_han_optional_punct  纯汉字 + 可选 wiki 标点(中点 · / 全角逗号 ， / 半角斜杠 /)
#   free_text_with_han    任意自由文本含至少 1 汉字(适合 '获取'/'获取方式' 这类描述性字段)
#
# 子串匹配 pattern → 静默接受;不匹配 → warn (数据可疑);
# attr key 未声明 schema → warn ('未声明 attr_value_schema 的 key:<key>')。

attr_value_schema:
  类型: pure_han                  # 装备牌 / 事件牌 / 支援牌 / 角色牌
  标签: pure_han                  # 天赋 / 武器 / 食物 / 圣遗物 / 道具 / 伙伴 / 场地 / 元素共鸣 / 元素幻变 / 秘传 / 特技
  花费: cost_phrase
  充能: int_with_unit
  攻击: int
  元素: element_token
  武器: pure_han                  # 双手剑 / 单手剑 / 长柄武器 / 弓 / 法器 / 其他武器
  阵营: pure_han_optional_punct   # 蒙德 / 枫丹，愚人众 / 魔物/丘丘人
  获取: free_text_with_han
  获取方式: free_text_with_han
  获得方式: free_text_with_han    # alias of 获取方式
  始基力: pure_han                # 圣俗杂座
