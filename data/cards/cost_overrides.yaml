# cost 推断 override(人工判定的 wiki 数据 typo 修复)。
#
# 使用场景:全源严格交叉验证(mapping + entry hash + list hash + list filter + attr 花费 + skill 模板)
# 任一不一致 raise;parser 在 raise 前先查此 override。
#
# 严格契约:
# - 每条 override hash 级唯一(by entry_cost_hash + skill_icon_hash + raw 4 + 其他源);重复签名 raise
# - 必须 exact match 才生效;任一字段变化(wiki 修正 typo / list 改 schema) → override 失效 → raise
# - 每条 override 必须详细说明 conflict_details,user review 凭据
#
# Schema:
#   overrides:
#     - signature:                       # 完整签名 — 任一字段变化失效
#         life: <int>                    # raw skill / action base 的 life
#         life_bg: <int>                 # raw life_bg
#         energy: <int>                  # raw energy
#         energy_bg: <int>                # raw energy_bg
#         entry_cost_hash: <str|"">       # entry_page raw 内嵌 costBgIcon URL → hash(卡级)
#         entry_energy_hash: <str|"">     # entry_page raw 内嵌 energyBgIcon URL → hash
#         skill_icon_hash: <str|"">       # character skill icon URL → hash(技能级 unique key)
#         list_cost_hash: <str|"">        # list API ext.costBgIcon → hash
#         list_energy_hash: <str|"">      # list API ext.energyBgIcon → hash
#         list_filter_花费: <int|null>    # list API filter.text "花费/花费N" 中的 N
#         attr_花费_total: <int|null>     # entry_page attr['花费'] 数字
#         skill_type: <str>               # character skill 类型(普攻/战技/爆发/被动);action 为空
#         character_element: <str>        # character element(火/水/...);action 为空
#       result:
#         cost: {<kind>: <n>, ...}       # parser 输出的 cost dict
#         energy_req: <int>              # 0 表示无能量需求
#       conflict_details:                # 必填:user review 凭据
#         card_ref: <id>_<name>(<skill?>)
#         sources: { ... }                # 各源对照
#         resolution: "..."               # 选哪个源、为什么

