# v_phase2 — ADR-0019 Phase 2 真实角色池
#
# 严格以 data/cleaned/character/ 为单一权威源:
#   - 仅收 mihoyo parent_class=character 类(玩家可组队的"角色牌")
#   - monster 类 (parent_class=monster) 不入此池
#   - 每个 lua 头部必须明示 `-- source: data/cleaned/character/<id>_<name>.yaml`
#   - HP / energy / element / weapon / cost 字段强制对照 cleaned,不允许偏离
#   - 机制简化的部分必须在 lua 注释 + commit msg 明说 deferred
#   - 配套 spike test 锁定 HP / 技能 cost 等数值与 cleaned 一致
#
# 不细分 mihoyo 游戏版本号(mihoyo wiki 原始 JSON 不含版本字段;ref/genius-invokation
# 的 .since() 仅覆盖部分角色)。用单一池暂存所有真实 character lua,后续若按
# 真实游戏版本拆分(v3.3/v4.7/v5.3/...)再迁移。

[version]
id     = "v_phase2"
parent = ""
desc   = "Phase 2 真实 character 池 — data/cleaned/character/ 严格对照,monster 不入此池"

[cards]
remove = []

[characters]
remove = []
