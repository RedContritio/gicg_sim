# Test fixture pool — synthetic chars/cards used by curriculum stages,
# tests, and bench scripts. Kept isolated from prod card definitions so
# training cfgs that select pool="test_basic" see exactly these cards
# and chars without prod-pool noise.
#
# parent = null because no shared cards exist between test fixtures and
# prod (the legacy filler card 碌碌无为 lives in v_legacy and is not
# expected to be referenced from this pool).

[version]
id = "test_basic"
parent = ""
desc = "Synthetic 测试角色 + 测试卡 fixtures, isolated from prod pools."

[cards]
remove = []

[characters]
remove = []
