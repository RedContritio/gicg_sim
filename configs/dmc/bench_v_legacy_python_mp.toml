# I29 T-C2 fair bench — Python mp baseline (extends stage3_b_v_legacy.toml)。
#
# 与 bench_v_legacy_go.toml 配对:同 commit + 同 Win box + 同 scenario / card_pool /
# opponent_mix / network / debug,只切 [pipeline] mode = "async"(Python mp.Process pool)
# vs Go-actor backend。 跑 50K frames(≥ 5K warm-up + ≥ 45K steady-state),compare
# fps / master_rss / iter_rate / decode_errors / all perf spans。
#
# 命令(Win box):
#   .venv\Scripts\python -m tools.runs.train configs/dmc/bench_v_legacy_python_mp.toml

[meta]
extends = "stage3_b_v_legacy.toml"
paradigm = "dmc"
run_label = "bench_v_legacy_python_mp"
host = "remote"

[remote]
ssh = "dev@192.168.31.56"
root = "D:/gicg_dev"
os = "windows"
hostname = "DESKTOP-GHJCC7Q"

[paradigm.dmc]
# 50K frames @ Win N=16 historical ~25-37 fps = 22-33 min wall。
total_frames = 50_000

[paradigm.dmc.opponent_mix]
# extends stage3_b_v_legacy.toml weights (random=0.20 / f1d2=0.30 / f1d4=0.20 /
# historical=0.30)。 C2 (2026-05-25): cross-language fair bench parity — Python
# `_score_best_response` 与 Go `gicg_actor/dmc/greedy_player.go` MinimaxBudget 显式
# 对齐到 4000 node cap (pre-C2 Go 硬码 4000,Python no cap → algo asymmetry 污染
# perf ratio,Layer 4 3.66x 部分来自此 shortcut)。 production stage3 cfg 不加此字段
# 保持 production 跑 uncapped D4。
minimax_node_budget = 4000

[debug]
# Phase A 全 perf instrumentation on — bench 数据出后 metrics.jsonl + perf jsonl
# 含全部 sub-span 数据,T-C3 决策 / 后续 Phase B fix 都依赖。 I29 redesign P3
# (2026-05-25): go_perf_trace field 删 (cgo path 退役,Go subprocess 自管 perf trace)。
perf_trace = true
