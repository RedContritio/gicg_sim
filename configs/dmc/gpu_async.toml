# DMC mp-mode (async pipeline) smoke cfg — E target wiring verify.
#
# Extends smoke.toml; flips pipeline.mode to async and points the
# paradigm mp_*_path fields at training.paradigms.dmc.mp_factories so
# DMCMultiProcessCollector._bootstrap can resolve them.
#
# device='cpu' keeps the smoke usable on Mac with no GPU dependency.
# For production GPU runs set [meta].device='cuda' and bump num_actors
# to whatever the inference server can sustain (see E target benchmark
# in training/paradigms/dmc/PLAN.md).

[meta]
extends = "smoke.toml"
paradigm = "dmc"
run_label = "dmc_gpu_async_smoke"
device = "cpu"

[pipeline]
mode = "async"
num_actors = 2

[paradigm.dmc]
mp_env_factory_path = "training.paradigms.dmc.mp_factories.build_dmc_env_factory"
mp_opp_registry_path = "training.paradigms.dmc.mp_factories.build_dmc_opp_registry"
mp_provider_path = "training.paradigms.dmc.mp_factories.build_dmc_provider"

[eval]
n_workers = 1
schedule = "every_1000_steps"
