# DMC perf benchmark cfg — serial single-actor (profile_actor / profile_train target).
#
# Extends stage3_b_v_legacy.toml (production scale: d_model=128, n_cross_layers=2,
# pool=v_legacy 全 26 张, team_size=1)。Override mode=serial + num_actors=1 +
# device=cpu(单进程 CPU 跑 actor 路径,与 Mac baseline §3.4.5.6 同 hyper)。
# total_frames 1e6 太大,profile 模式不会全跑完(--duration-seconds 切断)。
#
# 用作 tools.runs.profile {actor,train} target — cfg-driven dispatch 到 Win box。

[meta]
extends = "stage3_b_v_legacy.toml"
paradigm = "dmc"
run_label = "dmc_perf_bench_serial"
device = "cpu"
host = "remote"

[remote]
ssh = "dev@192.168.31.56"
root = "D:/gicg_dev"
os = "windows"
hostname = "DESKTOP-GHJCC7Q"

[pipeline]
mode = "serial"
num_actors = 1
