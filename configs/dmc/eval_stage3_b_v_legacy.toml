# Eval-only cfg for Stage 3 v_legacy 26-card scenario,匹配训练 cfg
# `stage3_b_v_legacy_go.toml` 的 scenario。 走 tools.eval.daemon (--max-iterations=1
# 一次性)或 tools.eval.daemon 长期 poll 模式。
#
# 用法 (一次性):
#   .venv/bin/python -m tools.eval.daemon configs/dmc/eval_stage3_b_v_legacy.toml \
#       --run-label <ts>_<NNN>_dmc_stage3_b_v_legacy_go \
#       --remote dev@192.168.31.56:D:/gicg_dev/artifacts \
#       --max-iterations 1

[meta]
paradigm = "dmc"  # FU-W1B required field — test_shipped_configs_load_successfully 校验

base = "stage3"

[scenario]
card_pool = [
    "乘胜追击", "以攻代守", "以牙还牙", "以逸待劳", "伏兵之术", "佛跳墙",
    "刺刺猫爪", "占星", "反制", "发现静电", "守正", "星愿", "清洁时间",
    "玄冰", "瞬身之术", "碌碌无为", "美味烧鸡", "荷花酥", "蝶鳞", "西风剑",
    "西风长枪", "诅咒", "速速茶点", "铁剑", "铁弓", "铁枪",
]
# F4 显式 deck(2026-06-12):base="stage3" 预设自带 deck_padding=pad15,
# eval env 此前同训练一样静默截断到 15 张;引擎不再静默截断,以下逐卡列表
# = 截断时代实际生效 15 张(与 stage3_b_v_legacy.toml 训练 cfg 一致),bit 级不变。
deck_0 = [
    "乘胜追击", "以攻代守", "以牙还牙", "伏兵之术", "佛跳墙", "占星", "反制",
    "清洁时间", "玄冰", "瞬身之术", "美味烧鸡", "荷花酥", "蝶鳞", "西风长枪", "诅咒",
]
deck_1 = [
    "乘胜追击", "以攻代守", "以牙还牙", "伏兵之术", "佛跳墙", "占星", "反制",
    "守正", "清洁时间", "玄冰", "瞬身之术", "美味烧鸡", "荷花酥", "西风剑", "诅咒",
]
max_rounds = 15
pool = ["v_legacy"]

[agent]
d_model = 128
n_cross_layers = 2

[eval]
# Sanity-quick mode: 跑 `tools.eval.ckpt --n-scenarios 16 --baselines F1-D2` 即可。
# Production PASS gate (Phase 3.5 §3.5.4): n_scenarios=128 + baselines=["F1-D2","F1-D4"]。
baselines = ["F1-D2", "F1-D4"]
n_scenarios = 128
scenarios_seed = 42
swap_sides = true
