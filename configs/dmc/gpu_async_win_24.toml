# DMC mp-mode Windows benchmark cfg — 24 actor variant (T3, PLAN target).
# Same shape as gpu_async_win.toml, num_actors=24.

[meta]
extends = "smoke.toml"
paradigm = "dmc"
run_label = "dmc_gpu_async_win_24"
device = "cuda"

[pipeline]
mode = "async"
num_actors = 24

[paradigm.dmc]
mp_env_factory_path = "training.paradigms.dmc.mp_factories.build_dmc_env_factory"
mp_opp_registry_path = "training.paradigms.dmc.mp_factories.build_dmc_opp_registry"
mp_provider_path = "training.paradigms.dmc.mp_factories.build_dmc_provider"

[eval]
n_workers = 1
schedule = "every_1000_steps"
