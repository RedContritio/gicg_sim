# I29 T-C2 fair bench — Go-actor variant (extends stage3_b_v_legacy_go.toml)。
#
# 与 bench_v_legacy_python_mp.toml 配对:同 commit + 同 Win box + 同 scenario /
# card_pool / opponent_mix / network / debug,只切 [pipeline] actor_backend = "go"
# vs Python mp.Process pool。 跑 50K frames(≥ 5K warm-up + ≥ 45K steady-state)。
#
# 期望(Phase A + T-B1 fix 后):
# - fps ≥ 70 (≥ Python mp baseline 35-37 fps 的 2x — gate per perf_plan.md)
# - master_rss ≤ 4 GB (T-C2 Win+cu130 cuda_reserved 已知 ~6 GB,gate 放宽)
# - transition_writer.mutex_wait mean ≈ 0 (T-B1 per-actor conn 后)
# - inference_client.recv 长度 ≈ socket round-trip(看 InfServer batch fill ms)
# - assembler.ingest mean < 5 ms(driver 端 numpy ops 占比)
#
# 命令(Win box):
#   .venv\Scripts\python -m tools.runs.train configs/dmc/bench_v_legacy_go.toml
#
# I29 R7.1: inference 走 TCP only (SHM inference path 删,与 Python mp wire 等价)。

[meta]
extends = "stage3_b_v_legacy_go.toml"
paradigm = "dmc"
run_label = "bench_v_legacy_go"
host = "remote"

[remote]
ssh = "dev@192.168.31.56"
root = "D:/gicg_dev"
os = "windows"
hostname = "DESKTOP-GHJCC7Q"

[paradigm.dmc]
