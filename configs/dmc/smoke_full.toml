# DMC smoke_full cfg — paradigm-smoke-full-tier (D-601 / A1.6).
#
# Extends configs/dmc/smoke.toml; overrides only:
#   - meta.run_label (distinguish from smoke)
#   - [checkpoint] save_every short cadence (≥ 2 ckpt within run)
#   - [paradigm.dmc] total_frames bumped (≥ 100 step train)
#
# Wall budget: target ≤ 8 min (smoke.toml ran 76 step in 62s on Mac CPU;
# bumping total_frames to 2500 → ~190 step ~ 2.5 min — within budget).

[meta]
extends = "smoke.toml"
paradigm = "dmc"
run_label = "dmc_smoke_full"

[paradigm.dmc]
total_frames = 2500           # smoke=1000 (76 step) → 2500 (~190 step)

[checkpoint]
save_every = 30               # 190 step / 30 = ≥ 6 ckpt files
keep_last_n = 5
