# DMC smoke cfg — `cfg-toml-restructure-paradigm-scoped` N5/N6.
#
# Minimum viable DMC (~3min Mac CPU) for pipeline alive verify.
# Equivalent to `_archived/smoke/dmc_stage3_smoke_v2.toml` intent.
#
# Hybrid TOML structure (N6): [shape] omitted — factory default + per-agent
# override (CC-305).

[meta]
seed = 42
paradigm = "dmc"
run_label = "dmc_smoke"
device = "cpu"

[pipeline]
mode = "serial"
num_actors = 1

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]
team_size = 1
max_rounds = 5
obs_mask = ["enemy_dice"]
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy", "test_basic"]
data_dir = "data"

# [shape] omitted — smoke uses factory default + per-agent override below.

[paradigm.dmc]
version = "1.0.0"
paradigm = "dmc"
epsilon = 0.05
gamma = 1.0
lr = 1e-4
weight_decay = 0.0
batch_size = 16
max_grad_norm = 5.0
buffer_cap = 1000
max_game_steps = 512 # safety ceiling, never a synthetic draw label
total_frames = 1000
train_ratio = 4
eval_interval_episodes = 30
eval_n_scenarios = 8
eval_baselines = ["F1-D2"]

[paradigm.dmc.agent]
d_model = 32
n_cross_layers = 1
dropout = 0.0

[paradigm.dmc.opponent_mix]
random = 0.40
f1d2 = 0.30
f1d4 = 0.00
historical = 0.30
ring_size = 5

[checkpoint]
save_every = 500
keep_last_n = 1
artifacts_root = "artifacts"
