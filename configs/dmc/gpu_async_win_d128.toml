# DMC mp-mode Windows benchmark cfg — 8 actor + d_model=128 (T4).
# production-scale shape stress test (Stage 3 cfg uses d_model=128).

[meta]
extends = "smoke.toml"
paradigm = "dmc"
run_label = "dmc_gpu_async_win_d128"
device = "cuda"

[pipeline]
mode = "async"
num_actors = 8

[paradigm.dmc]
mp_env_factory_path = "training.paradigms.dmc.mp_factories.build_dmc_env_factory"
mp_opp_registry_path = "training.paradigms.dmc.mp_factories.build_dmc_opp_registry"
mp_provider_path = "training.paradigms.dmc.mp_factories.build_dmc_provider"

[paradigm.dmc.agent]
d_model = 128
n_cross_layers = 2

[eval]
n_workers = 1
schedule = "every_1000_steps"
