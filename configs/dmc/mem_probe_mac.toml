# Mem probe ephemeral cfg — mac local short run with production-like DMC + Go
# actor backend。 用于 master-process mem 增长归因(配 GICG_MEM_PROBE=1)。
#
# 选型说明:
# - **不 extends stage3_b_v_legacy**:避免间接依赖 Win-only 字段(device=cuda /
#   remote 段)、override 链长易调错。 此处全字段独立 declare,跑完直接删 cfg
#   不影响 production cfg。
# - **N=4 actor**:Mac CPU 能跑(8 物理核留 driver + InfServer),Win box N=16
#   stress 数据成比例(4272 MB / 12414 frames = 344 KB/frame → mac 4000 frames
#   预期 ~1.3 GB 增长,够看出 root cause 而不撑爆 mac mem)。
# - **buffer_cap=200_000 同 prod**:不缩小 — root cause 可能与 buffer 相关
#   (sync_weights 累积 / state_dict copy 不释放 等),改小可能掩盖问题。 跑 5
#   min 实际 buffer 远未满,理论积累 < 100 MB。
# - **eval/checkpoint 全禁**:probe 期间不写 ckpts(ckpt save 路径如果是 leak
#   源,我们要分开测;这里聚焦 collect+train loop 本身)。
#
# 用法:
#   GICG_MEM_PROBE=1 .venv/bin/python -m tools.runs.train configs/dmc/mem_probe_mac.toml
# 输出走 stderr,建议 `2>/tmp/mem_probe.log` 捕获后分析。
# 终止:Ctrl+C(预期 ~5 min 自终,total_frames 到 8000)。

[meta]
seed = 42
paradigm = "dmc"
run_label = "dmc_mem_probe_mac"
device = "cpu"
host = "local"

[pipeline]
mode = "async"
actor_backend = "go"  # 关键:走 Go-native actor pool(I29),与 Win box 同路径
num_actors = 4

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = [
    "乘胜追击", "以攻代守", "以牙还牙", "以逸待劳", "伏兵之术", "佛跳墙",
    "刺刺猫爪", "占星", "反制", "发现静电", "守正", "星愿", "清洁时间",
    "玄冰", "瞬身之术", "碌碌无为", "美味烧鸡", "荷花酥", "蝶鳞", "西风剑",
    "西风长枪", "诅咒", "速速茶点", "铁剑", "铁弓", "铁枪",
]
team_size = 1
max_rounds = 15
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy"]
data_dir = "data"

[paradigm.dmc]
mp_env_factory_path = "training.paradigms.dmc.mp_factories.build_dmc_env_factory"
mp_opp_registry_path = "training.paradigms.dmc.mp_factories.build_dmc_opp_registry"
mp_provider_path = "training.paradigms.dmc.mp_factories.build_dmc_provider"

total_frames = 8000          # ~5 min Mac wall (N=4 × ~5 fps/actor × 5 min ≈ 6000+)
batch_size = 32
buffer_cap = 200_000         # 同 prod — 不缩小掩盖 leak
lr = 5e-5
max_grad_norm = 1.0

# Disable in-train eval — probe focus on collect+train loop。
eval_interval_episodes = 999_999_999
eval_baselines = []

[paradigm.dmc.agent]
d_model = 128
n_cross_layers = 2

[paradigm.dmc.opponent_mix]
random = 0.20
f1d2 = 0.30
f1d4 = 0.20
historical = 0.30
ring_size = 8

[checkpoint]
save_every = 9_999_999       # don't write ckpts during probe
keep_last_n = 1
artifacts_root = "artifacts"

[eval]
n_workers = 1
schedule = "every_999999_steps"
