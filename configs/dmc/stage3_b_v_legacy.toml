# DMC Stage 3 production — Option B(fixed 赤蝶 vs 墨客 1v1,扩 card_pool 到
# 全 v_legacy 26 张),mp_provider 8-actor async cuda d=128,1M frames。
#
# 配套 IR cutover 2026-05-19 + RC2 + showcase 2026-05-20。pilot 100k
# (000033)已验证 NaN-fix(train_steps cross 12342 无 inf),本 cfg 走
# production scale + 更宽 card_pool 学 deck-building generalization。
#
# Opponent mix(user 2026-05-20 指定):
#   random=0.20  f1d2=0.30  f1d4=0.20(学习上限)  historical=0.30

[meta]
extends = "smoke.toml"
paradigm = "dmc"
run_label = "dmc_stage3_b_v_legacy"
device = "cuda"
host = "remote"

[remote]
ssh = "dev@192.168.31.56"
root = "D:/gicg_dev"
os = "windows"
hostname = "DESKTOP-GHJCC7Q"

[pipeline]
mode = "async"
# bench 2026-05-20:N=16 是 Win 9950X3D 上 fps + mem 最优(37.4 fps,
# 12.6 GB)。N=8 也 work(33.1 fps,8 GB)。N=24 因 CPU oversub OS
# scheduler thrash 倒退到 17 fps,**勿用**。详 backlog I26。
num_actors = 16

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = [
    "乘胜追击", "以攻代守", "以牙还牙", "以逸待劳", "伏兵之术", "佛跳墙",
    "刺刺猫爪", "占星", "反制", "发现静电", "守正", "星愿", "清洁时间",
    "玄冰", "瞬身之术", "碌碌无为", "美味烧鸡", "荷花酥", "蝶鳞", "西风剑",
    "西风长枪", "诅咒", "速速茶点", "铁剑", "铁弓", "铁枪",
]
team_size = 1
max_rounds = 15
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy"]
data_dir = "data"

[paradigm.dmc]
mp_env_factory_path = "training.paradigms.dmc.mp_factories.build_dmc_env_factory"
mp_opp_registry_path = "training.paradigms.dmc.mp_factories.build_dmc_opp_registry"
mp_provider_path = "training.paradigms.dmc.mp_factories.build_dmc_provider"

total_frames = 1_000_000
batch_size = 32
buffer_cap = 200_000
lr = 5e-5
max_grad_norm = 1.0

# Disable in-train eval — Mac-side workflow (rsync ckpts to Mac + eval there)
eval_interval_episodes = 999_999_999
eval_baselines = []

[paradigm.dmc.agent]
d_model = 128
n_cross_layers = 2

[paradigm.dmc.opponent_mix]
random = 0.20
f1d2 = 0.30
f1d4 = 0.20
historical = 0.30
ring_size = 8

[checkpoint]
# 单位 = `state.step`(driver outer iter counter,= `PipelineState.advance(plan)` ++,
# 不是 `state.train_steps` —— `CheckpointManager.should_save` 比 `state.step - last_ckpt_at_step`)。
# DMC steady-state iter rate ≈ 1.85/s (Win N=16 stage3 实测 t=4890s 9071 iter),
# save_every=2500 iter ≈ 1351s ≈ 22 min/ckpt → 1M frame run(~40000s)出 ~30 ckpts。
# 历史误标 「train_steps」(per-iter += train_ratio=4 故 train_steps × 4)由 2026-05-
# 23 user 实测停训发现(Win run 000109 跑 81 min / 9071 iter / 36276 train_steps =
# 0 ckpts),task #8 backlog 决:选 ②「改 cfg + comment」(不动 implementation 防
# 跨 paradigm CFR/BC cfg 同步 recalibrate 大改),implementation `state.step` semantic
# 保持。
save_every = 2_500           # iter; ~22 min/ckpt @ 1.85 iter/s; ~30 ckpts over 1M frame run
keep_last_n = 30             # 全保 给 user 选 哪个 rsync(match save 节奏)
artifacts_root = "artifacts"

# [eval] section is schema-required for mode='async'(schema CS1.1)。设
# 极大 schedule 让在线 gauntlet 实际不触发 — production gauntlet 走 Mac
# (rsync ckpts/ to Mac + `tools.eval.ckpt`),Win 5070 Ti 全力训练。
[eval]
n_workers = 1
schedule = "every_999999_steps"
