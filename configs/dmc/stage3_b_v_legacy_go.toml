# I29 Go-native actor pool variant of stage3_b_v_legacy.toml。
#
# 同 scenario / card_pool / opponent mix / network architecture,仅切 actor_backend
# 走 N 个 standalone `cmd/gicg_actor` subprocess 替代 Python mp.Process pool。
#
# 本 cfg 用途:I29 P1.5 Win box production stress + P3 1M frames benchmark
# 对照实验(Go vs Python baseline)。
#
# 预期(Mac N=4 perf smoke 实测 7+ fps/actor → ~1.75x Python):
#   - N=16 fps ≥ 70(同 Python 35 fps + 2x speedup gate)
#   - Master RSS ≤ 2 GB(Python baseline 11.4 GB N=16)
#   - InfServer process mem ≤ baseline(< 10 GB)
#
# 实测命令(Win box PowerShell):
#   .venv\Scripts\python -m tools.runs.train configs/dmc/stage3_b_v_legacy_go.toml

[meta]
extends = "stage3_b_v_legacy.toml"
paradigm = "dmc"
run_label = "dmc_stage3_b_v_legacy_go"
# host + [remote] 必须 inline — tools.runs.*(_host.py:load_remote_from_cfg)读 leaf
# without extends resolution(per _helpers/paths.py:85),不会从 parent 继承。 同 parent。
host = "remote"

[remote]
profile = "gpu-win"

[pipeline]
actor_backend = "go"  # I29 R7 — N 个独立 gicg_actor subprocess
