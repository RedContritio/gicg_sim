# DMC mp-mode Windows benchmark cfg — P3 GPU collector inference.
#
# Extends smoke.toml + flips pipeline to async + sets cuda device +
# wires mp_*_path factories. Tunable num_actors via override at CLI.

[meta]
extends = "smoke.toml"
paradigm = "dmc"
run_label = "dmc_gpu_async_win"
device = "cuda"

[pipeline]
mode = "async"
num_actors = 8

[paradigm.dmc]
mp_env_factory_path = "training.paradigms.dmc.mp_factories.build_dmc_env_factory"
mp_opp_registry_path = "training.paradigms.dmc.mp_factories.build_dmc_opp_registry"
mp_provider_path = "training.paradigms.dmc.mp_factories.build_dmc_provider"

[eval]
n_workers = 1
schedule = "every_1000_steps"
