# CFR smoke cfg — `cfg-toml-restructure-paradigm-scoped` N5/N6.
#
# Minimum viable CFR (1 iter × 4 traversals;~3min Mac CPU) for
# pipeline alive verify. Frozen-research tier preserved.
#
# Hybrid TOML structure (N6): [shape] omitted — factory default + per-agent
# override (CC-305).

[meta]
seed = 42
paradigm = "cfr"
run_label = "cfr_smoke"
device = "cpu"

[pipeline]
mode = "serial"
num_actors = 1

[scenario]
team_0 = ["赤蝶"]
team_1 = ["赤蝶"]
team_size = 1
max_rounds = 5
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy", "test_basic"]
data_dir = "data"

# [shape] omitted — smoke uses factory default + per-agent override below.

[paradigm.cfr]
version = "1.0.0"
paradigm = "cfr"
advantage_lr = 1e-3
strategy_lr = 1e-3
grad_clip_max_norm = 1.0
advantage_fit_steps_per_iter = 2
strategy_fit_every = 1
strategy_fit_steps = 2
fit_batch_size = 16
advantage_buffer_capacity = 1000
strategy_buffer_capacity = 2000
value_buffer_capacity = 1000
n_iterations = 1
traversals_per_iteration = 4
tier = "frozen-research"

[paradigm.cfr.agent]
d_model = 32
n_cross_layers = 1
dropout = 0.0

[paradigm.cfr.traversal]
sampling_mode = "os"
epsilon = 0.1
# 500 matches cfr smoke_full; legacy smoke value 30 relied on the predecessor
# `tools/run.py --max-steps` driver cap (deleted by T-11 spec C-1 + T-23
# deletion of `tools/run.py` itself) — CFR traversals run until terminal and
# regularly exceed 30 steps, tripping the RuntimeError before any ckpt save.
# Pre-existing smoke_full comment confirms 30 too tight.
max_game_steps = 500
importance_weight_max = 100.0
traverser_alternation = "alternate"

[checkpoint]
save_every = 1
keep_last_n = 1
artifacts_root = "artifacts"
