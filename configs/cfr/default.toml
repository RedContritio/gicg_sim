# CFR production default cfg — `cfg-toml-restructure-paradigm-scoped` N5/N6.
#
# CFR frozen-research tier (paradigm-cfr/spec.md C6.1) defaults
# (advantage / strategy / value buffer 100k-200k;100 iter × 64 traversals).
#
# Routed through `tools/run.py → core.pipeline.run_pipeline → CFRParadigm`.
#
# Hybrid TOML structure (N6): [shape] = CFR historical defaults (d_model=64).

[meta]
seed = 42
paradigm = "cfr"
run_label = "cfr_default"
device = "cpu"

[pipeline]
mode = "serial"
num_actors = 1

[scenario]
team_0 = ["赤蝶"]
team_1 = ["赤蝶"]
team_size = 1
max_rounds = 15
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy", "test_basic"]
data_dir = "data"

# Shared obs schema (N6.4). CFR historical default d_model=64 / n_cross_layers=2.
[shape]
n_counter_slots = 1832
n_hooks = 900
max_tokens_per_hook = 120
max_actions = 2048
d_model = 64
n_cross_layers = 2
dropout = 0.0

[paradigm.cfr]
version = "1.0.0"
paradigm = "cfr"
advantage_lr = 1e-3
strategy_lr = 1e-3
grad_clip_max_norm = 1.0
advantage_reset_each_iter = false
value_loss_alpha = 1.0
advantage_fit_steps_per_iter = 32
strategy_fit_every = 4
strategy_fit_steps = 64
fit_batch_size = 128
advantage_buffer_capacity = 100_000
strategy_buffer_capacity = 200_000
value_buffer_capacity = 100_000
n_iterations = 100
traversals_per_iteration = 64
tier = "frozen-research"

[paradigm.cfr.traversal]
sampling_mode = "os"
epsilon = 0.1
max_game_steps = 400
importance_weight_max = 100.0
traverser_alternation = "alternate"

[checkpoint]
save_every = 10
keep_last_n = 5
artifacts_root = "artifacts"
