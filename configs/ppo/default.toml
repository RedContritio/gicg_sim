# PPO production default cfg — `cfg-toml-restructure-paradigm-scoped` N5/N6.
#
# Routed through `tools.runs.train → core.pipeline.run_pipeline → PPOParadigm`.
#
# Post `ppo-structural-backbone-migration` (#4): PPO uses generic
# ActorCritic with structural fields (n_counter_slots / n_hooks /
# max_ops_per_hook / max_actions + d_model / n_cross_layers /
# dropout) aligned with 4 paradigm shape schema. PPO config dataclass
# remains PPOAgentShapeCfg (not yet ObsShape; future migration), but
# toml structure uses hybrid layout per CC-309.
#
# Hybrid TOML structure (N6): [shape] = shared obs schema (d_model=128
# like 4-paradigm shared base), [paradigm.ppo.agent] overrides d_model=256
# (PPO historical default 256, per CC-302 demonstrates override semantics).

[meta]
seed = 42
paradigm = "ppo"
run_label = "ppo_default"
device = "cpu"

[pipeline]
mode = "serial"
num_actors = 1

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
team_size = 1
max_rounds = 15
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy", "test_basic"]
data_dir = "data"

# Shared obs schema (N6.4). Common 4-paradigm baseline d_model=128.
# PPO overrides below to historical 256 (CC-302).
[shape]
n_counter_slots = 1832
n_hooks = 900
max_ops_per_hook = 64
max_actions = 2048
d_model = 128
n_cross_layers = 2
dropout = 0.0

[paradigm.ppo]
gamma = 0.99
gae_lambda = 0.95
clip_epsilon = 0.2
value_coef = 0.5
entropy_coef = 0.01
lr = 3.0e-4
max_grad_norm = 0.5
n_epochs = 4
minibatch_size = 256
buffer_cap = 50_000
total_iterations = 1000
batch_size = 256

# Override [shape] per CC-302: PPO historical default d_model=256.
# Effective shape: [shape] base merged with this override = d_model=256,
# other fields inherited from [shape].
[paradigm.ppo.agent]
d_model = 256

[paradigm.ppo.rollout]
n_games_per_iter = 32
max_steps_per_game = 200
rollout_opponent = "self"

[checkpoint]
save_every = 100
keep_last_n = 5
artifacts_root = "artifacts"
