# PPO smoke_full cfg — paradigm-smoke-full-tier (D-601 / A1.6).
#
# Extends configs/ppo/smoke.toml; overrides only:
#   - meta.run_label
#   - [checkpoint] save_every short cadence
#   - [paradigm.ppo] total_iterations bumped to ≥ 100 step
#
# STATUS (per SF-105): test_ppo_smoke_full.py currently pytest.skip due to
# pre-existing bug in training/paradigms/ppo/_rollout.py:130
# (`list(getattr(scen, 'card_pool', ()))` fails when scen.card_pool is None).
# Follow-up change: `ppo-rollout-card-pool-none-fix`. Toml pre-tuned for
# when bug is fixed.

[meta]
extends = "smoke.toml"
paradigm = "ppo"
run_label = "ppo_smoke_full"

[paradigm.ppo]
total_iterations = 50         # smoke=1 iter → 50 (~100+ step assuming 2 step/iter)

[paradigm.ppo.rollout]
n_games_per_iter = 2
max_steps_per_game = 30

[checkpoint]
save_every = 15               # 50 step / 15 = ≥ 3 ckpts
keep_last_n = 5
