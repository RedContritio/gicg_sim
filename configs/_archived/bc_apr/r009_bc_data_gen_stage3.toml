# r009_bc_data_gen_stage3: AZ-compatible BC dataset for Stage 3 1-card.
#
# Same teacher + opponent mix as PPO s015/s021 (F1-D2 with mixed F1-D1
# opponents) for direct comparison. Stage 3 1-card spec
# (card_pool=["测试卡_碎片"]) matches s028-s030 (PPO 1-card masked).
#
# Output: artifacts/<ts>_r009_bc_data_gen_stage3/dataset.npz
# Schema: per-game static_obs + per-step (game_id, dyn_obs, action_refs,
#   action_payments, legal_mask, tied_mask, chosen_action, terminal_z)

run_label = "r009_bc_data_gen_stage3"

# Stage 3 1-card env spec (matches PPO s028 / AZ s064)
teams = ["测试角色D"]
fix_dice = "none"  # Stage 1+ uses random roll
max_rounds = 3
card_pool = ["测试卡_碎片"]
data_dir = "data"
obs_mask = ["enemy_dice"]

# Teacher + opponent mix (same as PPO s015)
teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

# Collection target
target_decisions = 50000
max_games = 5000

# AZ ActorCritic max_actions (must match training-time AZConfig)
max_actions = 128

seed = 0

[meta]
paradigm = "bc"
