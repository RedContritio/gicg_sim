# s069 = compute probe: s068 同 spec but n_rollouts 100 → 500 (5×)
#
# 假设: s068 vs F1-D2 = 0.271 (asymmetric mirror-broken),仍 -0.27 below F1-D2
# baseline 0.54。这 -0.27 gap 是 (1) 算法 deficit 还是 (2) compute 不足?
#
# 测: 同 s068 spec,只把 MCTS rollouts 100→500。
# 判据 vs s068 (F1-D2 = 0.271):
#   - s069 F1-D2 ≥ 0.45 → +0.18,大幅闭合 gap → compute 是主要问题,试 s070 longer training
#   - s069 F1-D2 ≈ s068 (0.25-0.30) → 算法 deficit,需要 NFSP/CFR
#
# Multi-seed n=3, host-native, 200g × 5× rollouts ≈ 5× wall = 100min/seed × 3 = ~5h

base = "fixed_1v1"
run_label = "s069_az_d4_more_rollouts_seed42"
seed = 42
seeds = [42, 43, 44]
seed_labels = [
    "s069_az_d4_more_rollouts_seed42",
    "s069_az_d4_more_rollouts_seed43",
    "s069_az_d4_more_rollouts_seed44",
]

n_games = 200
n_workers = 4
batch_size = 64
games_per_arena = 50
arena_games = 20
games_per_gauntlet = 200
gauntlet_games_per_opponent = 16

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_碎片"]
max_rounds = 3
obs_mask = ["enemy_dice"]

[mcts]
n_rollouts = 500  # ← only diff from s068: 100 → 500
lambda_anneal_games = 200
lambda_end = 0.5
backend = "go"

[meta]
paradigm = "az"
