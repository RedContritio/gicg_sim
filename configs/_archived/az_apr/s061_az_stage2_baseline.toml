# s061: AZ Stage 2 baseline (seed=42)。
#
# 与 Stage 1 (s058) 同 spec,**加 obs_mask=["enemy_dice"]** (隐藏对手 dice)。
# 验证 AZ + IS-MCTS determinization 在 hidden info 下是否仍 work。
#
# 关键对照:
# - PPO Stage 2 BC→PPO 路径 PASS (s020 vs F1-D2 = 0.531)
# - PPO Stage 2 vs Stage 1 损失 ~6-8% (enemy dice info value)
# - AZ IS-MCTS 显式处理隐藏信息(每 rollout 重新 determinize),
#   理论上比 PPO partial obs 更鲁棒
#
# Multi-seed n=3 配套 s062 (seed=43) + s063 (seed=44)。
#
# 判据 (Stage 2 比 Stage 1 略宽,因为 hidden info 难度上升):
#   vs random ≥ 0.80 → AZ 栈 work,推 Stage 3 baseline
#   vs random 0.50-0.80 → marginal
#   vs random < 0.50 → AZ + IS-MCTS 在 hidden info 下失败,排查

base = "fixed_1v1"
run_label = "s061_az_stage2_baseline"
seed = 42

n_games = 200
batch_size = 64
games_per_arena = 50
arena_games = 20
games_per_gauntlet = 200
gauntlet_games_per_opponent = 16

[scenario]
team_0 = ["测试角色D"]
team_1 = ["测试角色D"]
card_pool = []
max_rounds = 3
obs_mask = ["enemy_dice"]
# fix_dice omitted → random roll (Stage 1 inherited)

[mcts]
n_rollouts = 100
lambda_anneal_games = 200
lambda_end = 0.5
backend = "go"

[meta]
paradigm = "az"
