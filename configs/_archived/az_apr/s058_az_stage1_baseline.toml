# s058: AZ Stage 1 baseline (seed=42)。
#
# 与 Stage 0 (s055) 同 spec,**只去掉 fix_dice** (骰子每回合随机 roll)。
# 验证 AZ 栈在 stochastic env 下是否仍 work。
#
# 关键对照: PPO Stage 1 pure PPO 失败 (s009-s014 全 < 0.13 vs F1-D2,
# self-play collapse + value scale + opponent overfit 等问题),只在
# BC→PPO 后 PASS (s017, vs F1-D2 = 0.500)。AZ 不用 BC,看 search-based
# 方法在 stochastic env 下能否 work。
#
# Multi-seed n=3 配套 s059 (seed=43) + s060 (seed=44)。
#
# 判据 (与 Stage 0 PASS 后阶梯):
#   vs random ≥ 0.85 → AZ 栈 work,推 Stage 2 baseline
#   vs random 0.55-0.85 → marginal,加长训 / 加 lambda anneal
#   vs random < 0.55 → AZ 栈在 stochastic env 失败,排查

base = "fixed_1v1"
run_label = "s058_az_stage1_baseline"
seed = 42

n_games = 200
batch_size = 64
games_per_arena = 50
arena_games = 20
games_per_gauntlet = 200
gauntlet_games_per_opponent = 16

[scenario]
team_0 = ["测试角色D"]
team_1 = ["测试角色D"]
card_pool = []
max_rounds = 3
# fix_dice omitted → random roll each round (Stage 1 difference vs Stage 0)

[mcts]
n_rollouts = 100
lambda_anneal_games = 200
lambda_end = 0.5
backend = "go"

[meta]
paradigm = "az"
