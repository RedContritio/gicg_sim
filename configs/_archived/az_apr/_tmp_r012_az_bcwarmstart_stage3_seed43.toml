# r010 = Phase 5 paradigm-pivot 验证 run。
#
# AZ + BC warm-start (Stage 3 1-card masked),目标:
#   - 突破 PPO Stage 3 ceiling 0.34
#   - 突破 AZ pure self-play Stage 3 plateau 0.10-0.15
#   - 多 seed dual judge: vs F1-D2 ≥ 0.40 stricter PASS
#
# 同 spec 与 s064-066 (AZ pure self-play Stage 3 baseline) 唯一差别:
# `init_from_ckpt` 指向 r009 BC pretrain 最佳 ckpt。
#
# Multi-seed: tools.multi_seed_launch 解析 `seeds = [...]`,自动:
#   - 顺序分配 r010/r011/r012 NNN
#   - seed42 用 base label,后续加 _seedN 后缀(同 s064/s065/s066 convention)
#   - 串行启动 (VM 18GB 限,单容器 ~14GB)
#   - 聚合三 seed gauntlet → mean ± std + dual judge
#
# r009 BC ckpt 选择:tools.multi_seed_launch 启动前需手动填 `init_from_ckpt`。
# 当前候选 (data/wakeup/2026-04-28 早间):
#   ep=2: F1-D2=0.8125 单点最高;F1-D{2,3} mean 0.75
#   ep=3: F1-D2=0.7500 / F1-D3=0.7500 — 最稳
#   ep≥5: 待 r009 完工 + 各 ep gauntlet 后选
# 选择规则: F1-D{2,3} mean 最高;并列时选 epoch 较晚 (value 更优)。

base = "fixed_1v1"
run_label = "r012_az_bcwarmstart_stage3_seed43"
seed = 43

# r009 BC ckpt 路径,启动前由人工/自动 ckpt 选择规则填入
init_from_ckpt = "artifacts/202604270918_r009_bc_pretrain_stage3/epoch_3.pt"

n_games = 200
n_workers = 4  # 容器内 selfplay+train 串行 → 加 worker 解决,同 r001-r006 production 标准
batch_size = 64
games_per_arena = 50
arena_games = 20
games_per_gauntlet = 200
gauntlet_games_per_opponent = 16

[scenario]
team_0 = ["测试角色D"]
team_1 = ["测试角色D"]
card_pool = ["测试卡_碎片"]
max_rounds = 3
obs_mask = ["enemy_dice"]

[mcts]
n_rollouts = 100
lambda_anneal_games = 200
lambda_end = 0.5
backend = "go"

[meta]
paradigm = "az"
