# r003: same scenario as r001/r002 (team_size=2 random, 400g, go backend)
# but with two new engine/MCTS features on top of r002's fast_lambda:
#
#   1. char_skill_refs obs region + SkillSlotPerm shuffle (commit 3c2ee89):
#      Agent sees opponent skills as explicit per-(p,c,s) refs instead of
#      having to correlate skill_id → owner via legal_actions. Shape
#      changes (5d → 6d state), so NOT loadable from r001/r002 ckpts.
#
#   2. MCTS ExpandUnionK=3 (commit 1c7c922): at first leaf expand,
#      sample 3 dice-pool variants and union their legal actions with
#      per-type dedup. D1 (addNewActionsUniform) triggers less often,
#      and D1-added actions get network-informed priors instead of 1/n
#      uniform placeholders — expected to cut "uniform contamination"
#      of π_target that we saw drive r002's policy loss up + entropy
#      up over training.
#
# Lambda anneal INTENTIONALLY kept at fast_400 (matching r002) even
# though r002 lost to r001 in gauntlet (r002 vs mcts_200 = 0.30 vs
# r001's 0.55). The reason: r003 is a controlled A/B vs r002. Holding
# the anneal schedule fixed isolates the effect of the two new
# features. If r003 beats r002 meaningfully → features help (ship
# them). Separate run (r004?) will test anneal schedule after we
# know whether features are worth keeping.

base = "random_1v1"
run_label = "r003_obs_union_400g"

n_games = 400
n_workers = 4
batch_size = 64
games_per_arena = 100
games_per_gauntlet = 200
checkpoint_every_n_games = 100

# ⚠ DEPRECATED: this run used expand_union_k=3, since removed from the
# codebase (the over-expansion design only varied dice, not hand/deck,
# and failed to suppress D1 — see docs/5_history/audits/determinize_audit.md
# + s005 smoke data). The config is kept as historical record. To
# actually re-launch, remove the expand_union_k reference from below
# (it is NOT a valid MCTSConfig field anymore) and expect slightly
# different behavior (the K=3 union is gone).
[mcts]
parallel_rollouts = 4
backend = "go"
lambda_anneal_games = 400
# expand_union_k = 3   # REMOVED — see header

[train]
delta_aux_coef = 1.0

[scenario]
team_size = 2
disjoint_teams = true

# r003 competes against r002. r001_mcts_200 also included as a weaker
# baseline so the gauntlet has two reference points.
[[gauntlet_model_opponents]]
name = "r002_mcts_200"
ckpt_path = "artifacts/202604191713_r002_fast_lambda_400g/final_champion.pt"
rollouts = 200

[[gauntlet_model_opponents]]
name = "r001_mcts_200"
ckpt_path = "artifacts/202604190744_r001_randteam2_400g/final_champion.pt"
rollouts = 200

[meta]
paradigm = "az"
