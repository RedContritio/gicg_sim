# s067 = Stage 4 empirical test (lite): AZ pure self-play on Stage 3 spec
# extended to **multi-card pool** — isolates "combinatorial depth" as the
# complexity dimension that might unlock RL value.
#
# 用户问: r010 (Stage 3 1-card) RL 是负面效果,后面 stage 还有用吗?
# 这个 baseline 测最便宜的"复杂度提升"维度: 卡池 1→3。
# 不引入新角色(BC 只见过 测试角色D),不引入元素反应(避免 mirror match
# 反应自抵消)。对照 s064-066 (Stage 3 1-card AZ pure self-play F1-D2=0.104):
#   - s067 F1-D2 ≥ 0.20 → RL 受益于 combinatorial breadth → 推 Stage 4 production
#   - s067 F1-D2 ≤ 0.15 → RL plateau 结构性,与 stage 复杂度无关 → curriculum closure
#
# 100g × 3 seed,~30-60min total host-native (n_workers=4)。
# Multi-seed via tools.multi_seed_launch --host configs/s067_*.toml
# 同一 NNN s067 + seedN suffix(新 convention)。

base = "fixed_1v1"
run_label = "s067_az_stage3_multicard_baseline_seed42"
seed = 42
seeds = [42, 43, 44]
seed_labels = [
    "s067_az_stage3_multicard_baseline_seed42",
    "s067_az_stage3_multicard_baseline_seed43",
    "s067_az_stage3_multicard_baseline_seed44",
]

n_games = 100
n_workers = 4
batch_size = 64
games_per_arena = 50
arena_games = 20
games_per_gauntlet = 100
gauntlet_games_per_opponent = 16

[scenario]
team_0 = ["测试角色D"]
team_1 = ["测试角色D"]
card_pool = ["测试卡_碎片", "测试卡_增幅", "测试卡_神秘水流"]
max_rounds = 3
obs_mask = ["enemy_dice"]

[mcts]
n_rollouts = 100
lambda_anneal_games = 100
lambda_end = 0.5
backend = "go"

[meta]
paradigm = "az"
