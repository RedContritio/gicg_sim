# r005A: K=3 消融。r004 去掉 expand_union_k=3(fallback 默认 1 = 禁用 union)。
#
# 动机:r003(fast+K=3)=0.25 比 r002(fast,no K)=0.30 更差,r004(slow+K=3)
# 已观察到 g300 arena 只 0.30、policy 反弹。怀疑 K=3 本身就是锅。r005A 保留
# r004 其余一切(slow anneal、char_skill_refs obs、团队结构),**仅**关 K=3,
# 测 "新 obs 框架下,去掉 K=3 能否回到 r001 0.55 水准"。
#
# ⚠ r005A 和 r001 并非严格等价:r005A 用 char_skill_refs(6d state)+ mirror
# filter + talent shared-load。MCTS 搜索路径因 K=1 和 r001-era 一致(commit
# 1c7c922 声明 bit-identical),但其他 commit 改变过网络输入和 hook 行为。
# r005A 测的是消融 K=3,不是严格回归 r001。
#
# 预期判断:
#   r005A ≈ 0.55(r001 水准):K=3 是主锅,彻底放弃 expand_union_k
#   r005A ≈ 0.40-0.50:K=3 贡献大部分伤害,char_skill_refs 有次要影响
#   r005A ≈ 0.25-0.30(r003/r004 水准):char_skill_refs 也有锅,需进一步消融
#   r005A < 0.25:说明有未知回归,要 bisect commit 历史

base = "random_1v1"
run_label = "r005A_slow_nounion_400g"

n_games = 400
n_workers = 4
batch_size = 64
games_per_arena = 100
games_per_gauntlet = 200
checkpoint_every_n_games = 100

[mcts]
parallel_rollouts = 4
backend = "go"
# lambda_anneal_games 省略 → 默认 slow 1500
# expand_union_k 省略 → 默认 1(等效禁用 union 路径,和 r001 era MCTS 一致)

[train]
delta_aux_coef = 1.0

[scenario]
team_size = 2
disjoint_teams = true

# r001/r002/r003/r004 ckpt 在 obs shape 或 union 语义上不兼容,省略
# model_opponents。gauntlet 仅用 mcts_50/100/200 作参考对手。

[meta]
paradigm = "az"
