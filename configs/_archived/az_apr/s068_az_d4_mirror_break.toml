# s068 = D4 mirror-breaking probe (RL closure 后续算法 sweep 第 1 个)
#
# 假设: AZ self-play 在 mirror match (team_0 == team_1) 收敛到 Nash 50/50,
# 没 gradient 方向 → RL 不能 learn。
#
# 测: 把 team_0/team_1 改不同角色(赤蝶 vs 墨客),其他同 s064 (Stage 3 1-card,
# n_games=200, 1 card pool, max_rounds=3, obs_mask=enemy_dice)。
# 唯一变量 = teams 是否 mirror。
#
# 判据 vs s064-066 (mirror baseline F1-D2=0.104):
#   - s068 F1-D2 > +0.10 (即 ≥ 0.20) → mirror IS the lock,RL 可破 → 优先 NFSP
#   - s068 F1-D2 ≤ +0.05 (即 ≤ 0.15) → mirror 不是主因 → 优先 belief network
#
# Multi-seed n=3,host-native,~30min。
# Stage 4-lite 改用了 cards;这次专门改 teams,正交变量。

base = "fixed_1v1"
run_label = "s068_az_d4_mirror_break_seed42"
seed = 42
seeds = [42, 43, 44]
seed_labels = [
    "s068_az_d4_mirror_break_seed42",
    "s068_az_d4_mirror_break_seed43",
    "s068_az_d4_mirror_break_seed44",
]

n_games = 200
n_workers = 4
batch_size = 64
games_per_arena = 50
arena_games = 20
games_per_gauntlet = 200
gauntlet_games_per_opponent = 16

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_碎片"]
max_rounds = 3
obs_mask = ["enemy_dice"]

[mcts]
n_rollouts = 100
lambda_anneal_games = 200
lambda_end = 0.5
backend = "go"

[meta]
paradigm = "az"
