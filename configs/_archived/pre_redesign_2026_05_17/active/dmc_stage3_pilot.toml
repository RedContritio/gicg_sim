# DMC Phase 3.5 — Stage 3 pilot 20k frames (~15-30 min wall on 5070 Ti)
# 目标:测准 fps + 看 vs F1-D2 早期 trend → 决定是否扩 100k / Stage 3 full
#
# 注:base="stage3" 继承 stage3_config defaults (d_model=128 / n_cross_layers=2 /
#    eval.interval_minutes=60 / eval.n_scenarios=128)。Pilot override 仅:
#    total_frames + save_interval + eval.enabled (in-process for first pilot)。

base = "stage3"

total_frames = 20000              # 20k transitions ~ 15-30 min wall
batch_size = 32
buffer_cap = 20000                # 缩到 20k (相比 stage3 100k) 不浪费 VRAM
save_interval_minutes = 5         # pilot 多存 ckpt 看趋势
write_artifacts = true
run_label = "dmc_stage3_pilot_20k"

device = "cuda"                   # 5070 Ti

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]
team_size = 1
max_rounds = 10
obs_mask = ["enemy_dice"]
deck_padding = {card = "碌碌无为", target_size = 15}
pool = ["v_legacy", "test_basic"]

[agent]
d_model = 128
n_cross_layers = 2

[opponent_pool]
random = 0.30
f1d2 = 0.30
f1d4 = 0.10
historical = 0.30
ring_size = 20

[eval]
enabled = true                    # pilot 用 in-process eval (无 Mac daemon)
interval_minutes = 5              # pilot 多 eval 看 trend (vs stage3 60min)
n_scenarios = 32                  # pilot 缩到 32 (vs stage3 128) 减 eval wall
baselines = ["random", "F1-D2"]   # pilot 只测 floor + F1-D2 (省 D4 时间)

[meta]
paradigm = "dmc"
