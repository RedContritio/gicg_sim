# DMC Phase 3.5 — Stage 3 single-process pilot on Windows GPU
# 1 char asymmetric(team_0=赤蝶, team_1=墨客)+ 2 简单卡 + obs_mask + random dice
# Single-process actor + learner; learner forward on CUDA 5070 Ti.
# Target: vs F1-D2 WP ≥ 0.50 over multi-eval-round trajectory.
#
# 注:single-process @ ~10-30 fps,2e9 frames 不现实
#    本 cfg 设 100M frames pilot,~14-25h wall on 5070 Ti(看 GPU forward 加速比 CPU 多少)。
#    如果 directional signal 出现(WP > 0.30 at end),再考虑 multi-process actor 扩到 2e9。

base = "smoke"

# Training scale
total_frames = 100_000_000        # 100M pilot,16-25h on 5070 Ti
batch_size = 32
buffer_cap = 100000               # 100k transitions ring buffer
save_interval_minutes = 30        # ckpt 每 30 min
write_artifacts = true
run_label = "dmc_stage3_pilot"

# Compute
device = "cuda"                   # 5070 Ti

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]
team_size = 1
max_rounds = 10                   # 统一 10,timeout.lua 在 round 10 做先手方判负 tiebreak
obs_mask = ["enemy_dice"]
deck_padding = {card = "碌碌无为", target_size = 15}
pool = ["v_legacy", "test_basic"]

[agent]
d_model = 128                     # Stage 3 full d_model
n_cross_layers = 2

[opponent_pool]
random = 0.30
f1d2 = 0.30
f1d4 = 0.10                       # 全 opp mix per decision #4
historical = 0.30
ring_size = 20

[eval]
# Stage 3 GPU train 走 Mac eval daemon 异步路径(tools/eval/daemon.py),
# in-process eval 关闭以让 GPU wall time 全用于训练(review C.4 / E.2)。
enabled = false
interval_minutes = 60             # 仅在 daemon 端使用
n_scenarios = 128                 # 仅在 daemon 端使用
baselines = ["random", "F1-D2", "F1-D4"]   # random 作 floor sanity (review D.3)

[meta]
paradigm = "dmc"
