# Python-backend tiny smoke — 3g twin of smoke_go_tiny.toml for A/B
# timing comparison. Same n_games / n_workers / parallel_rollouts so
# wall-clock and mcts_profile diffs reflect only the backend swap.

base = "random_1v1"
run_label = "smoke_python_tiny"

n_games = 3
n_workers = 2
batch_size = 32
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 3

[mcts]
parallel_rollouts = 2
backend = "python"

[train]
delta_aux_coef = 1.0

[meta]
paradigm = "az"
