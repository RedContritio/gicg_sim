# Resume continuation cfg — pick up from dmc_resume_test, run 500 more frames
base = "smoke"
total_frames = 1000
batch_size = 8
buffer_cap = 200
save_interval_minutes = 0
write_artifacts = true
run_label = "dmc_resume_test"      # SAME run_label as initial
resume_from = "artifacts/202605141213_dmc_resume_test"

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]
team_size = 1
max_rounds = 5
obs_mask = ["enemy_dice"]
deck_padding = {card = "碌碌无为", target_size = 15}
pool = ["v_legacy", "test_basic"]

[agent]
d_model = 16
n_cross_layers = 1

[opponent_pool]
random = 0.50
f1d2 = 0.50
f1d4 = 0.0
historical = 0.0
ring_size = 5

[eval]
interval_minutes = 60
n_scenarios = 4
baselines = ["F1-D2"]

[meta]
paradigm = "dmc"
