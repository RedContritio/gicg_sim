# Smoke 2v2 — 20g team_size=2, no arena/gauntlet. Sanity check for
# the team_size=2 path before launching a full shipped_2v2 run.

base = "random_1v1"
run_label = "smoke_2v2"

n_games = 20
n_workers = 4
batch_size = 64
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 10

[mcts]
parallel_rollouts = 4

[train]
delta_aux_coef = 1.0

[scenario]
team_size = 2
team_0 = ["赤蝶", "墨客"]
team_1 = ["猫咪", "刻师傅"]
disjoint_teams = true

[meta]
paradigm = "az"
