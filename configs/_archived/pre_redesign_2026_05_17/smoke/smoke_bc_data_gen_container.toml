# Smoke test for AZ-compatible BC dataset gen, runnable inside container.
# Tiny target so the whole gen + train smoke completes in <60s.

run_label = "smoke_bc_data_gen"

teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = ["测试卡_碎片"]
data_dir = "data"
obs_mask = ["enemy_dice"]

teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

target_decisions = 2000
max_games = 200
max_actions = 128
seed = 0

[meta]
paradigm = "bc"
