# v_phase2_smoke — 验证 v_phase2 池能跑 RL 训练管线 (最小 smoke)。
#
# 全真实数据 (data/cleaned/character + action 严格对照):
#   - 凯亚 (5375, Ice, HP 10) mirror 1v1
#   - 6 张真实卡:旅行剑 / 魔导绪论 / 甜甜花酿鸡 / 蒙德土豆饼 / 派蒙 / 鸣神大社
#   - pool 仅 v_phase2 (不 union v_legacy / test_basic)
#   - deck 长度 = eligible (6 张, 无 "碌碌无为" padding)
#
# 目标:证明 GicgEnv + AZ 训练管线在 v_phase2 池下不挂,产出 1-2 个 ckpt。
# 不指望学到强 baseline (20 game 太少 + 简化机制 deferred 多)。

base = "fixed_1v1"
run_label = "v_phase2_smoke"

n_games = 20
n_workers = 1
batch_size = 32
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 10

[scenario]
team_0 = ["凯亚"]
team_1 = ["凯亚"]
card_pool = ["旅行剑", "魔导绪论", "甜甜花酿鸡", "蒙德土豆饼", "派蒙", "鸣神大社"]
pool = ["v_phase2"]
max_rounds = 15

[mcts]
n_rollouts = 50
parallel_rollouts = 2

[meta]
paradigm = "az"
