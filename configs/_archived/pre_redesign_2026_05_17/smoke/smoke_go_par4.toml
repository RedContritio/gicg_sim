# Go-backend smoke at parallel_rollouts=4 to stress the pipeline
# depth. Expect higher server-side batch_mean with Phase D
# (N rollout goroutines + 2 dispatchers).

base = "random_1v1"
run_label = "smoke_go_par4"

n_games = 3
n_workers = 2
batch_size = 32
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 3

[mcts]
parallel_rollouts = 4
backend = "go"

[train]
delta_aux_coef = 1.0

[meta]
paradigm = "az"
