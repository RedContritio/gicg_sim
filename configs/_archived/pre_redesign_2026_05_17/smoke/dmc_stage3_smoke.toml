# DMC Phase 3.4 — Mac CPU smoke (single-process)
# Verify pipeline (loss + replay + actor loop + eval protocol) on Mac CPU.
# Target: ~5-10 min total run, see loss go down + eval emit + non-zero WP.

base = "smoke"

# Training reduce
total_frames = 5000             # ~5-7 min on Mac, force ≥1 eval round
batch_size = 16
buffer_cap = 5000
save_interval_minutes = 2
write_artifacts = true
run_label = "dmc_stage3_smoke"
num_actors = 1                  # Phase 3.5 unified entry: single-actor smoke

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]
team_size = 1
max_rounds = 10                  # 统一 10,timeout.lua 在 round 10 做先手方判负 tiebreak
obs_mask = ["enemy_dice"]
deck_padding = {card = "碌碌无为", target_size = 15}
pool = ["v_legacy", "test_basic"]

[agent]
d_model = 32
n_cross_layers = 1

[opponent_pool]
random = 0.40
f1d2 = 0.30
f1d4 = 0.0                       # 0 in smoke (slow); enable in stage3 full
historical = 0.30
ring_size = 5

[eval]
interval_minutes = 1             # smoke: 1 min cadence
n_scenarios = 4                  # smoke: minimal, fast eval round
baselines = ["F1-D2"]

[meta]
paradigm = "dmc"
