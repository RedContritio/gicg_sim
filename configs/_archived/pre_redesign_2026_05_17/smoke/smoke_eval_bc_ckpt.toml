# Phase 4 verify: 7-baseline ladder eval on smoke BC ckpt to confirm the
# eval pipeline works end-to-end inside containers (eval_service receives
# dispatched matchups, runs them, writes gauntlet_results.jsonl).
#
# This is *not* a quality gate — the smoke ckpt is 2-epoch on 2k decisions
# and will likely score low. Goal is just to verify the pipeline.

socket = "/var/run/gicg/eval.sock"
ckpt = "artifacts/202604270212_smoke_bc_pretrain/final.pt"
out_dir = "artifacts/202604270212_smoke_bc_pretrain"

teams = ["测试角色D"]
card_pool = ["测试卡_碎片"]
max_rounds = 3
obs_mask = ["enemy_dice"]
fix_dice = "none"
games_per_cell = 8  # n=16 per matchup with swap_sides
seed = 0

[meta]
paradigm = "bc"
