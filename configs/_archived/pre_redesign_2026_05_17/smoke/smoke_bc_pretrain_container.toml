# Smoke test for AZ BC pretrain inside container.
# 2 epoch on the smoke dataset (2k decisions) — should complete in <1min.

run_label = "smoke_bc_pretrain"
dataset_path = "artifacts/202604270111_smoke_bc_data_gen/dataset.npz"
seed = 0

n_counter_slots = 1832
n_hooks = 900
max_tokens_per_hook = 120
max_actions = 128
d_model = 128
n_cross_layers = 2
dropout = 0.1

lr = 1e-4
batch_size = 64
n_epochs = 2
value_coef = 0.5
held_out_frac = 0.1

device = "cpu"

[meta]
paradigm = "bc"
