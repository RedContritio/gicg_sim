# Tiny Go-backend smoke — 3g just to validate the full train_az loop
# runs to completion with backend="go". Faster catch-any-crash than
# smoke_go.toml when iterating on the migration itself.

base = "random_1v1"
run_label = "smoke_go_tiny"

n_games = 3
n_workers = 2
batch_size = 32
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 3

[mcts]
parallel_rollouts = 2
backend = "go"

[train]
delta_aux_coef = 1.0

[meta]
paradigm = "az"
