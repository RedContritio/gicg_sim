# Shipped 1v1 — C1v7 architecture (structural sid pinning +
# per-slot struct_readout), 400g on random 1v1.

base = "random_1v1"
run_label = "shipped_1v1"

n_games = 400
n_workers = 4
batch_size = 64
games_per_arena = 100

[mcts]
parallel_rollouts = 4
# Go backend validated in Phase A (s001 vs s002, 2026-04-19):
# 19% wall-time speedup, no loss regression, aligned with Python
# async D1 behavior. See docs/4_runs/registry.md.
backend = "go"

[train]
delta_aux_coef = 1.0

# Model-baseline gauntlet opponents. Each future shipped_1v1 run
# measures improvement against r001's final champion at MCTS@200.
[[gauntlet_model_opponents]]
name = "r001_mcts_200"
ckpt_path = "artifacts/202604190744_r001_randteam2_400g/final_champion.pt"
rollouts = 200

[meta]
paradigm = "az"
