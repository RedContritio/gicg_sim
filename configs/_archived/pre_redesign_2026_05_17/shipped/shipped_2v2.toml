# Shipped 2v2 — team_size=2 with fixed eval pair, validates C1v7
# architecture under doubled team scale.
# disjoint_teams=true dodges issue #152 (shared char on both sides →
# hook double-registration).

base = "random_1v1"
run_label = "shipped_2v2"

n_games = 200
n_workers = 4
batch_size = 64
games_per_arena = 100
checkpoint_every_n_games = 100

[mcts]
parallel_rollouts = 4
backend = "go"

[train]
delta_aux_coef = 1.0

[scenario]
team_size = 2
team_0 = ["赤蝶", "墨客"]
team_1 = ["猫咪", "刻师傅"]
disjoint_teams = true

# Model-baseline gauntlet opponent — r001 (team_size=2 random,
# 400g, mcts_200=0.55). Keeps improvement measurement meaningful
# once pure-MCTS opponents saturate.
[[gauntlet_model_opponents]]
name = "r001_mcts_200"
ckpt_path = "artifacts/202604190744_r001_randteam2_400g/final_champion.pt"
rollouts = 200

[meta]
paradigm = "az"
