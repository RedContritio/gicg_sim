# s018: BC teacher trajectory collection for Stage 2 (partial obs).
#
# Stage 2 = Stage 1 spec (fix_dice=None, random-roll) + Python-layer
# obs_mask=['enemy_dice']. Teacher still uses full game state via
# snapshot/restore simulation — its decisions don't depend on obs,
# only the student (PPO net) obs will be masked.
#
# Record teacher action + tied set same as s015. Student will learn
# from this mid-fidelity signal: "given partial obs, predict teacher's
# decision made under full info". Student generalizes only if the
# obs still contains enough info for most decisions (hypothesis:
# enemy dice affect which skills they can afford, but most of Stage 1
# mirror 测试角色D scoring doesn't depend on enemy dice directly).
#
# Note about 'reset' vs 'data reuse': obs_mask lives on env at runtime
# (post-processing), so s015 dataset can NOT be reused for Stage 2 —
# env built for data gen must have obs_mask set so recorded obs
# already reflects masking.

run_label = "s018_bc_data_gen_stage2"

teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = []
data_dir = "data"

# Stage 2 partial observability
obs_mask = ["enemy_dice"]

teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

target_decisions = 50000
max_games = 5000

max_actions = 128
seed = 0

[meta]
paradigm = "bc"
