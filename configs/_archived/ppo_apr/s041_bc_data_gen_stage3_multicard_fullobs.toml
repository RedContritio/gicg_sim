# s041: multi-card BC data gen with FULL observation (obs_mask=[]).
#
# P2.3 extension: tests if removing enemy_dice mask is sufficient
# to recover Stage 3 multi-card pipeline. If multi-card full-obs
# also PASSes vs F1-D2 ≥ 0.40, partial obs alone is the dominant
# factor — cards complexity adds little once obs is full.

run_label = "s041_bc_data_gen_stage3_multicard_fullobs"

teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = ["测试卡_增幅", "测试卡_碎片"]
data_dir = "data"

obs_mask = []

teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

target_decisions = 50000
max_games = 8000

max_actions = 128
seed = 0

[meta]
paradigm = "bc"
