# Single-worker Go backend — same shape as bench_python_1w, only
# differs in backend. For isolating Go MCTS overhead vs Python.

base = "random_1v1"
run_label = "bench_go_1w"

n_games = 5
n_workers = 1
batch_size = 32
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 5

[mcts]
parallel_rollouts = 2
backend = "go"

[train]
delta_aux_coef = 1.0

[meta]
paradigm = "az"
