# s054: PPO from scratch (no BC warm-start) 1-card fullobs F1-D2 baseline.
# Tests whether BC warm-start is necessary, or even beneficial. Compare
# against s033/39/40 (1-card fullobs F1-D2 BC+PPO mean F1-D2 = 0.344).
# If scratch ≥ 0.20 → BC contribution moderate; if < 0.10 → BC is dominant.
# Hparam diff vs fine-tune configs: lr=3e-4 (3× higher) and entropy_coef=0.01
# (3× higher) — scratch needs aggressive exploration to escape random init,
# while fine-tune from BC needs conservative steps to preserve teacher prior.

run_label = "s054_ppo_scratch_1card_fullobs"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 1500
eval_every = 50
n_eval_games = 64
lr = 3e-4
entropy_coef = 0.01
value_coef = 0.1
seed = 0

obs_mask = []
card_pool = ["测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
