# s053: PPO 1000-iter on s032 BC base — tests "PPO 500 iter is undertrained"
# hypothesis. If iter 500-1000 shows monotone vs F1-D2 wr improvement →
# undertraining. If oscillation around the same 0.20-0.40 range →
# instability ceiling, not undertraining.

run_label = "s053_ppo_finetune_stage3_1card_fullobs_long"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 1000
eval_every = 50
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1
seed = 0

obs_mask = []
card_pool = ["测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604251709_s032_bc_pretrain_stage3_1card_fullobs/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
