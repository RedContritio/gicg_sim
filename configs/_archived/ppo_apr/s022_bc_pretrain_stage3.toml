# s022: BC pretrain on Stage 3 data (s021).
#
# Same arch + hparams as s016d (Stage 1) / s019 (Stage 2): d_model=1024,
# n_hidden=4, 60 epoch, soft target. Comparison vs s019 (Stage 2 soft
# match=66.2%) quantifies how much hidden hand/deck state + card
# decisions reduce BC ceiling further. If soft_match stays ≥ 50%,
# Stage 3 PPO fine-tune has enough starting signal.

run_label = "s022_bc_pretrain_stage3"

dataset = "artifacts/202604250653_s021_bc_data_gen_stage3/dataset.npz"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_epochs = 60
batch_size = 256
lr = 3e-4
lr_end = 3e-5
value_coef = 0.1
grad_clip = 0.5
val_split = 0.1
seed = 0
device = "cpu"

log_every = 1000

[meta]
paradigm = "bc"
