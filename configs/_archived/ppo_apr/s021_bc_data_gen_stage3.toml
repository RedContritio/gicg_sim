# s021: BC teacher trajectory collection for Stage 3 (Stage 2 + card pool).
#
# Stage 3 adds two L1 cards to 测试角色D mirror setup:
#   - 测试卡_增幅 (2 match cost, next skill dmg ×2)
#   - 测试卡_碎片 (1 any cost, 1 Physical damage)
# Plus 碌碌无为 filler auto-loaded.
#
# curriculum plan line 298: introduces hidden hand/deck state + expanded
# legal action space. Cards × skills combinatorics → more complex
# strategies but simple cards (single-use damage boost + small
# deterministic damage) shouldn't explode complexity.
#
# obs_mask inherited from Stage 2 (enemy_dice hidden).

run_label = "s021_bc_data_gen_stage3"

teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = ["测试卡_增幅", "测试卡_碎片"]
data_dir = "data"

obs_mask = ["enemy_dice"]

teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

target_decisions = 50000
max_games = 8000  # loose cap; actual run stopped at ~5000 games (same
                  # decisions/game as Stage 2, post-hoc observation)

max_actions = 128
seed = 0

[meta]
paradigm = "bc"
