# s023: PPO fine-tune from s022 BC ckpt on Stage 3 env.
#
# Same fine-tune hparams as s020 (Stage 2 PASS): lr=1e-4, entropy=0.003,
# mix opponent, 500 iter. Stage 3 env-shape overrides: obs_mask +
# card_pool both explicit below.
#
# Go/No-go: vs F1-D2 ≥ 0.40 → Stage 3 PASS.
# curriculum plan line 306: ≥ 0.65 vs random → 进 Stage 4;
#                           ≤ 0.50 → 需 reward shaping 强化.

run_label = "s023_ppo_finetune_stage3"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 500
eval_every = 25
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1

# Stage 3 env-shape overrides
obs_mask = ["enemy_dice"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604250723_s022_bc_pretrain_stage3/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
