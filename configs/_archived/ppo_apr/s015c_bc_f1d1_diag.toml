# s015c: F1-D1 teacher 诊断数据集 (5k decisions)。
#
# F1-D2 MLP BC plateau at 37%, hypothesis: teacher depth=2 lookahead
# is beyond MLP forward-pass capability. F1-D1 是 1-ply greedy (max HP delta
# per legal action),理论上 obs 已经包含所有必要信息 → MLP 该能学到。
#
# 若 F1-D1 BC match ≥ 70%: 证实 lookahead 是 bottleneck,F1-D2 BC 需要
#   attention 或 action-level simulation
# 若 F1-D1 BC 也 plateau < 50%: obs 本身缺关键信号

run_label = "s015c_bc_f1d1_diag"

teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = []
data_dir = "data"

teacher = "F1-D1"                     # 1-ply, no lookahead
teacher_dice_greedy = true
opponent_mix = ["F1-D1", "F1-D2"]     # diverse opponents

target_decisions = 5000
max_games = 1000

max_actions = 128
seed = 0

[meta]
paradigm = "bc"
