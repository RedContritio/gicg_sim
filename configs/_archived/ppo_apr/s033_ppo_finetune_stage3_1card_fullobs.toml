# s033: PPO fine-tune from s032 BC (1-card full-obs).
#
# P2.3 ablation: only diff vs s028 is obs_mask=[] (full obs).
# Compare s033 vs F1-D2 wr against s028 (0.219) to measure partial obs cost.

run_label = "s033_ppo_finetune_stage3_1card_fullobs"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 500
eval_every = 25
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1
seed = 0

obs_mask = []
card_pool = ["测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604251709_s032_bc_pretrain_stage3_1card_fullobs/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
