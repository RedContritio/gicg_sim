# s045: 1-card F1-D3 teacher PPO seed=2 (multi-seed reinforce s036).

run_label = "s045_ppo_finetune_stage3_1card_d3teacher_seed2"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 500
eval_every = 25
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1
seed = 2

obs_mask = ["enemy_dice"]
card_pool = ["测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604251744_s035_bc_pretrain_stage3_1card_d3teacher/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
