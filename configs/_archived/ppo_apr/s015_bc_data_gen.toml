# s015: BC teacher trajectory collection for Stage 1.
#
# F1-D2 teacher validated 2026-04-25 at Stage 1 env:
#   vs random=1.000, vs F1-D1=0.891, vs F1-D2 mirror=0.656 (P0-优势).
# Stage 1 F1-D3 marginally stronger (F1-D3 vs F1-D2 = 0.703) but 4× slower
# per game, picking F1-D2 for ROI (matches r009_plan §2 rationale).
#
# Per-game setup: teacher_side ∈ {0, 1} uniform, opponent uniform from
# [F1-D2, F1-D1]. 50% mirror + 50% vs easier opp for distribution diversity.
# Only teacher-side decisions recorded. Forced moves (legal=1) dropped.
#
# Data target: 50k decisions. Est: each game ~15-20 teacher decisions
# (half of ~30-40 total per game), so ~3000-3500 games. Teacher wall
# ~1-3s/game on Stage 1 → 50-150min total. Hard cap at 5000 games.

run_label = "s015_bc_data_gen"

# Stage 1 env: random dice (fix_dice="none"), no cards, max_rounds=3,
# 测试角色D mirror. All stage identity lives in this TOML (no Python
# preset for stages; see training/ppo/config.py module docstring).
teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = []
data_dir = "data"

# Teacher + opponent mix
teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

# Collection target
target_decisions = 50000
max_games = 5000

# Misc
max_actions = 128  # must match PPOConfig.max_actions (128 covers Stage 1 p99=92)
seed = 0

[meta]
paradigm = "bc"
