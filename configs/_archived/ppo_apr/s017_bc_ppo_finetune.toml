# s017: PPO fine-tune from s016d BC pretrain ckpt.
#
# Loads s016d state_dict into PPONet (same arch: d_model=1024,
# n_hidden=4, max_actions=128), runs PPO with:
#   - lr 1e-4 (from 3e-4 default): don't blow away BC warm-start
#   - entropy_coef 0.003 (from 0.01): BC already committed policy
#   - rollout_opponent: mix F1-D1+F1-D2 (s014 config) for distribution
#     breadth that avoids opponent-overfit
#   - terminal 10 + value_coef 0.1: s011 fix (value learnable + policy
#     gradient not dominated)
#
# Go/No-go: vs F1-D2 ≥ 0.40 → Stage 1 PASS (finally)
#   0.25-0.40 MARGINAL → iterate on fine-tune hparams
#   < 0.25 → fine-tune destroyed BC warm-start, add KL penalty or
#            lower lr further.

base = "default"
run_label = "s017_bc_ppo_finetune"

# Arch must match s016d for state_dict load
d_model = 1024
n_hidden_layers = 4
max_actions = 128

# Fine-tune hparams (conservative — don't blow warm-start)
n_iterations = 500
eval_every = 25
n_eval_games = 64  # new default, tighter CI
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1

# Mixed opponent (s014) — but now from strong warm-start
rollout_opponent = "F1-D1,F1-D2"

# Warm-start from BC ckpt
init_ckpt = "artifacts/202604250513_s016d_bc_d1024_60ep/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
