# s011: s010 + reward/loss scale fixes.
#
# First layer of diagnosis fixes from first-principles analysis of
# s010 failure:
#   - terminal_win/loss 60→10: return magnitude ±80 → ±25, so
#     value target becomes learnable
#   - value_coef 0.5→0.1: trunk gradient share shifts from
#     ~75% value to ~5% value, policy head regains signal
#
# Result (2026-04-25 03:03, wall=115s): PARTIAL.
#   value_loss 300→13 (confirmed 20× reduction as predicted) ✓
#   loss 150→1.3 (value no longer dominates total loss) ✓
#   BUT random=0.750/F1-D1=0.062/F1-D2=0.000 still FAIL.
#   Second layer problem: self-play collapse. Mirror match + random
#   dice → both sides Tune → draw dynamics → no terminal signal
#   → agent never learns to attack. → s012 breaks self-play.

base = "default"
run_label = "s011_stage1_terminal10_vc0.1"

n_iterations = 500
eval_every = 25
n_eval_games = 16

value_coef = 0.1

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
