# s028: PPO fine-tune from s027 BC ckpt on Stage 3 env with reduced
# card_pool (1 card only, 测试卡_碎片).
#
# Diagnostic for "cards complexity is dominant factor for Stage 3 F1-D2 FAIL"
# hypothesis (project_session_2026_04_25_resume option (e)).
# Same hparams as s023 (Stage 3 multi-card seed=0) so the only diff vs
# s023/s024/s025 is card_pool size — clean controlled comparison.
#
# Judge:
# - vs F1-D2 ≥ 0.40 → cards complexity confirmed as dominant factor;
#   next step multi-seed reinforce + advance to Stage 4 once 1-card stable
# - vs F1-D2 < 0.20 → cards count is NOT the root; problem is in BC
#   pipeline (soft target collapse / teacher ceiling / fine-tune hparams)

run_label = "s028_ppo_finetune_stage3_1card"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 500
eval_every = 25
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1
seed = 0

# Stage 3 env-shape overrides — match s026/s027
obs_mask = ["enemy_dice"]
card_pool = ["测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604251612_s027_bc_pretrain_stage3_1card/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
