# s025: Stage 3 PPO fine-tune, seed=2 (third sample for s023/s024/s025
# multi-seed F1-D2 estimate). See s024 header for rationale.

run_label = "s025_stage3_seed2"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 500
eval_every = 25
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1
seed = 2

obs_mask = ["enemy_dice"]
card_pool = ["测试卡_增幅", "测试卡_碎片"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604250723_s022_bc_pretrain_stage3/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
