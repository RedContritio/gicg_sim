# s031: 1-card BC data gen with FULL observation (obs_mask=[]).
#
# P2.3 ablation: tests "partial obs (enemy_dice mask) is contributing
# factor for Stage 3 F1-D2 FAIL". Same env as s026 except obs_mask=[].
# If downstream BC→PPO vs F1-D2 jumps significantly above s028 (1-card
# masked, 0.219), partial obs in cards env is a key factor.

run_label = "s031_bc_data_gen_stage3_1card_fullobs"

teams = ["测试角色D"]
fix_dice = "none"
max_rounds = 3
card_pool = ["测试卡_碎片"]
data_dir = "data"

obs_mask = []

teacher = "F1-D2"
teacher_dice_greedy = true
opponent_mix = ["F1-D2", "F1-D1"]

target_decisions = 50000
max_games = 8000

max_actions = 128
seed = 0

[meta]
paradigm = "bc"
