# s020: PPO fine-tune from s019 BC ckpt on Stage 2 env.
#
# Same fine-tune hparams as s017 (Stage 1 PASS): lr=1e-4, entropy=0.003,
# mix opponent, 500 iter. Stage 2 variation is the explicit
# obs_mask=["enemy_dice"] override below, threaded by rollout/eval/
# probe to zero enemy dice slots in _get_obs.
#
# Go/No-go: vs F1-D2 ≥ 0.40 → Stage 2 PASS (partial obs learnable).
# curriculum plan line 294: < 0.65 vs random → hidden info problem.

base = "default"
run_label = "s020_ppo_finetune_stage2"

d_model = 1024
n_hidden_layers = 4
max_actions = 128

n_iterations = 500
eval_every = 25
n_eval_games = 64
lr = 1e-4
entropy_coef = 0.003
value_coef = 0.1

# Stage 2 partial observability (explicit; no longer inherited from a
# Python preset — see training/ppo/config.py module docstring)
obs_mask = ["enemy_dice"]

rollout_opponent = "F1-D1,F1-D2"
init_ckpt = "artifacts/202604250605_s019_bc_pretrain_stage2/final.pt"

[reward_shaping]
terminal_win = 10.0
terminal_loss = 10.0

[meta]
paradigm = "ppo"
