# Single-worker Python baseline — isolates backend cost without
# cross-worker batching. parallel_rollouts=2 keeps Python on the
# mcts_search_parallel path.

base = "random_1v1"
run_label = "bench_python_1w"

n_games = 5
n_workers = 1
batch_size = 32
games_per_arena = 0
games_per_gauntlet = 0
checkpoint_every_n_games = 5

[mcts]
parallel_rollouts = 2
backend = "python"

[train]
delta_aux_coef = 1.0

[meta]
paradigm = "az"
