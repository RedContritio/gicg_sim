# ExIt async on 56: z-value-target arm with GPU inference (new production recipe
# after run 000078 smoke passed: local_inference=false + InferenceServer cuda).
# Master stays CPU. Diff vs exit_async_cpu56.toml: value_target_source="z",
# local_inference=false, [pipeline.inference] device="cuda". Note z+GPU differs
# from the mv arm in two dimensions (target source AND inference device) — mv
# 已判阴性，本臂的目标是验证"换用 z 目标 + GPU 推理"的可用配方，不再追求
# 单变量隔离。save_every=50（慢对局制度下半小时级粒度），tb 含 loss 分项。
[meta]
seed = 42
paradigm = "az"
run_label = "exit_async_z_gpu"
host = "remote"
device = "cpu"

[pipeline]
mode = "async"
num_actors = 8

[pipeline.inference]
placement = "local"
device = "cuda"

[remote]
profile = "gpu-win"

[scenario]
pool = "native_latest"
data_dir = "data"
obs_mask = ["enemy_dice"]
team_0 = ["凯亚", "迪卢克", "芭芭拉"]
team_1 = ["砂糖", "菲谢尔", "芭芭拉"]
char_pool = ["凯亚", "迪卢克", "芭芭拉", "砂糖", "菲谢尔"]
team_size = 3
disjoint_teams = false
max_rounds = 10
random_deck_size = 30
card_pool = ["一掷乾坤", "交给我吧！", "光辉的季节", "兽肉薄荷卷", "冷血之剑", "北地烟熏鸡", "噬星魔鸦", "换班时间", "星天之兆", "最好的伙伴！", "本大爷还没有输！", "派蒙", "流火焦灼", "混元熵增论", "烤蘑菇披萨", "甜甜花酿鸡", "白垩之术", "莲花酥", "蒙德土豆饼", "运筹帷幄", "送你一程", "鸣神大社", "鹤归之时"]

[shape]
n_counter_slots = 1832
n_hooks = 900
max_ops_per_hook = 128
max_actions = 2048
d_model = 32
n_cross_layers = 1
dropout = 0.0

[paradigm.az]
version = "1.0.0"
paradigm = "az"
local_inference = false
lr = 1e-3
weight_decay = 0.0
batch_size = 256
buffer_cap = 50_000
priority_weight = 3.0
max_game_steps = 512
total_games = 256
train_steps_per_game = 4
min_buffer_before_train = 64

[paradigm.az.fixed_opponent]
type = "greedy"
features = "F1"
depth = 2
dice_greedy = true
random = 0.0
greedy = 0.7
historical = 0.3
ring_size = 20

[paradigm.az.mcts]
# n_rollouts 16→8: profiling (09-19, tools bench) showed per-eval net-dispatch
# overhead dominates MCTS wall (eval_s 41-64% of game wall, ~5ms/eval for the
# d32 net); halving rollouts ≈1.7x episode speedup at a modest search-quality
# cost acceptable for selfplay data gen. parallel_rollouts=16 feeds the
# InferenceServer batcher (max_batch 32, timeout 3ms).
n_rollouts = 8
c_puct = 1.4
dirichlet_alpha = 0.3
dirichlet_eps = 0.25
temperature = 1.0
temperature_switch_step = 15
max_rollout_depth = 100
parallel_rollouts = 16
lambda_anneal_games = 1500
lambda_start = 0.0
lambda_end = 0.8
backend = "python"

[paradigm.az.train]
l2_coef = 1e-4
max_grad_norm = 1.0
value_target_source = "z"
entropy_coef = 0.01
delta_aux_coef = 0.1

[checkpoint]
save_every = 50
keep_last_n = 8
artifacts_root = "artifacts"

[eval]
n_workers = 1
schedule = "every_100000_steps"
