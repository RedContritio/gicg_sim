# AZ smoke_full cfg — paradigm-smoke-full-tier (D-601 / A1.6).
#
# Extends configs/az/smoke.toml; overrides only:
#   - meta.run_label (distinguish from smoke)
#   - [checkpoint] save_every short cadence (≥ 2 ckpt within run)
#   - [paradigm.az] total_games bumped to ≥ 30 (~3 step / game ~ 100 step)
#
# STATUS (per SF-105): test_az_smoke_full.py currently pytest.skip due to
# pre-existing bug in training/paradigms/az/collector.py:72
# (`_card_pool_spec = resolve_pool_refs(...)` returns dict instead of
# CardPoolSpec). Follow-up change: `az-pool-spec-type-fix`. This toml is
# scaffolded for when the bug is fixed — `extends` + cadence are pre-tuned.

[meta]
extends = "smoke.toml"
paradigm = "az"
run_label = "az_smoke_full"

[paradigm.az]
total_games = 30              # smoke=2 games → 30 (~100+ step)
max_game_steps = 100

[paradigm.az.mcts]
n_rollouts = 2                # keep MCTS cheap (smoke=8 → 2 to fit 8min wall)

[checkpoint]
save_every = 10               # 30 step / 10 = ≥ 3 ckpts
keep_last_n = 5
