[meta]
seed = 42
paradigm = "az"
run_label = "exit_ws_skeleton"
host = "local"
device = "cpu"

[pipeline]
mode = "async"
num_actors = 1

[scenario]
pool = "native_latest"
data_dir = "data"
obs_mask = ["enemy_dice"]
team_0 = ["凯亚", "迪卢克", "芭芭拉"]
team_1 = ["砂糖", "菲谢尔", "芭芭拉"]
char_pool = ["凯亚", "迪卢克", "芭芭拉", "砂糖", "菲谢尔"]
team_size = 3
disjoint_teams = false
max_rounds = 10
random_deck_size = 30
card_pool = ["一掷乾坤", "交给我吧！", "光辉的季节", "兽肉薄荷卷", "冷血之剑", "北地烟熏鸡", "噬星魔鸦", "换班时间", "星天之兆", "最好的伙伴！", "本大爷还没有输！", "派蒙", "流火焦灼", "混元熵增论", "烤蘑菇披萨", "甜甜花酿鸡", "白垩之术", "莲花酥", "蒙德土豆饼", "运筹帷幄", "送你一程", "鸣神大社", "鹤归之时"]

[shape]
n_counter_slots = 1832
n_hooks = 900
max_ops_per_hook = 128
max_actions = 2048
d_model = 32
n_cross_layers = 1
dropout = 0.0

[paradigm.az]
version = "1.0.0"
paradigm = "az"
local_inference = true
lr = 1e-3
weight_decay = 0.0
batch_size = 64
buffer_cap = 50_000
priority_weight = 3.0
max_game_steps = 512
total_games = 2
train_steps_per_game = 1
min_buffer_before_train = 1

[paradigm.az.fixed_opponent]
type = "greedy"
features = "F1"
depth = 2
dice_greedy = true
random = 0.0
greedy = 0.7
historical = 0.3
ring_size = 20

[paradigm.az.mcts]
n_rollouts = 4
c_puct = 1.4
dirichlet_alpha = 0.3
dirichlet_eps = 0.25
temperature = 1.0
temperature_switch_step = 15
max_rollout_depth = 50
parallel_rollouts = 1
lambda_anneal_games = 1500
lambda_start = 0.0
lambda_end = 0.8
backend = "python"

[paradigm.az.train]
l2_coef = 1e-4
max_grad_norm = 1.0
value_target_source = "z"
entropy_coef = 0.01
delta_aux_coef = 0.1

[checkpoint]
save_every = 500
keep_last_n = 4
artifacts_root = "artifacts"

[eval]
n_workers = 1
schedule = "every_100000_steps"
