# Historical ExIt warm-start arm. Paused: the RL16→AZ transplant is not behaviorally equivalent.
# encoder+policy 迁移进 AZ（149 共享键 shape 精确 + Q头→policy头，
# value/delta 头重新初始化；转换器 tools/ckpt/convert_rl16_to_az.py）。
# 配方 = z 目标 + Go MCTS backend + 本地推理 + n_rollouts=8，
# --resume 注入热启动权重（手工注册 run dir + metadata.toml）。
# 动机：D2 战役 RL16 已达 42–44% vs F1-D2（ExIt z 臂 140 局仅 5–6%），
# 训练侧假设已穷尽，ExIt 搜索侧训练叠在 RL16 上是最有希望打通 50% 的路径。
# save_every=50，tb 含 loss 分项。
[meta]
seed = 42
paradigm = "az"
run_label = "exit_ws_rl16"
host = "remote"
device = "cpu"

[pipeline]
mode = "async"
num_actors = 8

# Go MCTS backend + per-actor local nets: measured 09-19 on Mac (same seeds,
# n_rollouts=8): python tree 3.0-3.9s/game vs go tree 2.0-2.2s/game (~1.7x).
# The go search calls eval callbacks synchronously per leaf, so pairing it
# with the GPU InferenceServer would serialize IPC per leaf — local
# inference is the coherent mode. GPU sits idle by design under this
# recipe (CPU-bound workload, see exit_pilot_20260918.md).
[pipeline.inference]
placement = "local"
device = "cpu"

[remote]
profile = "gpu-win"

[scenario]
pool = "native_latest"
data_dir = "data"
obs_mask = ["enemy_dice"]
team_0 = ["凯亚", "迪卢克", "芭芭拉"]
team_1 = ["砂糖", "菲谢尔", "芭芭拉"]
char_pool = ["凯亚", "迪卢克", "芭芭拉", "砂糖", "菲谢尔"]
team_size = 3
disjoint_teams = false
max_rounds = 10
random_deck_size = 30
card_pool = ["一掷乾坤", "交给我吧！", "光辉的季节", "兽肉薄荷卷", "冷血之剑", "北地烟熏鸡", "噬星魔鸦", "换班时间", "星天之兆", "最好的伙伴！", "本大爷还没有输！", "派蒙", "流火焦灼", "混元熵增论", "烤蘑菇披萨", "甜甜花酿鸡", "白垩之术", "莲花酥", "蒙德土豆饼", "运筹帷幄", "送你一程", "鸣神大社", "鹤归之时"]

[shape]
n_counter_slots = 1832
n_hooks = 900
max_ops_per_hook = 128
max_actions = 2048
d_model = 32
n_cross_layers = 1
dropout = 0.0

[paradigm.az]
version = "1.0.0"
paradigm = "az"
local_inference = true
lr = 1e-3
weight_decay = 0.0
batch_size = 256
buffer_cap = 50_000
priority_weight = 3.0
max_game_steps = 512
total_games = 256
train_steps_per_game = 4
min_buffer_before_train = 64

[paradigm.az.fixed_opponent]
type = "greedy"
features = "F1"
depth = 2
dice_greedy = true
random = 0.0
greedy = 0.7
historical = 0.3
ring_size = 20

[paradigm.az.mcts]
# n_rollouts 16→8: profiling (09-19, tools bench) showed per-eval net-dispatch
# overhead dominates MCTS wall (eval_s 41-64% of game wall, ~5ms/eval for the
# d32 net); halving rollouts ≈1.7x episode speedup at a modest search-quality
# cost acceptable for selfplay data gen. parallel_rollouts=16 feeds the
# InferenceServer batcher (max_batch 32, timeout 3ms).
n_rollouts = 8
c_puct = 1.4
dirichlet_alpha = 0.3
dirichlet_eps = 0.25
temperature = 1.0
temperature_switch_step = 15
max_rollout_depth = 100
parallel_rollouts = 1
lambda_anneal_games = 1500
lambda_start = 0.0
lambda_end = 0.8
backend = "go"

[paradigm.az.train]
l2_coef = 1e-4
max_grad_norm = 1.0
value_target_source = "z"
entropy_coef = 0.01
delta_aux_coef = 0.1

[checkpoint]
# step counter counts go-backend search steps (~1000/s aggregate across 8
# actors), NOT episodes — 50 would checkpoint every ~50ms. 150000 ≈ every
# 2.5 min. Episode milestones drive the actual readout cadence.
save_every = 150000
keep_last_n = 8
artifacts_root = "artifacts"

[eval]
n_workers = 1
schedule = "every_100000_steps"
