# AZ production default cfg — `cfg-toml-restructure-paradigm-scoped` N5/N6.
#
# Mirrors `_archived/shipped/fixed_1v1.toml` intent in the unified
# pipeline cfg schema. AZ historical 1v1 baseline (赤蝶 vs 墨客)
# d_model=128 + MCTS rollouts=200 + lambda anneal 1500 games.
#
# Routed through `tools.runs.train → core.pipeline.run_pipeline → AZParadigm`.
#
# Hybrid TOML structure (N6): [shape] shared obs schema + [paradigm.az.X]
# paradigm-scoped sub-sections. [shape] base, [paradigm.az.agent] override
# (dict merge, per CC-303). AZ default d_model=128 matches shared [shape],
# so [paradigm.az.agent] is empty (uses [shape] entirely as override).

[meta]
seed = 42
paradigm = "az"
run_label = "az_default"
device = "cpu"

[pipeline]
mode = "serial"
num_actors = 1

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
team_size = 1
max_rounds = 15
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy", "test_basic"]
data_dir = "data"

# Shared obs schema (N6.4). AZ historical default d_model=128 / n_cross_layers=2.
[shape]
n_counter_slots = 1832
n_hooks = 900
max_ops_per_hook = 64
max_actions = 2048
d_model = 128
n_cross_layers = 2
dropout = 0.0

# Paradigm-scoped 顶层 hparam (N6.2).
[paradigm.az]
version = "1.0.0"
paradigm = "az"
lr = 1e-3
weight_decay = 0.0
batch_size = 256
buffer_cap = 50_000
priority_weight = 3.0
max_game_steps = 400
total_games = 2000
train_steps_per_game = 4
min_buffer_before_train = 256

[paradigm.az.mcts]
n_rollouts = 200
c_puct = 1.4
dirichlet_alpha = 0.3
dirichlet_eps = 0.25
temperature = 1.0
temperature_switch_step = 15
max_rollout_depth = 400
lambda_anneal_games = 1500
lambda_start = 0.0
lambda_end = 0.8
backend = "python"

[paradigm.az.train]
l2_coef = 1e-4
max_grad_norm = 1.0
value_target_source = "z"
entropy_coef = 0.01
delta_aux_coef = 0.1

[checkpoint]
save_every = 500
keep_last_n = 5
artifacts_root = "artifacts"
