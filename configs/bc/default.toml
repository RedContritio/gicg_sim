# BC production default cfg — `cfg-toml-restructure-paradigm-scoped` N5/N6.
#
# Mirrors `_archived/smoke/smoke_bc_pretrain_container.toml` intent in the
# unified pipeline cfg schema. BC pre-train on expert dataset
# (CE hard target / d_model=32 / 60 epochs).
#
# Routed through `tools.runs.train → core.pipeline.run_pipeline → BCParadigm`.
# Dataset path SHALL be set via CLI --override paradigm.bc.dataset_path=...;
# this default leaves empty (collector raise if not overridden).
#
# Hybrid TOML structure (N6): [shape] = BC historical defaults (d_model=32).
# [paradigm.bc.agent] absent → factory + [shape] merge gives effective shape.

[meta]
seed = 42
paradigm = "bc"
run_label = "bc_default"
device = "cpu"

[pipeline]
mode = "serial"
num_actors = 1

[scenario]
team_0 = ["赤蝶"]
team_1 = ["墨客"]
team_size = 1
max_rounds = 15
# F4 显式 deck(2026-06-12):引擎不再静默截断 eligible > target_size 的 deck。
# 以下 = 截断时代实际生效的 15 张(probe 实测,字节序),bit 级不变:
# P1(墨客)守正 入列把 荷花酥 挤出 — 两侧 deck 不同。
deck_0 = [
    "乘胜追击", "以攻代守", "以牙还牙", "伏兵之术", "佛跳墙", "占星", "反制",
    "测试卡_增幅", "测试卡_碎片", "测试卡_神秘水流", "清洁时间", "玄冰", "瞬身之术",
    "美味烧鸡", "荷花酥",
]
deck_1 = [
    "乘胜追击", "以攻代守", "以牙还牙", "伏兵之术", "佛跳墙", "占星", "反制",
    "守正", "测试卡_增幅", "测试卡_碎片", "测试卡_神秘水流", "清洁时间", "玄冰",
    "瞬身之术", "美味烧鸡",
]
deck_padding = { card = "碌碌无为", target_size = 15 }
pool = ["v_legacy", "test_basic"]
data_dir = "data"

# Shared obs schema (N6.4). BC historical default d_model=32 / n_cross_layers=1.
[shape]
n_counter_slots = 1832
n_hooks = 900
max_ops_per_hook = 128
max_actions = 2048
d_model = 32
n_cross_layers = 1
dropout = 0.0

[paradigm.bc]
version = "1.0.0"
paradigm = "bc"
# Required: set via override / change before run.
dataset_path = ""
held_out_frac = 0.1
loss_kind = "ce"
value_coef = 0.0
lr = 1e-4
weight_decay = 0.0
batch_size = 256
grad_clip = 1.0
n_epochs = 60
buffer_cap = 1_000_000

[checkpoint]
save_every = 10000
keep_last_n = 5
artifacts_root = "artifacts"
