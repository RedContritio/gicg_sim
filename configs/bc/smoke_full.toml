# BC smoke_full cfg — paradigm-smoke-full-tier (D-601 / A1.6).
#
# Extends configs/bc/smoke.toml; overrides only:
#   - meta.run_label
#   - [checkpoint] save_every short cadence
#   - [paradigm.bc] n_epochs bumped to ≥ 100 step (epoch_steps = dataset/bs)
#
# The smoke_full test creates an isolated NPZ fixture and supplies its path
# through an override; production runs still provide their own dataset.

[meta]
extends = "smoke.toml"
paradigm = "bc"
run_label = "bc_smoke_full"

[paradigm.bc]
n_epochs = 100                # smoke=1 epoch → 100 (state.step counter = epoch)

[checkpoint]
save_every = 30               # 100 epoch / 30 = ≥ 3 ckpts
keep_last_n = 5
